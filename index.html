<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>한국어 도장 · KIIP 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --bg-alt:#181c26;
    --card:#1e2330;
    --card-hi:#252b3a;
    --border:#2c3244;
    --text:#EEF0F6;
    --text-dim:#9AA1B8;
    --text-faint:#6B7188;
    --gold:#E8B34A;
    --gold-dim:#c99a3c;
    --white-belt:#F5F5F0;
    --yellow-belt:#F2C744;
    --green-belt:#3FAE68;
    --blue-belt:#3E72E0;
    --red-belt:#E1524C;
    --danger:#E1524C;
    --ok:#3FAE68;
    --radius:16px;
    --radius-sm:10px;
    --font-display:'Song Myung', serif;
    --font-body:'Noto Sans KR', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--text);
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 26px),
      radial-gradient(circle at 15% 0%, #1a1f2c 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #171b26 0%, transparent 50%),
      var(--bg);
    min-height:100vh;
    line-height:1.5;
  }
  #app{max-width:920px; margin:0 auto; padding:20px 16px 60px;}

  /* Top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px 22px;
    border-bottom:1px solid var(--border);
    margin-bottom:22px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:50%;
    background:conic-gradient(from 45deg, var(--white-belt), var(--yellow-belt), var(--green-belt), var(--blue-belt), var(--red-belt), var(--white-belt));
    flex-shrink:0;
  }
  .brand-name{font-family:var(--font-display); font-size:22px; letter-spacing:0.5px;}
  .brand-sub{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:1px; text-transform:uppercase;}
  .user-chip{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--text-dim);}
  .user-chip b{color:var(--text);}
  .link-btn{
    background:none; border:none; color:var(--text-faint); font-size:13px; cursor:pointer;
    text-decoration:underline; padding:0; font-family:var(--font-body);
  }
  .link-btn:hover{color:var(--text-dim);}

  /* Cards / layout */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:28px;
    margin-bottom:18px;
  }
  .card-narrow{max-width:440px; margin:40px auto;}
  h1{font-family:var(--font-display); font-size:30px; margin:0 0 6px; font-weight:400;}
  h2{font-family:var(--font-display); font-size:23px; margin:0 0 14px; font-weight:400;}
  h3{font-size:16px; margin:0 0 10px; color:var(--text-dim); font-weight:700;}
  p.lead{color:var(--text-dim); font-size:14px; margin:0 0 22px;}
  .field{margin-bottom:16px;}
  label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  input[type=text], input[type=password], input[type=number], input[type=tel], select, textarea{
    width:100%; background:var(--bg-alt); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:var(--radius-sm); font-size:15px; font-family:var(--font-body);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--gold-dim); outline-offset:1px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media(max-width:520px){ .row2, .row3{grid-template-columns:1fr;} }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--gold); color:#1a1406; border:none; font-weight:700; font-size:15px;
    padding:12px 20px; border-radius:var(--radius-sm); cursor:pointer; width:100%;
    font-family:var(--font-body); transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{background:#f0bd5e;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-outline{
    background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600;
  }
  .btn-outline:hover{background:var(--card-hi); border-color:var(--text-faint);}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{background:#f16a64;}
  .btn-sm{padding:7px 12px; font-size:13px; width:auto;}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap;}
  .btn-row .btn{width:auto; flex:1;}

  .msg{padding:11px 14px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:16px;}
  .msg-error{background:rgba(225,82,76,0.12); color:#ff9d98; border:1px solid rgba(225,82,76,0.3);}
  .msg-ok{background:rgba(63,174,104,0.12); color:#8fe0ac; border:1px solid rgba(63,174,104,0.3);}
  .msg-info{background:rgba(62,114,224,0.12); color:#9cbcff; border:1px solid rgba(62,114,224,0.3);}

  /* Belt strip - signature element */
  .belt-strip{
    position:relative; height:34px; border-radius:8px; overflow:hidden;
    background:repeating-linear-gradient(90deg, #23283a 0 6px, #262c40 6px 12px);
    border:1px solid var(--border); margin:14px 0 6px;
  }
  .belt-strip-fill{
    height:100%; display:flex; align-items:center;
    transition:width .5s ease;
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 4px, transparent 4px 9px);
  }
  .belt-knot{
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width:22px; height:22px; border-radius:50%; border:2px solid var(--bg);
    box-shadow:0 0 0 2px rgba(255,255,255,0.25);
  }
  .belt-caption{display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); font-family:var(--font-mono);}

  .grid-cards{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:560px){ .grid-cards{grid-template-columns:1fr;} }
  .action-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; cursor:pointer; text-align:left; width:100%; font-family:var(--font-body); color:var(--text);
    transition:border-color .15s ease, transform .1s ease;
  }
  .action-card:hover{border-color:var(--gold-dim); transform:translateY(-2px);}
  .action-card .icon{font-size:26px; margin-bottom:8px; display:block;}
  .action-card .title{font-weight:700; font-size:16px; margin-bottom:4px;}
  .action-card .desc{font-size:12.5px; color:var(--text-faint);}

  .badge{
    display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;
    font-family:var(--font-mono); letter-spacing:0.3px;
  }
  .badge-pending{background:rgba(232,179,74,0.15); color:var(--gold);}
  .badge-approved{background:rgba(63,174,104,0.15); color:var(--ok);}
  .badge-rejected{background:rgba(225,82,76,0.15); color:var(--danger);}

  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .table-wrap table{min-width:560px;}
  th,td{text-align:left; padding:9px 8px; border-bottom:1px solid var(--border);}
  th{color:var(--text-faint); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.5px;}
  tr:last-child td{border-bottom:none;}
  .rank-1{color:var(--gold); font-weight:800;}
  .rank-2{color:#cfd4e4; font-weight:700;}
  .rank-3{color:#c98a52; font-weight:700;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .tab{
    background:none; border:none; color:var(--text-faint); padding:10px 14px; cursor:pointer;
    font-size:14px; font-weight:600; border-bottom:2px solid transparent; font-family:var(--font-body);
  }
  .tab.active{color:var(--gold); border-bottom-color:var(--gold);}

  .quiz-q{font-size:17px; margin-bottom:18px; line-height:1.6; white-space:pre-line;}
  .quiz-opt{
    display:block; width:100%; text-align:left; background:var(--bg-alt); border:1px solid var(--border);
    color:var(--text); padding:13px 16px; border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer;
    font-size:14.5px; font-family:var(--font-body);
  }
  .quiz-opt:hover{border-color:var(--gold-dim);}
  .quiz-opt.selected{border-color:var(--gold); background:rgba(232,179,74,0.08);}
  .quiz-opt.correct{border-color:var(--ok); background:rgba(63,174,104,0.12); color:#c8f2d6;}
  .quiz-opt.wrong{border-color:var(--danger); background:rgba(225,82,76,0.12); color:#ffc4c0;}
  .quiz-progress{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); margin-bottom:6px;}

  .passage-box{
    background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:20px; font-size:18px; line-height:2.1; margin:16px 0;
  }
  .rword{padding:1px 2px; border-radius:4px; transition:background .15s ease, color .15s ease;}
  .rword.playing{background:var(--gold); color:#1a1406;}
  .rword.played{background:rgba(63,174,104,0.25); color:#c8f2d6;}
  .speed-row{display:flex; gap:8px; margin:12px 0 18px;}
  .speed-btn{
    background:var(--bg-alt); border:1px solid var(--border); color:var(--text-dim); padding:7px 14px;
    border-radius:999px; font-size:12.5px; cursor:pointer; font-family:var(--font-body);
  }
  .speed-btn.active{background:var(--gold); color:#1a1406; border-color:var(--gold); font-weight:700;}
  .divider{border-top:1px dashed var(--border); margin:24px 0; position:relative; text-align:center;}
  .divider span{
    position:relative; top:-11px; background:var(--card); padding:0 12px; font-size:12px; color:var(--text-faint);
    font-family:var(--font-mono);
  }
  .mic-btn{
    width:84px; height:84px; border-radius:50%; border:none; cursor:pointer; font-size:30px;
    background:var(--card-hi); border:2px solid var(--border); color:var(--text); margin:8px auto; display:block;
    transition:all .15s ease;
  }
  .mic-btn.recording{background:var(--danger); border-color:var(--danger); animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,82,76,0.5);} 70%{box-shadow:0 0 0 16px rgba(225,82,76,0);} 100%{box-shadow:0 0 0 0 rgba(225,82,76,0);}}
  .score-big{font-family:var(--font-mono); font-size:52px; font-weight:700; text-align:center; margin:6px 0;}
  .score-label{text-align:center; color:var(--text-faint); font-size:12px; font-family:var(--font-mono); letter-spacing:1px; text-transform:uppercase;}

  .empty{text-align:center; padding:40px 20px; color:var(--text-faint);}
  .footer-note{text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:30px; font-family:var(--font-mono);}
  .level-pill{
    display:inline-flex; align-items:center; gap:6px; background:var(--bg-alt); border:1px solid var(--border);
    padding:6px 12px; border-radius:999px; font-size:13px; margin:3px 4px 3px 0; cursor:pointer; color:var(--text);
  }
  .level-pill .dot{width:10px; height:10px; border-radius:50%;}
  .level-pill.active{border-color:var(--gold); background:rgba(232,179,74,0.1);}
  .spinner{
    width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); border-top-color:var(--gold);
    animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  a{color:var(--gold);}

  /* ===== 캡처/유출 방지 관련 스타일 ===== */
  #app, body{
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  }
  input, textarea{
    -webkit-user-select:text; -moz-user-select:text; -ms-user-select:text; user-select:text;
  }
  #watermark-overlay{
    position:fixed; inset:0; z-index:9998; pointer-events:none;
    background-repeat:repeat; opacity:0.16;
  }
  #capture-blur-guard{
    position:fixed; inset:0; z-index:9999; display:none;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    background:rgba(10,10,14,0.55);
    align-items:center; justify-content:center; text-align:center;
    color:#fff; font-size:15px; padding:24px;
  }
  #capture-blur-guard.show{display:flex;}
  .copyright-banner{
    font-size:11px; color:var(--muted, #999); text-align:center;
    padding:8px 12px; opacity:0.85; line-height:1.5;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="watermark-overlay"></div>
<div id="capture-blur-guard">화면을 벗어나 문제가 가려졌습니다.<br>다시 돌아오면 자동으로 표시됩니다.</div>

<script>
/* ============================================================
   설정 (CONFIG)
   ============================================================ */
const SUPABASE_URL = "https://ygrdrahwjqfvfzgwxijq.supabase.co";
const SUPABASE_KEY = "sb_publishable_1EPYP7prxw0Md52_CLOVZw_u70RjkCf";
const TEACHER_SETUP_CODE_DEFAULT = "jrem2026"; // Supabase에 설정값이 없을 때만 쓰이는 기본값
const SETTINGS_KEY = "teacher_setup_code";
/* 반(class) 목록 — value는 DB에 저장되는 실제 값(기존 학생 데이터와 호환을 위해 유지),
   label은 화면에 보여지는 이름. 콘텐츠가 준비되는 대로 아래 주석을 해제해서 추가하면 됨. */
const CLASS_OPTIONS = [
  // { value: "초급1", label: "초급1 (1단계)" },
  // { value: "초급2", label: "초급2 (2단계)" },
  { value: "중급1", label: "중급1 (3단계)" },
  { value: "중급2", label: "중급2 (4단계)" },
  // { value: "고급1", label: "고급1 (5단계)" },
];
/* 파일을 새로 배포할 때마다 이 값을 바꾸면, 예전 파일로 로그인해 있던 사람은
   새 파일을 열자마자 자동으로 로그아웃되고 처음 화면부터 다시 시작됨 */
const APP_VERSION = "2026-08-31-22";
const APP_VERSION_KEY = "kiip_app_version";

/* 벨트 레벨 메타 (KIIP 레벨 0~4 통과 시 다음 벨트로 승급) */
const LEVEL_META = {
  1: { name: "흰띠",  color: "var(--white-belt)", kiip: 0 },
  2: { name: "노란띠", color: "var(--yellow-belt)", kiip: 1 },
  3: { name: "초록띠", color: "var(--green-belt)", kiip: 2 },
  4: { name: "파란띠", color: "var(--blue-belt)", kiip: 3 },
  5: { name: "빨간띠", color: "var(--red-belt)", kiip: 4 }
};
const MAX_BELT = 5;

/* ============================================================
   예시(placeholder) 콘텐츠 — 실제 KIIP 교재 반영 전까지 사용
   ============================================================ */
const CLASS_LEVEL_KEY = { "초급1": "elementary1", "초급2": "elementary2", "중급1": "intermediate1", "중급2": "intermediate2" };

/* DB에 저장된 class_name 값(예: "중급1")을 화면 표시용 라벨(예: "중급1 (3단계)")로 변환.
   CLASS_OPTIONS에 없는 값(과거 데이터 등)은 원래 값을 그대로 보여줌 */
function classLabel(value) {
  const found = CLASS_OPTIONS.find(c => c.value === value);
  return found ? found.label : (value || "");
}

/* ============================================================
   3단계(중급1) 필기 문제 풀 — 1과~16과 내용을 섞어서 출제
   실제 KIIP 중급1 단계평가 배점 구조를 따름: 어휘·문법 3.5점, 쓰기·읽기·문화 4점
   1차로 범주당 5문항씩 모의고사 수준으로 제작 (추후 계속 보강 예정)
   ============================================================ */
const QUIZ_POOL = {
  intermediate1: {
    /* level: easy(쉬움) / medium(중급) / hard(어려움) — 전체 풀 구성비 약 3:5:2 (30%/50%/20%)
       icon: 문제 이해를 돕는 그림(이모지) / explain: 정답 확인 화면에 표시되는 해설 */
    vocab: [
      { level: "medium", icon: "🤝", q: "가: 요즘 회사 사람들하고 좀 어때요? 나: 아직 서로 ___이/가 없어서 서먹서먹해요.", opts: ["공감대", "의무감", "책임감", "자신감"], a: 0, explain: "'공감대가 없다'는 서로 생각이나 느낌이 통하는 부분이 없다는 뜻이에요. 그래서 아직 서먹서먹한 상황에 어울려요." },
      { level: "easy", icon: "🌳", q: "다음 설명에 해당하는 표현은? '조용하고 한가로우며 사람이 많지 않다'", opts: ["복잡하다", "한적하다", "탁하다", "안전하다"], a: 1, explain: "'한적하다'는 조용하고 한가로운 상태를 나타내는 말이에요." },
      { level: "medium", icon: "🏢", q: "'발전 가능성이 있는 회사'가 뜻하는 것으로 가장 알맞은 것은?", opts: ["월급이 아주 많은 회사", "직원 수가 많은 회사", "앞으로 성장할 가능성이 있는 회사", "출퇴근이 자유로운 회사"], a: 2, explain: "'발전 가능성이 있다'는 앞으로 더 좋아지고 성장할 수 있다는 뜻이에요." },
      { level: "easy", icon: "🌕", q: "음력 1월 15일, 보름달을 보며 소원을 비는 한국의 명절은?", opts: ["동지", "추석", "설날", "정월 대보름"], a: 3, explain: "정월 대보름(음력 1월 15일)에는 보름달을 보며 소원을 빌고 연날리기, 제기차기 등을 즐겨요." },
      { level: "easy", icon: "🍲", q: "'데치다'의 뜻으로 알맞은 것은?", opts: ["기름에 튀기다", "끓는 물에 살짝 익히다", "오래 삶다", "차갑게 식히다"], a: 1, explain: "'데치다'는 끓는 물에 짧게 넣었다 빼서 살짝 익히는 조리법이에요." },

      { level: "easy", icon: "🏮", q: "저는 이번 주말에 처음으로 한국 전통 시장에 가 보았습니다. 다양한 음식과 물건들이 많아서 즐거웠습니다. 다음에 또 가고 싶습니다.\n\n윗글의 내용과 같은 것은?", opts: ["이 사람은 전통 시장에 처음 가 보았다.", "이 사람은 전통 시장이 마음에 안 들었다.", "이 사람은 전통 시장에 자주 간다.", "이 사람은 시장에서 아무것도 사지 않았다."], a: 0, explain: "글의 첫 문장에서 '처음으로 한국 전통 시장에 가 보았다'고 했어요." },
      { level: "easy", icon: "📚", q: "저는 매주 토요일에 도서관에 갑니다. 책을 읽고 한국어 공부도 합니다. 도서관은 조용해서 공부하기에 좋습니다.\n\n윗글의 내용과 다른 것은?", opts: ["이 사람은 토요일마다 도서관에 간다.", "도서관에서 책을 읽는다.", "도서관은 시끄러워서 공부하기 힘들다.", "도서관에서 한국어 공부를 한다."], a: 2, explain: "글에서는 도서관이 '조용해서 공부하기에 좋다'고 했으므로, 시끄럽다는 내용은 글과 반대예요." },
      { level: "medium", icon: "🏯", q: "우리 반은 다음 주에 현장 학습을 갑니다. 민속촌에 가서 전통 문화를 체험할 예정입니다. 도시락은 각자 준비해야 합니다.\n\n윗글의 내용과 다른 것은?", opts: ["현장 학습 장소는 민속촌이다.", "전통 문화를 체험할 예정이다.", "도시락은 학교에서 준비해 준다.", "현장 학습은 다음 주에 간다."], a: 2, explain: "글에서는 '도시락은 각자 준비해야 한다'고 했으므로, 학교에서 준비해 준다는 내용은 틀려요." },
      { level: "medium", icon: "🧺", q: "이 세탁기는 구입한 지 1년이 안 됐는데 갑자기 작동이 안 됩니다. 서비스 센터에 전화했더니 무상 수리가 가능하다고 했습니다. 내일 기사님이 방문하실 예정입니다.\n\n윗글의 내용과 같은 것은?", opts: ["세탁기는 구입한 지 1년이 넘었다.", "수리비를 내야 한다.", "내일 기사님이 방문한다.", "세탁기는 문제없이 잘 작동한다."], a: 2, explain: "글의 마지막 문장에서 '내일 기사님이 방문하실 예정'이라고 했어요." },
      { level: "hard", icon: "🇰🇷", q: "사회통합프로그램은 이민자가 한국 사회에 잘 적응하도록 돕는 제도입니다. 한국어와 한국 문화뿐만 아니라 한국 사회 이해 과정도 포함되어 있습니다. 교육을 이수하면 체류자격 변경이나 국적 취득 시 혜택을 받을 수 있지만, 참여는 의무가 아니라 선택입니다.\n\n윗글의 내용과 다른 것은?", opts: ["이 프로그램은 이민자의 한국 사회 적응을 돕는다.", "한국 사회 이해 과정도 포함되어 있다.", "교육을 이수하면 여러 혜택을 받을 수 있다.", "이 프로그램에는 반드시 참여해야 한다."], a: 3, explain: "글의 마지막 부분에서 '참여는 의무가 아니라 선택'이라고 명확히 밝히고 있어요." },

      { level: "medium", icon: "📢", q: "[신입사원 모집]\n모집 분야: 판매직\n모집 인원: 4명\n지원 자격: 고졸 이상 (베트남어 가능자 환영)\n제출 서류: 이력서, 자기소개서\n지원 방법: 방문 및 온라인 접수\n\n이 회사에 지원할 수 있는 사람은?", opts: ["베트남에서 온 사람", "판매 경험이 많은 사람", "꿈을 이루고 싶은 사람", "고등학교를 졸업한 사람"], a: 3, explain: "지원 자격이 '고졸 이상'이므로 고등학교를 졸업한 사람이 지원할 수 있어요. 베트남어 가능자는 '환영'일 뿐 필수 조건은 아니에요." },
      { level: "hard", icon: "🏫", q: "제목: 문화센터 교육 안내\n\n여러분, 안녕하세요? 문화센터의 교육 프로그램을 소개합니다. 한국어 수업은 매주 월요일, 수요일, 금요일 오후 7시부터 9시까지 두 달 동안 진행됩니다. 컴퓨터 수업은 매주 화요일과 목요일 오후 7시부터 8시까지이며, 교육 기간은 한 달입니다. 한국어 수업은 무료이고 컴퓨터 수업은 5만 원입니다. 외국인이면 누구나 문화센터 홈페이지에서 신청할 수 있습니다.\n\n이 교육 프로그램에 대한 내용으로 맞는 것은?", opts: ["컴퓨터는 매일 한 시간씩 교육한다.", "한국어는 일주일에 두 번 공부한다.", "외국 사람만 교육을 신청할 수 있다.", "문화센터의 교육 프로그램은 모두 무료이다."], a: 2, explain: "글에서 '외국인이면 누구나 신청할 수 있다'고 했으므로 외국인만 신청 가능해요. 컴퓨터 수업은 화·목요일만 있고, 한국어는 주 3회이며, 컴퓨터 수강료는 5만 원이므로 나머지 보기는 모두 틀려요." },
      { level: "medium", icon: "👛", q: "다음은 신문 기사 제목입니다.\n\n[지갑이 사라진다… 앱카드가 스마트폰 속으로]\n\n이 신문 기사의 내용이 아닌 것은?", opts: ["지갑을 잃어버린 사람이 많다.", "스마트폰 앱카드로 결제할 수 있다.", "스마트폰이 지갑의 역할을 대신한다.", "지갑에 카드를 넣고 다니지 않아도 된다."], a: 0, explain: "기사 제목의 '지갑이 사라진다'는 지갑을 잃어버렸다는 뜻이 아니라, 앱카드 때문에 지갑을 들고 다니는 사람이 줄어든다는 의미예요." },
      { level: "medium", icon: "🏠", q: "나는 햇빛이 잘 들어와서 따뜻하고 층간 소음 걱정이 없는 조용한 집에서 편하게 쉬고 싶다. 그리고 집 주변에 지하철역이나 버스 정류장이 있어서 쉽게 이동할 수 있으면 좋겠다. 편의점, 카페, 병원 등이 가까이 있고, 주변 환경도 안전한 데다가 깨끗한 곳에서 살고 싶다.\n\n이 사람이 살고 싶은 집이 아닌 것은?", opts: ["집 근처에 편의시설이 있다.", "대중교통을 이용하기 편리하다.", "집 안의 시설이 안전하고 깨끗하다.", "윗집에서 시끄러운 소리가 나지 않는다."], a: 2, explain: "글에서 '안전하고 깨끗하다'는 것은 집 안의 시설이 아니라 '주변 환경'에 대한 내용이므로 이 보기가 글과 달라요." },
      { level: "hard", icon: "🎶", q: "[어린이날 기념 음악회]\n기간: 05.01~05.31\n시간: 평일 오후 7시~9시, 주말 오후 4시~6시, 7시~9시\n장소: 뮤직콘서트장\n관람료: 어른 15,000원 (어린이 무료)\n유의사항: 공연장 사진촬영 금지\n\n이 공연을 소개하는 내용으로 맞는 것은?", opts: ["하루에 한 번만 공연한다.", "한 달 동안 매일 공연을 한다.", "누구나 무료로 관람할 수 있다.", "공연하는 모습을 촬영할 수 있다."], a: 1, explain: "공연 기간이 5월 1일부터 31일까지 매일 진행되므로 '한 달 동안 매일 공연을 한다'가 맞아요. 관람료는 어린이만 무료이고, 주말에는 하루 두 번 공연하며, 사진 촬영은 금지되어 있어요." },
      { level: "medium", icon: "💬", q: "제목: 외국 사람인데 한국의 문화를 잘 몰라서 생활하기가 어려워요.\n↳댓글: ( )\n\n댓글의 내용으로 알맞은 것은?", opts: ["한국의 문화는 문제가 없어요.", "한국 생활이 어려워도 무조건 참으세요.", "한국에서는 한국의 문화에 맞춰서 생활하세요.", "한국의 문화를 배우고 문화의 차이를 이해하세요."], a: 3, explain: "다른 문화에 적응하기 어려워하는 사람에게는 무조건 참거나 맞추라고 하기보다, 문화를 배우고 차이를 이해하도록 돕는 조언이 가장 알맞아요." },

      { level: "medium", icon: "😌", q: "사람들은 제 성격이 적극적이고 외향적이라고 말합니다. 잘 웃는 편이고 친구들도 많기 때문입니다. 하지만 사실 저도 스트레스를 많이 받습니다. 제 감정을 그대로 표현하지 못해서 힘이 들 때가 있습니다. 겉으로 보이는 제 모습과 실제의 제 모습이 다른 것이 제 고민입니다. 앞으로 사회생활을 잘하고 싶은데 제 감정을 어디까지 표현하는 것이 좋을까요?\n\n다음의 내용과 같은 것을 고르세요.", opts: ["친구들은 내 성격이 느긋하다고 생각한다.", "나는 감정을 솔직하게 표현하지 못해서 힘들다.", "나는 스트레스를 전혀 받지 않는 편이다.", "남이 보는 내 모습과 내가 생각하는 내 모습은 같다."], a: 1, explain: "글쓴이는 '제 감정을 그대로 표현하지 못해서 힘이 들 때가 있다'고 했으므로 이 내용이 글과 일치해요." },
      { level: "easy", icon: "👜", q: "가: 이 가방을 지난주에 샀는데 다른 걸로 바꿀 수 있을까요?\n나: 그럼요, 어떤 것으로 ( )?\n가: 사이즈가 조금 더 큰 게 있나요?\n나: 손님, 이 사이즈는 어떠세요?\n가: 좋네요, 그걸로 할게요.\n\n다음 ( ) 안에 알맞은 것을 고르세요.", opts: ["교환하시겠어요", "환불하시겠어요", "구매하시겠어요", "반품하시겠어요"], a: 0, explain: "다른 물건으로 바꾸고 싶다고 했으므로 '교환하시겠어요'가 알맞아요." },
      { level: "hard", icon: "📚", q: "최근 중고 도서를 거래하는 사람들이 많아지고 있다. 중고 거래 사이트에서는 자신이 읽은 책을 팔 수 있고 깨끗한 중고 책을 정가보다 싸게 살 수도 있다. 하지만 책에 메모를 했거나 책이 더러워진 경우에는 중고 거래 사이트에서 팔기 어렵다. 도서 중고 거래를 하면 책을 한 번 읽고 책꽂이에 꽂아 두는 것이 아니라 많은 사람이 읽을 수 있게 된다. 그렇기 때문에 앞으로도 도서 중고 거래가 점점 늘어날 것이다.\n\n다음 글에 대한 설명으로 옳은 것을 고르세요.", opts: ["이용자가 적어서 도서 중고 거래는 앞으로 점점 줄어들 것이다.", "한 번 읽은 책을 책꽂이에 꽂아 두는 것이 중고 거래보다 의미가 있다.", "도서 중고 거래 사이트에서는 책을 정가보다 싸게 사고판다.", "책에다가 메모를 한 것도 중고 거래 사이트에서 인기가 많다."], a: 2, explain: "글에서 '정가보다 싸게 살 수도 있다'고 했으므로 정가보다 싸게 사고판다는 내용이 옳아요." },
      { level: "medium", icon: "🚗", q: "저는 교통이 편리한 곳으로 이사를 가고 싶습니다. 지금 살고 있는 곳이 마음에 들지만 마트와 병원이 멀어서 불편합니다. 장을 보러 가려면 차로 30분 정도 나가야 하고 대중교통 수단을 이용할 수 없습니다. 그래서 연말에 전세 계약이 끝나기 전에 이사 갈 집을 알아볼 생각입니다.\n\n다음 글에 대한 설명으로 옳지 않은 것을 고르세요.", opts: ["집에서 마트까지 가려면 차로 30분 정도 걸린다.", "지금 사는 곳은 대중교통 수단을 이용하기가 불편하다.", "나는 지금 사는 집의 전세 계약을 연장하려고 한다.", "나는 교통이 편리한 곳에서 살고 싶다."], a: 2, explain: "글쓴이는 전세 계약이 끝나기 전에 '이사 갈 집을 알아볼 생각'이라고 했으므로 계약을 연장하려는 것이 아니에요." },
      { level: "hard", icon: "🧼", q: "행복 문화 센터 2020 봄맞이 수강생 모집\n- 비누 만들기: (월)(수) 10:00~10:50, 참가비 2만 원\n- 초급 요가: (화)(목) 9:00~9:50, 참가비 5만 원\n- 한식 배우기: (목) 19:00~21:00, 참가비 7만 원\n- 주부 노래 교실: (금) 14:00~15:30, 참가비 무료\n강좌 기간: 3/12(목)~5/28(목)\n접수 기간: 3월 개강 전까지 선착순 접수\n방문 접수: 평일 오전 9시~오후 6시\n접수처: 행복 문화 센터 2층\n(강좌를 2개 이상 신청할 경우 전체 수업료의 10% 할인)\n\n다음 글에 대한 설명으로 옳지 않은 것을 고르세요.", opts: ["비누 만들기 수업은 일주일에 두 번 있다.", "모든 수업은 수강료를 지불해야 들을 수 있다.", "요가와 비누 만들기 수업을 둘 다 신청하면 63,000원이 필요하다.", "수업을 신청하려면 행복 문화 센터에 가야 한다."], a: 1, explain: "주부 노래 교실은 참가비가 무료이므로 '모든 수업이 수강료를 지불해야 한다'는 설명은 옳지 않아요." },
      { level: "medium", icon: "🫂", q: "살면서 여러 관계 속에서 다양한 사람들을 만나다 보면 갈등이 생겨서 상처를 받을 때가 많다. 그래서 요즘 '인맥 다이어트'가 유행이다. 연락을 자주 하지 않는 사람이나 마음이 안 맞는 사람과 관계를 정리하는 것이다. ( ㉠ ) 항상 마음이 맞는 사람만 만날 수는 없다. 다양한 사람들과 함께 일을 하고 사람을 상대하는 방법을 배우면서 우리들은 더 많이 성장할 수 있다. 나와 다르다고 해서 쉽게 관계를 정리하면 결국에는 외로워질 것이다.\n\n㉠에 들어갈 알맞은 말을 고르세요.", opts: ["그리고", "따라서", "게다가", "그렇지만"], a: 3, explain: "앞의 '관계를 정리한다'는 내용과 뒤의 '마음이 맞는 사람만 만날 수는 없다'는 내용이 상반되므로 '그렇지만'이 알맞아요." },

      { level: "medium", icon: "🎭", q: "지난주에 한국 친구의 초대로 연극 공연을 보고 왔다. 가끔 극장에서 영화를 본 적은 있지만 연극을 본 것은 ( ㉠ ). 연극은 배우들이 연기하는 모습을 직접 볼 수 있어서 좋았다.\n한국 친구가 나에게 인터넷 사이트에서 공연 티켓 예매하는 방법을 가르쳐 주었다. 또 잘 찾으면 할인 티켓을 살 수 있다는 것도 알게 되었다.\n한국에 처음 왔을 때는 생활에 적응하느라 이렇게 공연을 볼 생각도 못했지만 앞으로는 가끔씩 문화생활도 즐겨야겠다.\n\n㉠에 들어갈 알맞은 말을 고르세요.", opts: ["자주 있는 일이다", "이번이 마지막이다", "좋은 일이다", "이번이 처음이다"], a: 3, explain: "영화는 본 적이 있지만 연극은 처음 봤다는 내용이 이어지므로 '이번이 처음이다'가 알맞아요." },

      { level: "medium", icon: "🏫", q: "나리 초등학교에서 방과 후 선생님을 모집합니다\n모집 분야: 중국어, 컴퓨터, 축구\n모집 인원: 각 1명씩, 총 3명\n모집 기간: 20XX. 1. 17.~1. 24.\n지원 자격: 각 분야 대졸자 또는 교사 자격증 소지자\n제출 서류: 이력서, 자기소개서, 졸업증명서, 자격증\n지원 방법: 방문(교무실) 또는 이메일(nari_school@naver.com) 접수\n지원 문의: 02-345-9876\n\n다음의 내용과 같은 것을 고르세요.", opts: ["이 학교에는 방과 후 영어 교실이 있다.", "대학교에서 컴퓨터를 전공한 사람은 지원할 수 있다.", "지원자는 합격 후에 자격증을 제출하면 된다.", "지원 서류를 내기 위해서 반드시 학교에 가야 한다."], a: 1, explain: "지원 자격이 '각 분야 대졸자 또는 교사 자격증 소지자'이므로 컴퓨터 관련 대졸자는 지원할 수 있어요." },

      { level: "hard", icon: "🌸", q: "겨울에서 봄으로 계절이 바뀌는 기간에 사람들은 쉽게 피로를 느끼게 된다. 온몸이 나른하고 졸음이 오는 상태가 보통 1~3주 정도 계속되는데 질병은 아니다. 이러한 ( ㉠ ) 날씨의 변화에 몸이 적응을 하지 못했기 때문이다. 춘곤증은 평소 규칙적이고 적당한 운동을 통해 예방할 수 있다. 또한 충분한 시간 동안 잠을 자는 것과 비타민을 먹는 것도 춘곤증 예방에 도움이 된다.\n\n㉠에 들어갈 알맞은 말을 고르세요.", opts: ["춘곤증 문제의 해결법은", "춘곤증이 나타나는 이유는", "춘곤증을 예방하기 위해서는", "춘곤증을 없앨 수 있는 방법은"], a: 1, explain: "뒤에 '날씨의 변화에 몸이 적응을 하지 못했기 때문'이라는 이유가 이어지므로 '춘곤증이 나타나는 이유는'이 알맞아요." },

      { level: "medium", icon: "💼", q: "직장 생활을 하다 보면 대인 관계나 야근 등으로 스트레스를 받을 때가 있다. 사람들은 보통 직장 생활의 어려움을 극복하기 위해 아무것도 하지 않고 휴식을 취한다고 한다. 그러나 아무것도 하지 않는 것보다 조금 더 적극적으로 자신의 문제를 해결해 보는 것이 좋다. 취미 생활을 하거나 야외 활동 또는 동호회 활동을 하면 재충전의 시간을 가질 수 있을 것이다.\n\n다음 글의 중심 내용으로 옳은 것을 고르세요.", opts: ["직장 생활을 할 때 스트레스를 받지 않아야 한다.", "직장에서 야근을 하면 스트레스를 더 많이 받게 된다.", "직장 생활의 스트레스는 적극적인 활동으로 푸는 것이 좋다.", "직장에서 스트레스를 받을 때 휴식을 취하는 사람들이 많다."], a: 2, explain: "글쓴이는 아무것도 하지 않는 것보다 취미나 동호회 등 적극적인 활동으로 스트레스를 해소하는 것이 좋다고 말하고 있어요." },

      { level: "hard", icon: "💼", q: "다음 글을 읽고 질문에 답하세요.\n\n많은 사람들이 사회생활에서 일보다 사람 때문에 스트레스를 받고 있다. 실제로 직장인 다섯 명 중 한 명이 급여보다 인간관계 때문에 퇴사를 생각하는 것으로 나타났다. 직장인 1,206명을 대상으로 퇴사를 고민하는 이유를 조사한 결과, 상사, 동료 등의 인간관계와 관련된 이유가 20% 이상으로 나타났다. 결국 회사를 그만두려고 하는 가장 큰 이유는 '대인 관계'였다.\n다른 사람과의 관계는 행복과 연결된다. 좋은 관계는 웃음과 편안함을 주지만 나쁜 관계는 스트레스와 불편함을 준다. 한 대학에서 1937년부터 75년간 800여 명을 대상으로 실험했는데, '다른 사람들과의 좋은 관계'가 행복과 건강을 결정하는 것으로 나타났다. 이처럼 사람들과 관계를 맺고 그 관계 속에서 살아가는 것은 우리의 생활에서 가장 중요한 일이다.\n\n사람들이 회사를 그만두려고 하는 가장 큰 이유는 무엇입니까?", opts: ["급여", "건강", "인간관계"], a: 2, explain: "글에서 '회사를 그만두려고 하는 가장 큰 이유는 대인 관계였다'고 했어요." },

      { level: "hard", icon: "🔌", q: "다음은 전자 제품 사용에 대한 글입니다. 글을 읽고 질문에 답하세요.\n\n한 번 구입하면 10년 정도 사용하는 전자 제품, 어떻게 하면 고장 없이 남들보다 더 오래 사용할 수 있을까? 텔레비전은 내부에서 생기는 열이 잘 빠지는 것이 중요하다. 따라서 좁은 공간이나 벽에 너무 가까이 설치하는 것보다 여유 있는 공간에 설치하는 것이 좋다. 그리고 화면의 먼지는 마른 수건으로 닦아야 한다. 세탁기는 너무 많은 빨래를 넣어서 사용하면 빨리 고장이 나기 때문에 세탁물의 용량을 잘 지켜야 한다. 세탁 후에는 문을 열어 내부를 건조시켜 주는 것이 좋다. 우리가 먹는 음식과 관계가 있는 냉장고는 내부가 가득 차면 고장 나기 쉬우니 정기적으로 냉장고를 정리하는 것이 좋다. 또한 냉장고 문을 자주 열고 닫는 것도 수명이 짧아지는 원인 중의 하나이니 유의하자.\n\n무엇에 대한 글입니까?", opts: ["전자 제품 관리 방법", "전자 제품 수리 방법", "전자 제품 설치 방법"], a: 0, explain: "텔레비전, 세탁기, 냉장고를 오래 사용하는 관리 방법을 설명하고 있어요." },
      { level: "medium", icon: "🔌", q: "한 번 구입하면 10년 정도 사용하는 전자 제품, 어떻게 하면 고장 없이 남들보다 더 오래 사용할 수 있을까? 텔레비전은 내부에서 생기는 열이 잘 빠지는 것이 중요하다. 따라서 좁은 공간이나 벽에 너무 가까이 설치하는 것보다 여유 있는 공간에 설치하는 것이 좋다. 그리고 화면의 먼지는 마른 수건으로 닦아야 한다. 세탁기는 너무 많은 빨래를 넣어서 사용하면 빨리 고장이 나기 때문에 세탁물의 용량을 잘 지켜야 한다. 세탁 후에는 문을 열어 내부를 건조시켜 주는 것이 좋다. 우리가 먹는 음식과 관계가 있는 냉장고는 내부가 가득 차면 고장 나기 쉬우니 정기적으로 냉장고를 정리하는 것이 좋다. 또한 냉장고 문을 자주 열고 닫는 것도 수명이 짧아지는 원인 중의 하나이니 유의하자.\n\n위 전자 제품 관리에 대한 글의 내용과 같은 것을 고르세요.", opts: ["텔레비전은 벽에 붙여서 설치해야 한다.", "세탁기는 사용 후에 문을 열어 건조시켜야 한다.", "냉장고 문을 자주 열고 닫으면 냄새가 안 나서 좋다."], a: 1, explain: "글에서 '세탁 후에는 문을 열어 내부를 건조시켜 주는 것이 좋다'고 했어요." },

      { level: "medium", icon: "📊", q: "[명절 후유증으로 어떤 것을 경험했나요? (복수 응답) 몸이 피로하다 59.9%, 몸무게가 늘었다 31.3%, 자주 졸리다 20.7%, 일에 의욕이 떨어졌다 18.6%, 두통이 생기고 소화가 안 된다 14.5% (조사 대상: 직장인 200명)]\n\n몸무게가 늘었다는 사람들은 자주 졸린다는 사람들보다 두 배 이상 많다. 위 조사의 내용과 같습니까?", opts: ["O", "X"], a: 1, explain: "31.3%는 20.7%의 두 배가 안 되므로 반대예요." },
      { level: "hard", icon: "🛌", q: "다음은 명절 후유증 예방에 대한 이야기입니다. 글을 읽고 물음에 답하세요.\n\n명절 후유증이란 명절을 보내면서 스트레스 때문에 생기는 몸이나 정신 등의 문제를 말한다. 명절 동안 과도한 가사 업무, 장거리 운전 등으로 피로감, 소화 불량, 두통 등의 증상을 겪게 되는 사람들이 있다. 이런 후유증을 예방하기 위해서는 명절 음식을 준비하거나 운전을 할 때 한두 시간마다 10분 정도의 휴식을 취하는 것이 좋다. 그리고 스트레칭이나 가벼운 운동을 하면 피로 회복에 도움이 된다. 명절에는 기름진 음식을 많이 먹게 되는데 한 끼 정도는 채소와 과일을 먹으면 소화 불량의 문제를 예방할 수 있다.\n\n명절 후유증으로 생기는 문제가 아닌 것은 무엇입니까?", opts: ["두통", "소화 불량", "몸무게 감소"], a: 2, explain: "글에는 피로감, 소화 불량, 두통은 있지만 몸무게 감소는 언급되지 않았어요." },
      { level: "medium", icon: "🛌", q: "명절 후유증이란 명절을 보내면서 스트레스 때문에 생기는 몸이나 정신 등의 문제를 말한다. 명절 동안 과도한 가사 업무, 장거리 운전 등으로 피로감, 소화 불량, 두통 등의 증상을 겪게 되는 사람들이 있다. 이런 후유증을 예방하기 위해서는 명절 음식을 준비하거나 운전을 할 때 한두 시간마다 10분 정도의 휴식을 취하는 것이 좋다. 그리고 스트레칭이나 가벼운 운동을 하면 피로 회복에 도움이 된다. 명절에는 기름진 음식을 많이 먹게 되는데 한 끼 정도는 채소와 과일을 먹으면 소화 불량의 문제를 예방할 수 있다.\n\n위 명절 후유증 글의 내용과 다른 것을 고르세요.", opts: ["명절 후유증은 몸과 정신에 다 문제가 생길 수 있는 것이다.", "명절에는 고기보다 과일을 더 많이 먹게 된다.", "명절 후유증을 예방하기 위해서 스트레칭이나 가벼운 운동을 하는 것이 좋다."], a: 1, explain: "글에서 '명절에는 기름진 음식을 많이 먹게 된다'고 했으므로 반대예요." },
{ level: "medium", icon: "💳", q: "다음은 안젤라 씨의 명함입니다. 명함 내용과 같은 것을 고르세요.\n\n[명함] 안젤라 조이 / 국제영업부 대리 / 한국무역 / 서울시 송파구 잠실로 45 / T 02-123-1234 M 010-1234-5678", opts: ["안젤라 씨는 국내 영업 일을 하고 있다.", "안젤라 씨는 '한국무역' 회사에 다닌다.", "안젤라 씨는 이 회사의 과장이다."], a: 1, explain: "명함에 회사 이름이 '한국무역'이라고 적혀 있어요. 안젤라 씨는 국제영업부 대리이므로 국내 영업이나 과장이라는 말은 틀려요." },
  { level: "medium", icon: "🤝", q: "다음은 명함에 대한 이야기입니다. 글을 읽고 물음에 답하세요.\n\n직장 생활을 하다 보면 명함을 주고받을 때가 많습니다. 명함을 줄 때는 자기소개를 짧게 하고 주는 것이 좋습니다. 명함은 아랫사람이 먼저 전달하며, 다른 곳을 방문했을 때는 방문한 사람이 먼저 줍니다. 명함을 전달할 때는 상대방이 읽기 편하게 자신의 이름이 상대방 쪽을 향하도록 줍니다. 마지막으로 명함을 받았을 때는 하의 주머니에 넣지 않고 상의 주머니나 지갑에 넣습니다.\n\n무엇에 대한 이야기입니까?", opts: ["명함을 읽는 방법", "명함을 주고받는 방법", "명함을 넣는 방법"], a: 1, explain: "글 전체가 명함을 주고, 전달하고, 받는 예절, 즉 '명함을 주고받는 방법'에 대해 설명하고 있어요." },
  { level: "medium", icon: "🤝", q: "직장 생활을 하다 보면 명함을 주고받을 때가 많습니다. 명함을 줄 때는 자기소개를 짧게 하고 주는 것이 좋습니다. 명함은 아랫사람이 먼저 전달하며, 다른 곳을 방문했을 때는 방문한 사람이 먼저 줍니다. 명함을 전달할 때는 상대방이 읽기 편하게 자신의 이름이 상대방 쪽을 향하도록 줍니다. 마지막으로 명함을 받았을 때는 하의 주머니에 넣지 않고 상의 주머니나 지갑에 넣습니다.\n\n위 명함 이야기의 내용과 같은 것을 고르세요.", opts: ["다른 회사에 가면 먼저 명함을 줄 때까지 기다린다.", "명함을 줄 때는 상대방이 읽기 편한 방향으로 준다.", "명함을 받으면 바로 지갑에 넣는다."], a: 1, explain: "글에서 '상대방이 읽기 편하게 자신의 이름이 상대방 쪽을 향하도록 준다'고 했으므로 정답이에요. 다른 곳을 방문했을 때는 방문한 사람이 먼저 주어야 하고, 미팅이 끝나기 전까지는 지갑에 넣지 않는 것이 좋아요." },
  { level: "medium", icon: "📰", q: "다음은 인터넷 뉴스 기사입니다. 기사 내용과 같은 것을 고르세요.\n\n[한국 문화일보] 인터넷과 스마트폰에 빠진 청소년\n초·중·고생 대상 온라인 조사 결과 중학생의 인터넷·스마트폰 사용이 가장 심각한 것으로 나타났다. 청소년 하루 평균 3~4시간 이상 인터넷에 접속하며, 청소년의 인터넷과 스마트폰 중독 연령대가 매년 낮아지고 있다.", opts: ["고등학생이 중학생보다 스마트폰을 더 많이 사용한다.", "청소년의 인터넷·스마트폰 중독이 심각해지고 있다.", "청소년은 하루 평균 다섯 시간 동안 인터넷을 한다."], a: 1, explain: "기사에서 중독 연령대가 매년 낮아진다고 했으므로 중독이 심각해지고 있다는 내용이 맞아요. 중학생 사용이 가장 심각하다고 했으니 고등학생이 더 많이 쓴다는 말은 틀리고, 평균 시간도 3~4시간이라 다섯 시간이라는 말도 틀려요." },
  { level: "medium", icon: "📵", q: "다음은 스마트폰 사용에 대한 글입니다. 글을 읽고 물음에 답하세요.\n\n언제나 어디서나 우리는 스마트폰으로 다른 사람들과 소통을 할 수 있습니다. 스마트폰 덕분에 사람들과 빨리 연락할 수 있어서 좋지만 스마트폰 때문에 위험한 사고가 생깁니다. 길을 걸을 때 스마트폰을 봐도 괜찮을까요? 최근 스마트폰 때문에 교통사고가 증가하고 있습니다. 길을 걸을 때는 스마트폰이 아니라 주변을 잘 봐야 합니다.\n\n스마트폰 사용에 대해 어떤 문제를 이야기하고 있습니까?", opts: ["안전 문제", "건강 문제", "비용 문제"], a: 0, explain: "글에서 스마트폰 때문에 교통사고가 늘고 있다는 내용을 다루고 있으므로 '안전 문제'가 정답이에요." },
  { level: "medium", icon: "📵", q: "언제나 어디서나 우리는 스마트폰으로 다른 사람들과 소통을 할 수 있습니다. 스마트폰 덕분에 사람들과 빨리 연락할 수 있어서 좋지만 스마트폰 때문에 위험한 사고가 생깁니다. 길을 걸을 때 스마트폰을 봐도 괜찮을까요? 최근 스마트폰 때문에 교통사고가 증가하고 있습니다. 길을 걸을 때는 스마트폰이 아니라 주변을 잘 봐야 합니다.\n\n위 스마트폰 사용에 대한 글의 내용과 같은 것을 고르세요.", opts: ["교통사고와 스마트폰 사용은 관계가 없다.", "길을 걸을 때 스마트폰에 집중하면 안 된다.", "스마트폰을 사용할 때 운전하는 사람보다 걷는 사람이 더 위험하다."], a: 1, explain: "글에서 길을 걸을 때는 스마트폰이 아니라 주변을 잘 봐야 한다고 했으므로 정답이에요." },
  { level: "medium", icon: "🙋", q: "다음은 이민자 멘토단 모집 공고문입니다. 공고문의 내용과 다른 것을 고르세요.\n\n[사회통합프로그램 이민자 멘토단 모집] 선발 인원: 총 30명 / 신청 자격: 만 25세 이상 이민자, 한국 거주 5년 이상, 한국어로 강의가 가능한 사람 / 활동 기간: 1년 / 제출 서류: 신청서, 자기소개서, 자기소개 동영상", opts: ["이민자 멘토단 삼십 명을 선발할 계획이다.", "한국에 온 지 삼 년 된 사람도 이민자 멘토가 될 수 있다.", "이민자 멘토단 신청을 하려면 자기소개 동영상을 준비해야 한다."], a: 1, explain: "공고문에서 신청 자격이 '한국 거주 5년 이상'이라고 했으므로 한국에 온 지 삼 년 된 사람은 신청할 수 없어요." },
  { level: "medium", icon: "📧", q: "다음은 웬티항 씨가 행복 상담 센터장에게 보내는 이메일입니다. 글을 읽고 물음에 답하세요.\n\n제목: 상담을 신청합니다\n센터장님, 안녕하세요? 아이의 학교 문제로 상담을 받고 싶습니다. 저는 한국에 온 지 이 년이 되었고 제 아들은 일 년 전에 한국에 들어왔습니다. 제 아들은 이제 한국어로 학교생활을 할 수 있습니다. 그런데 국어나 사회 과목처럼 어려운 어휘가 많이 나오는 수업은 아주 힘들어합니다.\n\n누가 누구에게 보내는 이메일입니까?", opts: ["웬티항 씨가 행복 상담 센터장에게", "행복 상담 센터장이 웬티항 씨에게", "센터장이 아들에게"], a: 0, explain: "이메일 제목과 내용을 보면 웬티항 씨가 상담을 신청하기 위해 센터장에게 보낸 이메일이에요." },
  { level: "medium", icon: "📧", q: "제목: 상담을 신청합니다\n센터장님, 안녕하세요? 아이의 학교 문제로 상담을 받고 싶습니다. 저는 한국에 온 지 이 년이 되었고 제 아들은 일 년 전에 한국에 들어왔습니다. 제 아들은 이제 한국어로 학교생활을 할 수 있습니다. 그런데 국어나 사회 과목처럼 어려운 어휘가 많이 나오는 수업은 아주 힘들어합니다.\n\n위 이메일의 내용과 같은 것을 고르세요.", opts: ["웬티항 씨는 한국어 실력이 늘지 않아서 고민이다.", "웬티항 씨는 2년 전부터 한국에서 살고 있다.", "웬티항 씨는 아들을 학원에 보내려고 한다."], a: 1, explain: "이메일에서 '한국에 온 지 이 년이 되었다'고 했으므로 정답이에요." },
  { level: "medium", icon: "🌡️", q: "다음은 일기 예보 뉴스 헤드라인입니다. 내용과 같은 것을 고르세요.\n\n'오늘, 서울 33도 무더위... 물 충분히 마셔야' / '제주 내일 오후부터 호우... 외출 주의해야' / '경기, 강원 등도 내일 낮 기온 30도 이상' / '광주, 모레부터 매우 강한 비 소식'", opts: ["요즘 한국의 계절은 가을이다.", "내일 제주도는 외출하기에 좋은 날씨이다.", "이틀 후부터 광주에는 큰비가 올 것이다."], a: 2, explain: "'광주, 모레부터 매우 강한 비 소식'이라고 했으므로 이틀 후부터 광주에 큰비가 온다는 것이 맞아요." },
  { level: "medium", icon: "🥤", q: "다음은 날씨와 건강에 대한 글입니다. 글을 읽고 물음에 답하세요.\n\n더운 날씨에 차가운 물을 자주 마시면 건강에 좋을까? 대한병원 박〇〇 원장은 \"너무 차가운 물보다 따뜻한 물이 건강에 좋다\"고 말한다. 덥다고 해서 찬 음식을 자주 먹으면 배탈이 나기 쉽고 설사를 할 수 있다. 찬물을 마실 때는 한꺼번에 마시지 않는 것이 좋다.\n\n물을 건강하게 마시는 방법으로 알맞은 것은 무엇입니까?", opts: ["찬물을 빨리 마신다.", "따뜻한 물을 조금씩 나누어 마신다.", "찬물을 한 번에 많이 마신다."], a: 1, explain: "글에서 따뜻한 물이 건강에 좋고, 찬물은 한꺼번에 마시지 않는 것이 좋다고 했으므로 정답이에요." },
  { level: "medium", icon: "🥤", q: "더운 날씨에 차가운 물을 자주 마시면 건강에 좋을까? 대한병원 박〇〇 원장은 \"너무 차가운 물보다 따뜻한 물이 건강에 좋다\"고 말한다. 덥다고 해서 찬 음식을 자주 먹으면 배탈이 나기 쉽고 설사를 할 수 있다. 찬물을 마실 때는 한꺼번에 마시지 않는 것이 좋다.\n\n위 날씨와 건강에 대한 글의 내용과 같은 것을 고르세요.", opts: ["찬물은 빨리 마시는 것이 건강에 좋다.", "더운 날씨에 찬 음식을 먹으면 소화가 잘된다.", "찬물을 마실 때는 여러 번 나누어서 마시는 것이 좋다."], a: 2, explain: "글에서 찬물을 마실 때는 한꺼번에 마시지 말고 조금씩 나누어 마시라고 했으므로 정답이에요." }

      { level: "medium", icon: "🎓", q: "동호회에 대한 설명이 아닌 것은?", opts: ["같은 학교를 졸업한 사람들의 모임이다.", "같은 취미를 가지고 함께 즐기는 사람들의 모임이다.", "온라인에서 정보를 공유하는 모임이 먼저 만들어지기도 한다.", "보통 학교, 지역, 직장, 인터넷 커뮤니티를 중심으로 만들어진다."], a: 0, explain: "같은 학교를 졸업한 사람들의 모임은 '동창회'예요. '동호회'는 취미가 같은 사람들의 모임이에요." },

      { level: "medium", icon: "💼", q: "성격과 직업에 대한 설명이 아닌 것은?", opts: ["현실형(R)은 분명하고 질서 있는 것을 좋아한다.", "예술형(A)은 분석적이고 독립적이며 내성적이다.", "탐구형(I)은 관찰력이 좋으며 지적인 활동을 좋아한다.", "워크넷에서 다양한 성격 검사로 자신에게 맞는 직업을 찾을 수 있다."], a: 1, explain: "분석적이고 독립적이며 내성적인 것은 '탐구형(I)'의 특징이에요. 예술형(A)은 창의적이고 감수성이 풍부한 유형이에요." },

      { level: "medium", icon: "💰", q: "적금에 대한 설명이 아닌 것은?", opts: ["적금 이율은 은행마다 다르다.", "자유 적금은 아무 때나 돈을 넣을 수 있다.", "정기 적금은 월급이 불규칙한 사람들에게 좋다.", "정기 적금은 정해진 날짜에 정해진 금액을 넣는다."], a: 2, explain: "월급이 불규칙한 사람에게 좋은 것은 '자유 적금'이에요. 정기 적금은 매달 정해진 날짜에 정해진 금액을 넣어야 해서 수입이 일정한 사람에게 적합해요." },
      { level: "medium", icon: "🎊", q: "한국에서는 하늘에 뜬 해의 움직임을 보고 1년을 24개의 시기로 나누어 계절의 변화를 나타냈는데 이를 ( ㉠ )(이)라고 한다. 대표적으로 ( ㉡ )은 봄의 시작을 알리는 날인데 '봄이 시작되니 좋은 일이 많이 생기기를 바란다.'는 글을 써서 문에 붙이기도 한다. ㉠, ㉡에 들어갈 알맞은 것은?", opts: ["명절 / 춘분", "절기 / 입춘", "명절 / 입춘", "절기 / 춘분"], a: 1, explain: "1년을 24개 시기로 나눈 것은 '절기'이고, 봄의 시작을 알리는 절기는 '입춘'이에요." },
      { level: "medium", icon: "🎉", q: "한국에는 이민자들의 문제를 해결해 주거나 상담해 주는 기관이 많다. ( ㉠ )는 외국인 노동자들의 문제를 그들의 모국어로 상담해 준다. 또한, ( ㉡ )는 결혼 이민자를 대상으로 가족 상담을 진행한다. ㉠, ㉡에 들어갈 알맞은 것은?", opts: ["다문화가족지원센터 / 외국인노동자지원센터", "서울글로벌센터 / 외국인노동자지원센터", "외국인노동자지원센터 / 다문화가족지원센터", "다문화가족지원센터 / 서울글로벌센터"], a: 2, explain: "외국인 노동자에게 모국어로 상담해 주는 곳은 '외국인노동자지원센터', 결혼 이민자 가족 상담을 진행하는 곳은 '다문화가족지원센터'예요." },
      { level: "medium", icon: "🏠", q: "음식의 소비 기한을 가장 잘 설명한 것은?", opts: ["제품이 만들어진 날짜", "제품을 안전하게 먹을 수 있는 기한", "소비자에게 팔 수 있는 날짜", "소비자가 보관할 수 있는 날짜"], a: 1, explain: "'소비기한'은 표시된 보관 방법을 지켰을 때 식품을 안전하게 먹을 수 있는 기한을 말해요." },
      { level: "medium", icon: "🎓", q: "단오에 대한 설명이 아닌 것은?", opts: ["보름달을 보고 소원을 빈다.", "만물의 기운이 가장 강한 날이다.", "창포물에 머리를 감는 풍습이 있다.", "남자는 씨름을 하고, 여자는 그네를 탄다."], a: 0, explain: "보름달을 보고 소원을 비는 것은 '정월 대보름'의 풍습이에요. 단오는 음력 5월 5일로 만물의 기운이 가장 강한 날이라고 여겨져요." },
      { level: "medium", icon: "📵", q: "공유 주택(셰어 하우스)에 대한 설명이 아닌 것은?", opts: ["계약 기간은 최소 2년이다.", "월세나 생활비를 절약할 수 있다.", "각자의 독립된 공간도 가질 수 있다.", "거실과 주방 등의 공간을 다른 사람과 같이 사용한다."], a: 0, explain: "공유 주택의 계약 기간은 운영 방식에 따라 다르며, 반드시 최소 2년인 것은 아니에요." },
      { level: "medium", icon: "🏠", q: "동창회에 대한 설명으로 알맞은 것을 모두 고른 것은? ㄱ. 취미가 같은 사람들이 함께 즐긴다. ㄴ. 직장 생활을 잘하기 위해 만든 것이다. ㄷ. 같은 학교를 졸업한 사람들이 모여서 만든다. ㄹ. 송년회나 체육대회 같은 모임으로 친목을 도모한다.", opts: ["ㄱ, ㄴ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], a: 1, explain: "동창회는 같은 학교를 졸업한 사람들이 모여(ㄷ) 송년회나 체육대회 같은 모임으로 친목을 도모하는(ㄹ) 모임이에요. 취미가 같은 사람들의 모임은 '동호회'예요." },
      { level: "medium", icon: "🎏", q: "한국의 4대 명절에 속하는 것은?", opts: ["한식", "동지", "입춘", "춘분"], a: 0, explain: "한국의 4대 명절은 설날, 한식, 단오, 추석이에요. 동지·입춘·춘분은 명절이 아니라 절기예요." },
      { level: "medium", icon: "🍱", q: "휴대폰 개통에 대한 설명이 아닌 것은?", opts: ["신분증이 있어야 개통할 수 있다.", "한국의 대표적인 이동통신사는 세 곳이다.", "외국인은 본인 명의로 휴대전화를 개통할 수 없다.", "업무상 데이터를 많이 사용한다면 '무제한 요금제'가 유리하다."], a: 2, explain: "외국인도 본인 확인에 필요한 신분증을 갖추면 본인 명의로 휴대전화를 개통할 수 있어요. 가입 유형과 통신사에 따라 필요한 신분증은 다를 수 있어요." },
      { level: "medium", icon: "🎇", q: "소비자 상담 센터에 대한 설명이 아닌 것은?", opts: ["소비자 상담을 받고 싶으면 국번 없이 1372로 전화하면 된다.", "소비자의 고충을 들어주고 피해를 구제받을 수 있도록 도와준다.", "소비자 상담 센터는 점차 다른 기관들과 협력을 확대할 계획이다.", "상담으로 해결되지 않으면 한국소비자원의 피해 구제 절차를 안내받을 수 있다."], a: 2, explain: "'점차 협력을 확대할 계획'이라는 내용은 소비자 상담 센터에 대한 일반적인 설명에 포함되지 않아요." },
      { level: "medium", icon: "🏘️", q: "한국의 직장인은 보통 한 달에 한 번 은행 계좌를 통해 ( ㉠ )을/를 받는다. 이를 '월급을 받다'라고 한다. 그런데 계좌에 입금되는 돈은 실제 지급되는 월급과 차이가 있다. 이는 ( ㉡ ), 건강 보험료 등이 공제되기 때문이다. 또한, ( ㉠ )이/가 많을수록 내야 하는 ( ㉡ )도 더 많아진다. ㉠, ㉡에 들어갈 알맞은 것은?", opts: ["급여 / 이자", "수당 / 이자", "급여 / 세금", "수당 / 세금"], a: 2, explain: "매달 받는 돈은 '급여'이고, 급여에서 건강보험료와 함께 공제되며 소득이 많을수록 더 많이 내는 것은 '세금'이에요." }
,
      /* ↓ 익힘책 영역별 연습문제 제1장~제4장(3~14쪽) 문화 12번 */
      { level: "medium", icon: "👥", q: "한국인의 친목 활동에 대한 설명으로 옳지 않은 것은?", opts: ["동창회는 같은 학교를 졸업한 사람들의 모임이다.", "동호회는 같은 취미를 가지고 함께 즐기는 사람들의 모임이다.", "동호회는 보통 직접 만나고 온라인에서 만나거나 어울리지 않는다.", "사람들은 동호회를 통해 취미 활동을 하고 새로운 사람들을 사귄다."], a: 2, explain: "동호회는 보통 온라인에서 모임을 만들어 정보를 공유하고, 이후 직접 만나는 방식으로도 발전해요. 그러므로 온라인에서 만나거나 어울리지 않는다는 설명은 옳지 않아요." },
      { level: "medium", icon: "💻", q: "워크넷(www.work.go.kr)의 직업심리검사에 대한 설명으로 옳지 않은 것은?", opts: ["현실형의 사람은 현실적이고 신중하지만 고집이 센 편이다.", "탐구형의 사람은 분석적이고 독립적이지만 내성적인 편이다.", "워크넷에서 자신의 성격에 맞는 직업이 무엇인지 알아볼 수 있다.", "워크넷은 좋아하는 직업을 통해서 자신의 성격을 알아볼 수 있다."], a: 3, explain: "워크넷은 성격 검사를 통해 자신에게 맞는 직업을 추천해 주는 사이트예요. 반대로 좋아하는 직업을 통해 성격을 알아보는 것은 아니에요." },
      { level: "medium", icon: "🏢", q: "다문화이주민플러스센터에서 받을 수 있는 서비스에 대한 설명으로 옳지 않은 것은?", opts: ["법무부의 외국인 등록", "고용노동부의 고용 허가", "법무부의 체류 기간 연장", "여성가족부의 고향 방문 지원"], a: 3, explain: "다문화이주민플러스센터는 법무부, 행정안전부, 고용노동부 등 여러 부처의 서비스를 통합해서 제공하는 기관이에요. '고향 방문 지원'은 제공하는 서비스에 포함되지 않아요." },
      { level: "medium", icon: "🛍️", q: "소비자상담센터에 대한 설명으로 옳지 않은 것은?", opts: ["소비자가 피해를 구제받을 수 있도록 도와준다.", "소비자의 고충을 들어 주고 해결 방법을 찾아 준다.", "상담을 받고 싶은 소비자는 국번 없이 1345로 전화하면 된다.", "한국소비자원에 소비자를 대신하여 피해 구제 신청을 해 준다."], a: 2, explain: "소비자상담센터는 국번 없이 '1372'로 전화하거나 인터넷 홈페이지(www.ccn.go.kr)에서 이용할 수 있어요. 1345는 외국인종합안내센터 번호예요." },
      /* ↓ 익힘책 영역별 연습문제 제5장~제27장(15~83쪽) 문화 12번 */
      { level: "medium", icon: "💰", q: "적금에 대한 설명으로 옳지 않은 것은?", opts: ["적금에는 정기 적금과 자유 적금이 있다.", "자유 적금은 정해진 날짜에 정해진 금액을 넣는 것이다.", "적금 이율은 보통 2% 정도인데 은행마다 조금씩 다르다.", "적금이란 일정 기간 동안 정해진 금액을 은행에 적립하는 것이다."], a: 1, explain: "정해진 날짜에 정해진 금액을 넣는 것은 '정기 적금'이에요. 자유 적금은 넣고 싶을 때 넣고 싶은 금액을 넣는 금융 상품이에요." },
      { level: "medium", icon: "🏘️", q: "과거와 현대의 명당에 대한 설명으로 옳지 않은 것은?", opts: ["과거뿐만 아니라 현대에도 남향집이 인기가 있다.", "최근에는 명당의 조건에 학군과 교통이 추가되었다.", "과거의 명당은 앞에 산이 있고 뒤에 물이 흐르는 곳이다.", "과거에는 집의 위치와 방향이 사람의 행복을 결정한다고 믿었다."], a: 2, explain: "과거의 명당은 반대로 뒤에 산이 있고 앞에 물이 흐르는 곳이라고 여겼어요." },
      { level: "medium", icon: "🌐", q: "문화포털(www.culture.go.kr)에 대한 설명으로 옳지 않은 것은?", opts: ["전시나 공연의 정보를 쉽게 검색할 수 있다.", "문화 정보는 제공하지만 도서 정보는 제공하지 않는다.", "이용자들의 후기가 있어서 공연을 선택할 때 참고할 수 있다.", "회원 가입을 하면 새로운 문화 정보를 더 편리하게 찾아볼 수 있다."], a: 1, explain: "문화포털에서는 문화 정보뿐만 아니라 국내외의 문화 관련 영상과 도서 정보도 함께 제공하고 있어요." },
      { level: "medium", icon: "📅", q: "식품의 유통 기한에 대한 설명으로 옳지 않은 것은?", opts: ["소비자가 식품을 먹을 수 있는 날짜를 의미한다.", "이 날짜가 지나면 상하지 않은 식품도 판매하면 안 된다.", "판매자가 소비자에게 식품을 판매할 수 있는 날짜를 말한다.", "보통 년, 월, 일로 표시하지만 시간까지 표시하는 경우도 있다."], a: 0, explain: "소비자가 식품을 먹을 수 있는 날짜는 '소비 기한'이에요. 유통 기한이 지난 식품도 소비 기한 이내에는 먹을 수 있어요." },
      { level: "medium", icon: "🛠️", q: "전자 제품 보증 기간에 대한 설명으로 옳지 않은 것은?", opts: ["보증 기간은 구입 일자를 기준으로 하며 영수증으로 확인할 수 있다.", "보증서가 있으면 보증 기간 내에 언제나 무상으로 수리받을 수 있다.", "일반 전자 제품은 1년, 계절 제품은 2년으로 제품에 따라 보증 기간이 다르다.", "제품 보증 기간은 제조사나 판매자가 소비자에게 무상 수리를 약속하는 기간이다."], a: 1, explain: "보증 기간이 지나지 않았어도 사용 설명서의 주의 사항을 안 지켰거나 소비자의 잘못으로 고장이 났을 때는 수리 비용을 지불해야 해요." },
      { level: "medium", icon: "💼", q: "급여와 세금에 대한 설명으로 옳지 않은 것은?", opts: ["급여는 보통 은행 계좌를 통해서 받는다.", "한국의 직장인들은 보통 한 달에 한 번씩 급여를 받는다.", "계좌에 입금되는 돈과 회사에서 지급하는 월급은 동일하다.", "급여의 액수가 많으면 많을수록 세금을 내는 비율도 높아진다."], a: 2, explain: "월급에서 세금이나 건강 보험료 등을 공제한 만큼 계좌에 입금되기 때문에, 지급되는 월급과 계좌에 입금되는 돈은 차이가 있어요." },
      { level: "medium", icon: "🏘️", q: "공유 주택에 대한 설명으로 옳지 않은 것은?", opts: ["공유 주택은 공유 공간과 각자의 독립된 공간으로 나누어져 있다.", "공유 주택은 두 명 이상의 사람들과 집을 공유하는 임대 주택을 말한다.", "월세는 주변 셋집과 비슷하지만 다양한 인간관계를 맺을 수 있어서 좋다.", "퇴근 후에 함께 거주하는 사람들과 대화도 하고 식사도 하면서 시간을 보낼 수 있다."], a: 2, explain: "공유 주택의 월세는 주변 집세보다 싸요. 집세가 싸고 계약 기간이 짧아서 사회생활을 막 시작하는 사람들에게 인기가 많아요." },
      { level: "medium", icon: "🎎", q: "단오에 대한 설명으로 옳지 않은 것은?", opts: ["1년 중 만물의 기운이 가장 강한 날이다.", "단오는 양력 5월 5일로 한국의 명절이다.", "남자들은 씨름을 하고 여자들은 그네를 탔다.", "단오 때 창포물에 머리를 감는 풍습이 있었다."], a: 1, explain: "단오는 양력이 아닌 음력 5월 5일로, 1년 중 만물의 기운이 가장 강한 날이라고 여겼어요." },
      { level: "medium", icon: "⚖️", q: "워라밸(work-life balance)에 대한 설명으로 옳지 않은 것은?", opts: ["워라밸이란 일과 개인 생활의 균형을 의미한다.", "최근에는 사회적인 성공보다 개인의 행복을 중시한다.", "정부도 근로자의 주당 근무 시간을 최대 40시간으로 줄였다.", "직장인들은 정시에 퇴근해 '저녁이 있는 삶'을 살기를 원한다."], a: 2, explain: "정부는 근로자의 주당 근무 시간을 최대 52시간으로 정해 놓았어요. 주 5일, 하루 8시간 근무에 주 12시간까지 추가 근무가 가능해요." },
      { level: "medium", icon: "🈵", q: "휴대 전화 개통 방법에 대한 설명으로 옳지 않은 것은?", opts: ["유심(USIM) 카드가 있으면 챙겨 가는 것이 좋다.", "휴대 전화를 개통하려면 신분증이 꼭 있어야 한다.", "한국의 대표적인 통신사로는 SKT, KT, LG U+가 있다.", "외국인 등록을 하지 않아도 휴대 전화를 개통할 수 있다."], a: 3, explain: "외국인의 경우 외국인 등록을 하지 않으면 본인 이름으로 휴대 전화를 개통할 수 없어요." },
      { level: "medium", icon: "🛂", q: "이민자 정착 프로그램에 대한 설명으로 옳은 것은?", opts: ["'조기적응프로그램'은 모든 이민자에게 똑같은 교육을 한다.", "'사회통합프로그램'은 이민자의 조건에 따라 참여할 수 있다.", "'다문화 가족 방문교육 서비스'는 학생이 교육 센터를 방문한다.", "이민자 정착 프로그램에 관한 안내는 '사회통합정보망' 홈페이지에서 확인할 수 있다."], a: 3, explain: "'조기적응프로그램'은 체류 유형에 따라 필요한 교육을 하고, '사회통합프로그램'은 누구든지 참여할 수 있으며, '다문화 가족 방문교육 서비스'는 교사가 가정을 방문해요." },
      { level: "medium", icon: "👶", q: "출산 장려 정책으로 옳지 않은 것은?", opts: ["출산 장려 정책으로 제공되는 혜택은 전국적으로 동일하다.", "출산 휴가, 출산 축하금 지급 등은 대표적인 출산 장려 정책이다.", "'정부24' 홈페이지에서 출산 장려 정책과 관련된 서비스를 안내 받을 수 있다.", "출산 장려 정책으로 제공되는 혜택이 다양하기 때문에 자신에게 맞는 것을 선택할 수 있다."], a: 0, explain: "출산 장려 정책은 지방 자치 단체마다 차이가 있으므로 살고 있는 지역의 혜택을 잘 확인해야 해요." },
      { level: "medium", icon: "🌡️", q: "온돌에 대한 설명으로 옳은 것은?", opts: ["온돌은 난방과 요리를 같이 할 수 없다.", "온돌의 구들은 오랫동안 따뜻함이 유지된다.", "온돌은 방을 따뜻하게 하는 현대적인 난방 방법이다.", "온돌은 불을 때는 굴뚝과 연기가 빠지는 아궁이로 되어 있다."], a: 1, explain: "온돌은 아궁이에 불을 때면 구들이 오랫동안 따뜻함을 유지하는 한국의 전통 난방 방법이에요. 아궁이에서 요리도 함께 할 수 있어요." },
      { level: "medium", icon: "🎊", q: "성년의 날에 대한 설명으로 옳지 않은 것은?", opts: ["한국에서는 매년 5월 셋째 주 월요일이 성년의 날이다.", "예전에는 '관례', '계례'라는 의식을 통해 성인으로 인정받았다.", "한국에서는 만 20세가 되면 성인으로서 권리, 의무, 책임을 가지게 된다.", "친구들끼리 선물을 주고받거나 가족, 주변의 어른에게 선물을 받으며 성년이 된 것을 축하한다."], a: 2, explain: "한국에서는 만 19세가 되면 성인으로서 권리, 의무, 책임을 가지게 돼요. 이때부터 음주・흡연이 가능하고 부모 동의 없이 결혼할 수 있어요." },
      { level: "medium", icon: "📜", q: "한국의 절기에 대한 설명으로 옳은 것은?", opts: ["춘분은 봄의 시작을 알리는 절기이다.", "하지는 낮과 밤의 길이가 같은 날이다.", "동지는 1년 중에 밤의 길이가 가장 긴 날이다.", "입춘은 1년 중 낮의 길이가 가장 긴 날을 말한다."], a: 2, explain: "동지는 1년 중 밤의 길이가 가장 긴 날이에요. 춘분은 낮과 밤의 길이가 같은 날, 하지는 낮이 가장 긴 날, 입춘은 봄의 시작을 알리는 절기예요." },
      { level: "medium", icon: "🎌", q: "아리랑에 대한 설명으로 옳은 것은?", opts: ["아리랑은 원래 즐거운 일이 있을 때 부르던 노래다.", "아리랑의 노랫말은 한국인의 정서와 한을 표현하고 있다.", "아리랑은 옛날부터 불리어 왔지만 지금은 거의 부르지 않는다.", "아리랑은 지역에 관계없이 모두 같아서 한국인의 동질성을 표현한다."], a: 1, explain: "아리랑은 일을 하며 힘든 것을 이겨 내기 위해 부르던 노동요로, 사랑・이별・시집살이 등 한국인의 정서와 한이 담겨 있어요." },
      { level: "medium", icon: "🌐", q: "국제기구에 대한 설명으로 옳지 않은 것은?", opts: ["국제기구 중에서 가장 대표적인 것은 국제연합(UN)이다.", "현대 사회에서 국제기구의 역할이 점점 더 중요해지고 있다.", "동남아국가연합(ASEAN), 세계무역기구(WTO)도 국제기구이다.", "국제기구는 강대국이 국제 사회의 문제를 해결하기 위해 만들어졌다."], a: 3, explain: "국제기구는 강대국만이 아니라 둘 이상의 국가가 모여 국제 사회의 문제 해결과 발전을 위해 함께 만든 단체예요." },
      { level: "medium", icon: "🏥", q: "한국의 국민 건강 보험 제도에 대한 설명으로 옳은 것은?", opts: ["보험료는 소득이나 재산과 관계없이 모두 동일하다.", "국민 건강 보험은 재외 동포와 외국인도 가입할 수 있다.", "대체로 한국에 3개월 이상 거주하는 경우 가입할 수 있다.", "국민 건강 보험은 개인의 의사에 따라 선택해서 가입할 수 있다."], a: 1, explain: "국민 건강 보험은 재외 동포와 외국인도 가입할 수 있어요. 보험료는 소득・재산에 따라 다르며, 한국에 6개월 이상 거주하면 의무적으로 가입해야 해요." },
      { level: "medium", icon: "📱", q: "스마트폰과 애플리케이션에 대한 설명으로 옳지 않은 것은?", opts: ["스마트폰에 애플리케이션을 설치해서 많은 일을 할 수 있다.", "스마트폰보다는 컴퓨터를 사용해서 메시지, 사진, 동영상을 보낸다.", "동영상 재생 애플리케이션을 사용해서 여러 가지 영상을 볼 수 있다.", "카카오톡, 위챗, 라인 등이 가장 많이 사용되는 채팅 애플리케이션이다."], a: 1, explain: "요즘에는 컴퓨터보다 스마트폰의 카카오톡, 위챗, 라인, 밴드 같은 채팅 애플리케이션을 이용하는 경우가 더 많아요." },
      { level: "medium", icon: "🚨", q: "사고와 예방에 대한 설명으로 옳은 것은?", opts: ["최근에 휴대 전화로 인한 교통사고가 줄고 있다.", "한국에서는 교통사고가 전체 사고의 50%를 차지한다.", "교통사고 예방을 위해 항상 안전거리를 유지해야 한다.", "대부분의 사고는 갑자기 발생하기 때문에 예방할 수 없다."], a: 2, explain: "한국에서는 교통사고가 전체 사고의 70% 이상을 차지하며, 안전거리 유지와 같은 작은 주의만으로도 대부분의 사고를 예방할 수 있어요." },
      { level: "medium", icon: "💬", q: "말과 관련된 한국 속담에 대한 설명으로 옳지 않은 것은?", opts: ["'발 없는 말이 천 리 간다'는 말을 할 때 조심해서 하라는 뜻이 있다.", "'낮말은 새가 듣고 밤말은 쥐가 듣는다'는 동물도 말을 이해한다는 뜻이다.", "'말이 씨가 된다'는 속담에서 말을 중시하는 한국인의 사고방식을 알 수 있다.", "'입은 삐뚤어져도 말은 바로 해라'는 어떤 상황에서도 말을 바르게 하라는 뜻이다."], a: 1, explain: "'낮말은 새가 듣고 밤말은 쥐가 듣는다'는 동물이 말을 이해한다는 뜻이 아니라, 말을 할 때 언제나 조심해야 한다는 뜻을 가진 속담이에요." },
      { level: "medium", icon: "🏫", q: "평생교육에 대한 설명으로 옳은 것은?", opts: ["가정주부와 직장인만 원칙적으로 평생교육을 받을 수 있다.", "평생교육에서 인기 있는 분야는 초등학교 과정과 대학교 과정이다.", "평생교육 과정은 하위 과정과 자격증이나 수료증을 받는 과정이 있다.", "평생교육을 담당하는 기관은 대학교이며 직접 방문하여 원하는 교육 내용을 신청해야 한다."], a: 2, explain: "평생교육 과정에는 하위 과정과 자격증・수료증을 받는 과정이 있어요. 가정주부와 직장인뿐 아니라 모든 사람이 받을 수 있고, 사회복지・뷰티요법・보육 등 실용 분야의 인기가 높으며, 민간 기관과 대학 기관에서 강좌가 이루어져요." },
      /* ↓ 익힘책 영역별 연습문제 제28장~제32장(84~98쪽) 문화 12번 */
      { level: "medium", icon: "🗳️", q: "한국의 선거에 대한 설명으로 옳지 않은 것은?", opts: ["한국에서는 크게 3번의 선거가 실시된다.", "대통령과 국회 의원의 임기는 모두 4년이다.", "선거는 민주주의를 유지하고 발전시키는 가장 중요한 요소이다.", "보통 선거, 평등 선거, 직접 선거, 비밀 선거라는 선거의 4대 원칙이 있다."], a: 1, explain: "대통령의 임기는 5년이며, 국회 의원・지방 자치 단체장・지방 의회 의원의 임기는 4년이에요." },
      { level: "medium", icon: "🌍", q: "환경 보전 운동에 대한 설명으로 옳은 것은?", opts: ["유엔환경계획(UNEP)이라는 국제기구가 설립될 예정이다.", "현재 환경 문제는 매우 심각한 수준으로, 해결하기 어렵다.", "환경 문제는 전 세계가 안고 있는 가장 큰 문제 중 하나이다.", "개인의 노력과 상관없이 정부의 노력으로 환경 문제를 해결할 수 있다."], a: 2, explain: "유엔환경계획(UNEP)은 1972년에 이미 창립됐고, 여러 나라가 협력해 환경 문제 해결을 위해 노력하고 있으며, 정부의 노력과 함께 개개인의 관심과 노력도 중요해요." },
      { level: "medium", icon: "💳", q: "국민연금에 대한 설명으로 옳지 않은 것은?", opts: ["국민연금은 대표적인 사회 보장 제도 중 하나이다.", "한국에 살고 있는 외국인도 국민연금에 가입해야 한다.", "국민연금공단 홈페이지에서 가입 대상을 확인할 수 있다.", "소득이 있을 때 매달 보험료를 내고 아플 때 도움을 받는다."], a: 3, explain: "국민연금은 아플 때가 아니라, 나이가 들거나 질병 등으로 소득이 끊겼을 때 연금을 받는 제도예요." },
      { level: "medium", icon: "⚖️", q: "'찾기 쉬운 생활법령정보'에 대한 설명으로 옳은 것은?", opts: ["'찾기 쉬운 생활법령정보'는 모든 언어로 제공된다.", "법무부나 경찰청 등의 기관에서는 법과 관련된 정보를 얻을 수 없다.", "국민들이 법령 정보를 얻을 수 있도록 홈페이지를 통해 정보를 제공한다.", "주제에 따른 법을 찾을 수는 있지만 이해하기 어려워 정보를 활용하기 어렵다."], a: 2, explain: "'찾기 쉬운 생활 법령 정보'는 12개 언어로 제공되며, 법무부・경찰청도 SNS를 통해 정보를 소개하고, 가정・금융・교통 등 여러 주제의 법을 쉽게 설명해 줘요." },
      { level: "medium", icon: "🪪", q: "사회통합프로그램과 한국 국적 취득에 대한 설명으로 옳지 않은 것은?", opts: ["한국 국적을 취득할 때 한국 국민으로서의 기본 소양을 평가받는다.", "귀화심사는 서류 심사, 면접 심사, 실태 조사 등의 과정으로 이루어진다.", "귀화 허가일로부터 2년 안에 본국 국적을 포기하고 주민 등록을 해야 한다.", "한국 국적을 신청할 때 귀화 신청서, 여권, 본국 신분증 원본 등의 서류가 필요하다."], a: 2, explain: "귀화 허가일로부터 '1년' 안에 본국 국적을 포기하고 주민 등록을 하면 주민등록증을 받을 수 있어요." },
    ]
  }  ,

  { level: "medium", icon: "🌱", q: "다음은 '생활 속 환경 보호 실천'에 대한 글입니다. 환경 보호를 위한 실천 방법으로 언급된 것은?\n\n환경이 오염되면 사람들의 삶의 질이 낮아질 뿐만 아니라 미래의 사람들도 고통을 받을 것이다. 환경 오염의 원인으로는 자동차 배기가스로 인한 대기 오염, 생활 하수와 공장 폐수로 인한 수질 오염, 잘 분해되지 않는 플라스틱 쓰레기로 인한 토양 오염 등이 있다. 이를 줄이기 위해 가까운 거리는 자전거나 대중교통을 이용하고, 샴푸나 세제 사용을 줄이는 등 생활 속 작은 실천이 필요하다.", opts: ["가까운 거리는 자전거나 대중교통을 이용한다", "일회용품을 더 많이 사용한다", "샴푸와 세제를 더 많이 사용한다", "자동차를 새로 산다"], a: 0, explain: "메모의 '어떤 노력이 필요한가?' 항목에 '자전거나 대중교통을 이용', '샴푸 및 세제 사용 줄이기'라고 되어 있으므로 정답이에요." },

  { level: "medium", icon: "💱", q: "다음은 '일상생활에서 물가 변화가 큰 품목'에 대한 글입니다. 신선 식품의 가격이 자주 변하는 이유로 언급된 것은?\n\n일상생활에서 사람들이 자주 사는 물건의 가격 변화는 누구나 쉽게 느낄 수 있다. 그중에서도 특히 채소나 야채 같은 신선 식품이 물가 변화를 피부로 느끼게 하는 대표적인 예이다. 신선 식품은 홍수나 가뭄 같은 계절적 요인의 영향을 많이 받아 가격 변동이 크다. 반면 쌀과 같이 정부가 관리하는 생활필수품은 가격 변동이 크지 않은 편이다.", opts: ["홍수, 가뭄 등 계절적 요인", "정부의 세금 정책", "공장의 생산량 증가", "해외 수출 증가"], a: 0, explain: "메모의 '물가 변화가 일어난 이유' 항목에 '홍수, 가뭄 등 계절적 요인'이라고 되어 있으므로 정답이에요." },

  { level: "medium", icon: "⚖️", q: "다음은 '법과 질서의 필요성'에 대한 글입니다. 법과 질서가 필요한 이유로 언급된 것은?\n\n여러 사람들이 사회에 모여 함께 살다 보면 크고 작은 문제가 생긴다. 이러한 문제들을 해결하고 서로 잘 어울려 살아가기 위해 법과 질서가 필요하다. 예를 들어 금연 구역에서 담배를 피우면 담배 연기와 냄새로 다른 사람에게 피해를 줄 수 있는데, 이런 문제를 막기 위해서도 법과 질서를 지키는 것이 중요하다.", opts: ["사회에서 생기는 크고 작은 문제를 해결하고 서로 잘 어울려 살아가기 위해서", "경제를 성장시키기 위해서", "외국인을 관리하기 위해서", "전통을 지키기 위해서"], a: 0, explain: "메모의 '법과 질서의 필요성' 항목에 '문제들을 해결하고 서로 잘 어울려 살아가기 위함'이라고 되어 있으므로 정답이에요." },

      { level: "hard", icon: "🧭", q: "다음 글을 읽고 물음에 답하세요.\n\n먼 나라에 와서 적응하는 것이 쉬운 일은 아니지만 제 경험으로 볼 때 지름길은 있습니다. 그것은 바로 호기심입니다. 문화도 언어도 모르는 외국에 나가면 겁이 나는 것은 어쩌면 당연한 일입니다. 그러나 호기심으로 다가서면 상황이 바뀝니다. '모르면 어때? 배우면 되지.'라고 하는 태도가 필요하다는 것입니다. 그런 태도로 낯선 환경을 알아 가고 노력하면 자기도 모르는 사이에 외국 생활에 익숙해지고 처음에는 안 보인 기회도 잡힐 것입니다.\n\n이 글의 중심 생각은 무엇입니까?", opts: ["다른 나라의 언어와 문화는 그 나라에 가서 배우는 게 더 좋다.", "다른 나라에 이주해서 사는 것을 쉽게 생각하는 것은 좋지 않다.", "다른 나라에서 적응이 어려울 때는 지름길을 찾기 위해 노력해야 한다.", "다른 나라에서의 생활은 겁이 나지만 호기심을 가지면 적응을 잘 할 수 있다."], a: 3, explain: "글쓴이는 낯선 나라에 적응하는 지름길이 '호기심'이라고 말하며, 호기심을 가지면 겁이 나도 잘 적응할 수 있다고 이야기하고 있어요." },
      { level: "hard", icon: "🏥", q: "다음 ( )에 들어갈 말로 알맞은 것을 고르세요.\n\n의학 기술의 발달로 인간의 기대 수명은 과거보다 크게 늘어났지만 현대인들은 여전히 여러 질병에 시달리고 있다. 암이나 고혈압, 당뇨병 등은 현대인들이 자주 걸리는 병으로 흔히 ( )이라고 불린다. 이는 이들 질병의 직접적인 원인이 확인되지 않았고 잘못된 생활 습관과 밀접한 관련이 있기 때문이다.\n예를 들어 암은 한국인의 사망 원인 1위를 차지하는 병이다. 암의 원인으로 다양한 요인이 있지만 흡연, 음주, 스트레스, 잘못된 식습관, 운동 부족 등이 영향을 주는 것으로 알려져 있다. 고혈압이나 당뇨병 역시 기름진 식사, 탄수화물과 소금의 과도한 섭취, 인스턴트 식품의 섭취 등과 관계가 있다.\n이들 질병에 어떻게 대처해야 할까? 전문가들은 적절한 치료를 받되 ( ) 권하고 있다. 즉, 균형 잡힌 식사와 규칙적인 운동을 해야 한다는 것이다.", opts: ["불치병, 스트레스를 줄이도록", "불치병, 습관을 바꾸도록", "생활 습관병, 스트레스를 줄이도록", "생활 습관병, 습관을 바꾸도록"], a: 3, explain: "직접적인 원인이 불명확하고 생활 습관과 관련이 깊은 병을 '생활 습관병'이라고 하며, 전문가들은 잘못된 습관을 바꾸도록 권하고 있어요." },
      { level: "medium", icon: "🏠", q: "다음 글에 대한 설명으로 옳지 않은 것을 고르세요.\n\n1인 가구의 증가는 우리의 생활에도 많은 변화를 가져왔다. 혼자 편하게 식사할 수 있는 식당이 생겼고 1인분만 시켜도 배달이 가능해졌다. 마트에 가면 소포장된 상품도 흔히 볼 수 있다. 채소나 과일뿐만 아니라 생필품이나 가전제품도 1인 가구에 맞춰 나오고 있다. 혼자 사는 가구가 늘어나면서 소형 아파트나 소형 오피스텔도 꾸준히 인기를 얻고 있다. 또한 청소, 장보기, 대여, 짐 보관 등 1인 가구를 위한 서비스업의 규모도 점점 커지고 있다.\n이렇게 혼자 사는 가구가 점점 늘어나면 우리 사회에 크고 작은 변화가 생길 수밖에 없다. 이에 따라 전통적인 가구 형태에 맞춘 정책을 개선해야 한다는 목소리가 커지고 있다. 주거 지원, 돌봄 서비스 등 1인 가구들이 살기 좋은 사회를 만들기 위한 정책 마련이 시급하다.", opts: ["최근 혼자 식사할 수 있는 식당이 생겼다.", "바쁜 1인 가구를 위해 다양한 서비스 시장이 커지고 있다.", "1인 가구가 증가하고 있지만 중대형 아파트의 인기는 여전하다.", "마트에서는 1인 가구를 위한 소포장 상품도 쉽게 찾아볼 수 있다."], a: 2, explain: "글에서는 1인 가구가 늘면서 소형 아파트나 소형 오피스텔이 인기를 얻고 있다고 했어요. 중대형 아파트의 인기가 여전하다는 내용은 없어요." },
      { level: "medium", icon: "🤖", q: "다음 글의 내용과 다른 것을 고르세요.\n\n우리 사회는 끊임없이 발전하고 있다. 사람들은 편리한 생활을 위해 새로운 것을 개발하고 기술을 발전시킨다. 최근 현실과 가상의 세계, 그리고 모든 사물을 인터넷으로 연결하려는 움직임이 나타나고 있다. 어떠한 기술이 이런 일을 가능하게 만들까?\n먼저 인공 지능(AI)은 음성으로 정보 검색이 가능하다. 인공 지능(AI) 스피커에게 궁금한 것을 말하면 알아서 대답해 준다. 예를 들어, 오늘의 날씨나 일정 등을 물어보면 바로 응답한다. 또한 최근 많이 사용되는 로봇 청소기 외에 의료 분야에서도 로봇이 주목받고 있다. 실버 로봇은 몸이 불편한 노인들의 식사와 세수를 돕기도 한다. 사물 인터넷(IoT)은 휴대 전화 하나로 집 안의 모든 것을 제어할 수 있다. 예를 들어 휴대 전화로 불을 켜거나 끄고 창문을 열거나 닫을 수 있다. 가상 현실은 우리가 실제처럼 보고, 듣고, 느낄 수 있게 하는 기술이다. 집에서도 가상 현실(VR) 기기를 이용해서 가고 싶은 관광지를 가상 현실 속에서 체험할 수 있다.", opts: ["인간의 편한 생활을 위해 기술이 계속 발전하고 있다.", "가상 현실(VR) 기술 덕분에 실제 가고 싶은 관광지를 갈 필요가 없게 되었다.", "인공 지능 기술은 음성으로 날씨나 일정 등의 정보를 검색하고 알려 준다.", "사물 인터넷은 휴대 전화를 이용해 집 안의 여러 가지를 제어할 수 있다."], a: 1, explain: "글에서는 가상 현실 기기로 관광지를 '체험'할 수 있다고 했을 뿐, 실제 여행이 필요 없게 되었다는 내용은 없어요." },
      { level: "medium", icon: "🎂", q: "다음 글에 대한 설명으로 옳지 않은 것을 고르세요.\n\n지난달에는 가족 행사가 많았다. 작년에 태어난 조카는 돌을 맞았고 시어머니도 예순한 살이 되셔서 우리 가족은 큰 잔치를 두 번이나 치렀다. 남편은 이 두 생일이 한국인들에게 아주 중요하다고 했다.\n돌잔치에서는 오랜만에 친척들을 볼 수 있어서 반가웠다. 그리고 무엇보다도 재미있었던 것은 아기의 장래를 추측하는 돌잡이 행사였다. 예를 들어 아기가 실을 잡으면 장수하고 돈이나 쌀을 잡으면 부자가 되고 연필을 잡으면 공부를 잘할 거라고 추측한다. 친척들은 조카가 돈이나 연필을 잡기를 바랐다. 그런데 우리 조카는 마이크를 잡아서 모두 웃었다. 조카가 나중에 유명한 가수가 되면 좋겠다.\n얼마 있다가 우리 가족은 시어머니의 환갑잔치도 치렀다. 맛있는 음식도 먹고 자녀들, 손주들이 다 같이 부모님께 절을 올렸다. 시어머니께서는 너무나 감격한 나머지 눈물을 흘리기도 하셨다. 또 우리는 환갑 여행도 보내 드렸는데 부모님은 여행을 다녀오시더니 너무 좋았다고 하셨다.", opts: ["시어머니는 자식과 손주들의 절을 받고 기분이 좋아 눈물을 흘리셨다.", "조카는 돌잔치에서 연필을 잡아 친척들이 공부를 잘할 것이라고 했다.", "시어머니와 시아버지는 다녀오신 환갑 기념 여행이 만족스럽다고 하셨다.", "이 사람은 지난달에 조카의 돌잔치와 시어머니의 환갑잔치가 같이 있었다."], a: 1, explain: "조카는 돌잡이에서 연필이 아니라 마이크를 잡아서 사람들이 웃었어요. 연필을 잡았다는 내용은 글의 내용과 달라요." },
      { level: "hard", icon: "📵", q: "다음 ( )에 들어갈 말로 알맞은 것을 고르세요.\n\n스마트폰 하나로 대부분의 일을 해결할 수 있지만 잘 관리하지 않으면 이에 따른 문제도 크다. 먼저 스마트폰의 지나친 사용으로 중독에 빠질 수 있다. 스마트폰이 없을 때 불안해서 일을 할 수 없다면 중독이다. 스마트폰으로만 대화를 하니 당연히 이웃뿐만 아니라 가족과도 대화가 단절될 수밖에 없다. 스마트폰을 분실하거나 해킹을 당할 경우 ( )(이)라는 심각한 문제가 생긴다. 사생활이 노출되어 한 개인에게 나쁜 영향을 끼칠 수 있다. 아무리 유용한 것도 관리에 소홀하다면 피해가 생길 수밖에 없다.", opts: ["사생활 침해", "개인 정보 유출", "스마트폰 중독", "시력 감퇴 및 운동 부족"], a: 1, explain: "분실이나 해킹으로 인해 생기는 문제이자 뒤 문장의 '사생활이 노출되어'와 이어지는 말은 '개인 정보 유출'이에요." },
      { level: "medium", icon: "📵", q: "스마트폰 하나로 대부분의 일을 해결할 수 있지만 잘 관리하지 않으면 이에 따른 문제도 크다. 먼저 스마트폰의 지나친 사용으로 중독에 빠질 수 있다. 스마트폰이 없을 때 불안해서 일을 할 수 없다면 중독이다. 스마트폰으로만 대화를 하니 당연히 이웃뿐만 아니라 가족과도 대화가 단절될 수밖에 없다. 스마트폰을 분실하거나 해킹을 당할 경우 ( )(이)라는 심각한 문제가 생긴다. 사생활이 노출되어 한 개인에게 나쁜 영향을 끼칠 수 있다. 아무리 유용한 것도 관리에 소홀하다면 피해가 생길 수밖에 없다.\n\n위 지문(스마트폰 관리)의 중심 내용으로 옳은 것을 고르세요.", opts: ["스마트폰은 우리 생활을 편리하게 해 주는 것이다.", "요즘 스마트폰 중독에 빠진 사람이 많아 사회 문제가 된다.", "스마트폰 때문에 가족과 대화가 단절되는 것을 막아야 한다.", "스마트폰으로 인해 다양한 문제도 생기므로 관리를 잘해야 한다."], a: 3, explain: "글쓴이는 스마트폰으로 인해 중독, 대화 단절, 개인 정보 유출 등 다양한 문제가 생길 수 있으므로 관리를 잘해야 한다고 말하고 있어요." },
      { level: "hard", icon: "🏛️", q: "다음 글의 내용과 같은 것을 고르세요.\n\n왕릉은 조선 왕릉 중 최초로 왕과 왕비가 함께 묻힌 곳으로 알려져 있다. 문화 해설사의 설명을 들으면서 왕릉을 둘러보았다. \"왕이 살아 있을 때는 '궁궐'에 있고, 죽고 나면 '왕릉'에 묻힙니다. 참고로 왕의 영혼을 모신 곳은 '종묘'입니다. 조선 시대 사람들에게 왕은 절대적인 존재였지요. 그러니까 궁궐만큼 왕릉을 잘 만들고 보존하는 것이 얼마나 큰일이었는지 모릅니다. 예를 들면 왕릉의 위치를 어디로 할지, 그 주변에 물과 산이 있는지, 왕릉의 모양과 방향은 어떻게 할지, 무슨 나무를 심고 어떤 조각상을 둘지 등에 대해 진지하게 생각을 했던 거지요.\"\n왕릉에 대한 설명을 자세히 들으니까 조선 왕릉이 유네스코 세계 문화유산으로 지정된 이유를 알 것 같았다. 조선 왕릉은 그 시대의 전통, 정치, 건축, 예술, 조경 등을 생생하게 느낄 수 있는 역사적인 곳이기 때문에 세계적으로도 그 가치를 인정한 것이다.", opts: ["조선의 모든 왕은 왕비와 같이 묻혔다.", "조선 시대에는 왕릉도 궁궐처럼 중요한 곳으로 여겼다.", "영릉은 유네스코 세계 문화유산으로 지정되기를 기다리고 있다.", "조선 시대에는 왕릉의 모양과 방향을 정해 주는 사람이 따로 있었다."], a: 1, explain: "글에서 '궁궐만큼 왕릉을 잘 만들고 보존하는 것이 얼마나 큰일이었는지 모른다'고 했으므로, 왕릉도 궁궐처럼 중요하게 여겼음을 알 수 있어요." },
      { level: "medium", icon: "🏛️", q: "왕릉은 조선 왕릉 중 최초로 왕과 왕비가 함께 묻힌 곳으로 알려져 있다. 문화 해설사의 설명을 들으면서 왕릉을 둘러보았다. \"왕이 살아 있을 때는 '궁궐'에 있고, 죽고 나면 '왕릉'에 묻힙니다. 참고로 왕의 영혼을 모신 곳은 '종묘'입니다. 조선 시대 사람들에게 왕은 절대적인 존재였지요. 그러니까 궁궐만큼 왕릉을 잘 만들고 보존하는 것이 얼마나 큰일이었는지 모릅니다. 예를 들면 왕릉의 위치를 어디로 할지, 그 주변에 물과 산이 있는지, 왕릉의 모양과 방향은 어떻게 할지, 무슨 나무를 심고 어떤 조각상을 둘지 등에 대해 진지하게 생각을 했던 거지요.\"\n왕릉에 대한 설명을 자세히 들으니까 조선 왕릉이 유네스코 세계 문화유산으로 지정된 ㉠을/를 알 것 같았다. 조선 왕릉은 그 시대의 전통, 정치, 건축, 예술, 조경 등을 생생하게 느낄 수 있는 역사적인 곳이기 때문에 세계적으로도 그 가치를 인정한 것이다.\n\n위 지문(왕릉)의 ㉠에 들어갈 알맞은 말을 고르세요.", opts: ["자신감", "이유", "변화", "현실"], a: 1, explain: "'조선 왕릉이 유네스코 세계 문화유산으로 지정된 ( )을/를 알 것 같았다'에는 '이유'가 들어가는 것이 자연스러워요." },

      { level: "hard", icon: "📚", q: "다음 내용과 같은 것을 고르세요.\n\n예전에는 학생의 흥미나 능력, 이해 등을 고려하지 않고 일방적으로 정한 교육 내용을 학생에게 쏟아붓는 주입식·암기식 교육이 주로 이루어졌다. 주입식·암기식 수업에서 학생들은 배운 내용을 외우는데 이는 빠르게 암기하는 두뇌 활동으로 이어져 학습 효과를 가져오기도 한다. 그러나 이 수업은 학생 한 사람 한 사람의 차이를 무시하고 모두 같은 내용과 분량을 가르쳐서 수업은 교사 중심으로 진행되었다. 아울러 학생들의 자유로운 사고를 열어 주지 못하고 미래 사회에 꼭 필요한 창의적인 사고를 길러 주지 못한다는 점에서 많은 비판을 받았다.", opts: ["주입식 교육은 자유롭고 창의적인 생각을 이끌지 못한다.", "주입식 교육에서는 학생의 활동이 매우 중요하게 생각된다.", "최근까지도 수업은 대부분 주입식 교육 방식으로 이루어졌다.", "교육 전문가들은 주입식 교육의 교육 효과가 전혀 없다고 본다."], a: 0, explain: "글에서 주입식 교육은 학생들의 자유로운 사고와 창의적인 사고를 길러 주지 못한다는 점에서 비판을 받았다고 했어요." },
      { level: "medium", icon: "🔇", q: "다음 ( )에 알맞은 것을 고르세요.\n\n주 민: 아파트 윗집에서 하루 종일 크고 작은 소음을 내서 정말 힘드네요. 관리 사무실을 통해 몇 번이나 조용히 해 달라고 부탁했는데 소용이 없고요. 어떻게 해야 하죠?\n상담원: 사실 지나친 층간 소음은 경범죄 처벌 대상입니다. 경범죄 처벌법에 따르면 인근 소란 등에 대해 10만 원 이하의 벌금으로 처벌하도록 규정하고 있습니다. 그런데 주로 어떤 소음이 들립니까?\n주 민: 아이들이 이리저리 뛰어다니는 소리가 제일 심해요. 일단 경찰에 신고하면 이 문제가 해결될까요?\n상담원: 아이들의 소리라고요? 어린이가 뛸 때 발생하는 소음은 ( ), 소음의 크기와 지속 시간을 명확히 측정할 수 없기 때문입니다.", opts: ["경찰에 신고하면 곧 해결할 수 있다고 합니다.", "경범죄 처벌법으로 처벌하기 어렵다고 들었습니다.", "경범죄이지만 윗집에서는 벌금을 많이 낼 것입니다.", "윗집에서 10만 원의 위로금을 주도록 되어 있습니다."], a: 1, explain: "뒤 문장에서 '소음의 크기와 지속 시간을 명확히 측정할 수 없기 때문'이라고 이유를 설명하고 있으므로, 처벌이 어렵다는 내용이 들어가야 해요." },
      { level: "medium", icon: "🚗", q: "다음 글의 내용과 같은 것을 고르세요.\n\n편의점 협회의 분석 결과에 따르면, 최근의 불황 속에서도 명절에 고속도로 휴게소 편의점을 다녀간 고객 수는 평소보다 약 4.1배 늘어난 것으로 조사되었다. 이는 일반 편의점의 매출 증가 대비 12배 이상 많은 수치이다. 또한 구매 상품의 경우 고향에 내려갈 때는 장거리 운전에 대비하기 위해 가벼운 먹을거리를 사고, 돌아올 때는 잠을 쫓을 커피를 구매하는 사람이 많은 것으로 조사되었다.\n이번 명절 기간에도 고속도로 휴게소 편의점을 방문하는 고객들이 증가할 전망이다. 이에 따라 휴게소 편의점에서는 고객들이 편의점을 더욱 편리하게 이용하도록 하기 위해 명절 전후로 상품 배치를 달리하는 등 매장 관리를 강화하고 있다.", opts: ["일반 편의점은 명절 기간에 위치를 바꿀 것이다.", "명절 기간 일반 편의점의 매출이 전국적으로 감소했다.", "집으로 돌아갈 때 운전자들은 졸음을 없애기 위해 커피를 많이 산다.", "고속도로 휴게소 편의점은 명절 이용 고객이 평소보다 12배 증가했다."], a: 2, explain: "글에서 '돌아올 때는 잠을 쫓을 커피를 구매하는 사람이 많다'고 했으므로, 졸음을 없애기 위해 커피를 많이 산다는 내용이 맞아요." },
      { level: "medium", icon: "✍️", q: "다음 글의 내용과 다른 것을 고르세요.\n\n저는 한국에 온 지 2년 가까이 된 결혼 이민자입니다. 이제는 이곳 생활이 조금 익숙해졌지만 처음에는 한국의 날씨와 문화, 음식이 적응이 안 돼 너무 힘든 나머지, 눈물을 흘리기도 했습니다. 서툰 한국말 때문에 많이 어려움을 겪었고, 주변에 말이 통하는 사람이 없어서 슬프고 막막했습니다. 그때 위로가 된 것은 근처의 센터에서 운영하는 사회통합프로그램이었습니다. 비슷한 처지의 외국인 친구들과 함께 한국어를 배우고 한국 생활에 대해 이야기를 나누면서 마음속의 답답함이 조금 풀렸습니다. 앞으로 4단계를 마치면 한국 국적을 취득할 수 있고 자동차 운전면허도 따고 싶습니다. 저는 앞으로 저 자신과 우리 가족의 행복한 미래를 위해 끊임없이 자기 계발을 하며 열심히 살아갈 생각입니다.", opts: ["이 사람은 2년 전쯤 한국에 왔다.", "이 사람은 이미 한국 국적을 취득했다.", "처음에는 한국 생활에 적응을 잘 못했다.", "이 사람은 지금 한국어 4단계를 배우고 있다."], a: 1, explain: "글쓴이는 '4단계를 마치면 한국 국적을 취득할 수 있다'고 했으므로, 아직 국적을 취득하지 않았어요." },
      { level: "medium", icon: "🔥", q: "다음 글의 내용과 다른 것을 고르세요.\n\n22일 오전 6시 38분경 경기도의 한 플라스틱 공장에서 화재가 발생했다. 불이 나자 소방차 5대, 소방대원 70명 등이 현장에 도착해서 불을 껐다. 현재까지 사망자는 없고 부상자만 2~3명 발생한 것으로 파악됐다.\n소방당국에 따르면 화재는 건물 지하 1층에서 발생해 2층까지 불길이 번졌으나 관계자들과 소방당국의 빠른 대처로 30분 만에 불을 끈 것으로 알려졌다. 한편 불에 탄 플라스틱 양이 약 200t에 달해 현장 정리 및 공장 정비까지 많은 시간이 걸릴 것으로 예상되고 있다. 소방당국은 전기 고장으로 화재가 발생한 것으로 보고 정확한 사고 원인을 조사하고 있다.", opts: ["화재의 원인은 전기 고장 때문인 것으로 추측된다.", "플라스틱 공장에서 불은 1시간도 되지 않아 꺼졌다.", "이번 화재로 인해 다친 사람은 있으나 죽은 사람은 없다.", "관계자들의 노력으로 화재 현장은 빠르게 정리될 것이다."], a: 3, explain: "글에서는 불에 탄 플라스틱 양이 많아 '현장 정리 및 공장 정비까지 많은 시간이 걸릴 것'이라고 했으므로, 빠르게 정리될 것이라는 내용은 틀려요." },
      { level: "hard", icon: "🗑️", q: "다음 ㉠에 들어갈 말로 알맞은 것을 고르세요.\n\n전국에서 발생한 쓰레기가 2018년 하루 평균 43만 899t으로 크게 증가했다. 1인당 하루에 3t이 넘는 쓰레기를 버린 셈이다. 이것은 작년과 비교할 때 4% 가까이 늘어난 것이다. 1990년대 쓰레기 종량제 시행으로 개선되었던 오랜 쓰레기 문제가 다시 악화된 것이다.\n쓰레기 급증의 주된 원인은 생활 쓰레기 증가로 전년 대비 5%나 늘었다. 이는 배달 문화가 확산되면서 포장재 사용이 늘어났기 때문이다. 한편 쓰레기 처리 시설이 부족한 점도 상황을 어렵게 하고 있다. ( ㉠ ) 전에는 '쓰레기 산'이 생길지도 모른다.\n쓰레기 문제를 해결하기 위해서는 결국 아껴 쓰고 나눠 쓰고 바꿔 쓰고 다시 쓰는 수밖에 없다. 이렇게 지나친 소비를 줄이고 쓰레기를 재활용하면 환경을 보호할 수 있을 뿐만 아니라 쓰레기는 쓰레기대로 줄이고 쓰레기 처리 비용까지 절약할 수 있을 것이다.", opts: ["이러한 상황을 바꾸므로 인해", "이러한 상황을 바꾸도록", "이러한 상황이 바뀌지 않는 한", "이러한 상황이 바뀌기 마련이므로"], a: 2, explain: "'-지 않는 한'은 앞의 조건이 계속되는 동안이라는 뜻으로, 상황이 바뀌지 않으면 쓰레기 산이 생길 수 있다는 문맥에 맞아요." },
      { level: "medium", icon: "🗑️", q: "전국에서 발생한 쓰레기가 2018년 하루 평균 43만 899t으로 크게 증가했다. 1인당 하루에 3t이 넘는 쓰레기를 버린 셈이다. 이것은 작년과 비교할 때 4% 가까이 늘어난 것이다. 1990년대 쓰레기 종량제 시행으로 개선되었던 오랜 쓰레기 문제가 다시 악화된 것이다.\n쓰레기 급증의 주된 원인은 생활 쓰레기 증가로 전년 대비 5%나 늘었다. 이는 배달 문화가 확산되면서 포장재 사용이 늘어났기 때문이다. 한편 쓰레기 처리 시설이 부족한 점도 상황을 어렵게 하고 있다. ( ㉠ ) 전에는 '쓰레기 산'이 생길지도 모른다.\n쓰레기 문제를 해결하기 위해서는 결국 아껴 쓰고 나눠 쓰고 바꿔 쓰고 다시 쓰는 수밖에 없다. 이렇게 지나친 소비를 줄이고 쓰레기를 재활용하면 환경을 보호할 수 있을 뿐만 아니라 쓰레기는 쓰레기대로 줄이고 쓰레기 처리 비용까지 절약할 수 있을 것이다.\n\n위 지문(쓰레기 문제)의 내용과 같은 것을 고르세요.", opts: ["1990대 이후 쓰레기 문제는 계속 나빠졌다.", "배달을 늘리면 쓰레기 문제가 해결될 것이다.", "1년 동안 1인당 쓰레기 배출량은 3t 이상이다.", "쓰레기 산이 늘고 있어서 환경이 오염되고 있다."], a: 2, explain: "글에서 '1인당 하루에 3t이 넘는 쓰레기를 버린 셈'이라고 했으므로, 1년 동안 1인당 쓰레기 배출량은 3t을 훨씬 넘어요." },
      { level: "hard", icon: "🗳️", q: "다음 ㉠에 들어갈 말로 알맞은 것을 고르세요.\n\n최근 투표율을 연령대별로 분석한 결과, 2030 청년들의 투표율은 지속적으로 늘어나고 있지만 여전히 6070 노인층의 투표율에 미치지 못하는 것으로 나타났다. 이런 결과는 젊은이들에게 ( ㉠ ) 유의해야 한다.\n예를 들어 노인 복지의 확대 같은 정책은 노인들의 혜택을 늘리므로 나이 든 사람들은 투표나 선거 과정에서 이 정책을 적극적으로 지지할 것이다. 그리고 정부는 투표 결과에 따라 노인 복지를 확대하는 정책을 실시할 것이다. 이렇게 된다면 젊은이들의 경제적인 부담은 늘 것이다.\n이처럼 청년들이 선거나 투표에 참여하지 않을 경우 이는 자신들의 미래를 노년이나 장년층에 맡기는 결과를 낳을 것이다. 젊은이들은 미래의 정책 방향을 정하는 각종 투표 결과에 가장 오래 영향을 받는다는 점을 인식하고 적극적으로 자신의 의사를 투표에 반영하도록 해야 할 것이다.", opts: ["혜택을 가져다주므로", "지지를 이끌 수 있어서", "투표 의욕을 갖게 하므로", "불리하게 작용할 수 있어서"], a: 3, explain: "노인층 위주의 정책 실시로 젊은이들의 경제적 부담이 늘 수 있다는 내용이 이어지므로, 젊은이들에게 불리하게 작용할 수 있다는 내용이 들어가야 해요." },
      { level: "medium", icon: "🗳️", q: "최근 투표율을 연령대별로 분석한 결과, 2030 청년들의 투표율은 지속적으로 늘어나고 있지만 여전히 6070 노인층의 투표율에 미치지 못하는 것으로 나타났다. 이런 결과는 젊은이들에게 ( ㉠ ) 유의해야 한다.\n예를 들어 노인 복지의 확대 같은 정책은 노인들의 혜택을 늘리므로 나이 든 사람들은 투표나 선거 과정에서 이 정책을 적극적으로 지지할 것이다. 그리고 정부는 투표 결과에 따라 노인 복지를 확대하는 정책을 실시할 것이다. 이렇게 된다면 젊은이들의 경제적인 부담은 늘 것이다.\n이처럼 청년들이 선거나 투표에 참여하지 않을 경우 이는 자신들의 미래를 노년이나 장년층에 맡기는 결과를 낳을 것이다. 젊은이들은 미래의 정책 방향을 정하는 각종 투표 결과에 가장 오래 영향을 받는다는 점을 인식하고 적극적으로 자신의 의사를 투표에 반영하도록 해야 할 것이다.\n\n위 지문(청년 투표율)의 중심 내용으로 적절한 것을 고르세요.", opts: ["젊은 층의 투표율을 더욱 높여야 한다.", "청년들은 선거에 참여할 필요를 못 느낀다.", "노장년 층의 높은 투표율은 바람직하지 않다.", "미래를 결정할 때 노장년 층의 경험을 활용해야 한다."], a: 0, explain: "글쓴이는 청년들이 적극적으로 투표에 참여해서 자신의 의사를 반영해야 한다고 말하고 있으므로, 젊은 층의 투표율을 높여야 한다는 것이 중심 내용이에요." },

      { level: "medium", icon: "🏆", q: "다음은 공모전 당선작 안내문의 일부 내용입니다. 안내문의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[세계인의 날 한국 생활 체험 수기 공모전 당선작 - 최우수상: '문화는 달라도 마음은 하나', 우수상: '오늘도 꿈을 꾼다', 장려상: '비 온 뒤 땅이 안 젖으랴']\n\n이 공모전은 한국 생활을 하면서 겪은 일에 대한 것이다.", opts: ["O", "X"], a: 0, explain: "안내문의 제목이 '한국 생활 체험 수기 공모전'이므로 한국 생활을 하면서 겪은 일에 대한 공모전이 맞아요." },
      { level: "medium", icon: "🏅", q: "[세계인의 날 한국 생활 체험 수기 공모전 당선작 - 최우수상: '문화는 달라도 마음은 하나', 우수상: '오늘도 꿈을 꾼다', 장려상: '비 온 뒤 땅이 안 젖으랴']\n\n1등 상(최우수상)은 '문화는 달라도 마음은 하나'라는 글을 쓴 고천 씨가 받았다. 위 안내문의 내용과 같습니까?", opts: ["O", "X"], a: 0, explain: "최우수상 수상작 제목과 이어지는 당선 소감의 글쓴이가 고천 씨로 나와 있으므로 맞는 내용이에요." },
      { level: "hard", icon: "🎤", q: "다음 글을 읽고 ㉠에 들어갈 알맞은 말을 고르세요.\n\n제가 최우수상을 받을 거라고는 상상도 못 했는데 이렇게 큰 상을 주셔서 정말 감사합니다. 제가 한국에 처음 왔을 때 문화 차이가 커서 불편한 점이 한두 개가 아니었습니다. 게다가 한국어가 서툴러서 제 마음을 잘 표현하지 못해 오해를 받기도 했지요. ( ㉠ ) 이제는 어느 정도 한국 문화에 익숙해졌고, 문화 차이가 오히려 재미있게 느껴집니다.", opts: ["그리고", "하지만", "따라서"], a: 1, explain: "앞의 힘들었던 내용과 뒤의 지금은 익숙해졌다는 내용이 반대되므로 '하지만'이 알맞아요." },
      { level: "medium", icon: "🎤", q: "제가 최우수상을 받을 거라고는 상상도 못 했는데 이렇게 큰 상을 주셔서 정말 감사합니다. 제가 한국에 처음 왔을 때 문화 차이가 커서 불편한 점이 한두 개가 아니었습니다. 게다가 한국어가 서툴러서 제 마음을 잘 표현하지 못해 오해를 받기도 했지요. ( ㉠ ) 이제는 어느 정도 한국 문화에 익숙해졌고, 문화 차이가 오히려 재미있게 느껴집니다.\n\n위 당선 소감 글의 내용과 같은 것을 고르세요.", opts: ["이 사람은 한국에 오기 전부터 한국어를 잘했다.", "이 사람은 지금 문화 차이 때문에 불편함을 느낀다.", "이 사람은 한국 생활에 빨리 적응하는 방법을 알고 있다."], a: 2, explain: "글쓴이는 다른 외국인에게 한국 생활에 빨리 적응하는 노하우를 알려 주고 싶다고 했으므로, 적응 방법을 알고 있다는 것이 맞아요." },

      { level: "medium", icon: "📈", q: "다음은 한국 고령화 인구 전망 그래프에 대한 설명입니다. 그래프의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[인구 고령화 전망: 고령 인구 비율이 2010년 11.0%에서 2050년 38.8%까지 계속 증가하는 그래프]\n\n한국은 앞으로 계속 노인 인구가 증가할 것이다.", opts: ["O", "X"], a: 0, explain: "그래프에서 고령 인구 비율이 2010년부터 2050년까지 계속 증가하고 있어요." },
      { level: "medium", icon: "📉", q: "[인구 고령화 전망: 고령 인구 비율이 2010년 11.0%에서 2050년 38.8%까지 계속 증가하는 그래프]\n\n2050년에는 노인 인구가 전체 인구의 절반이 될 것이다. 위 그래프의 내용과 같습니까?", opts: ["O", "X"], a: 1, explain: "2050년 고령 인구 비율은 38.8%로 전체 인구의 절반(50%)에는 미치지 못해요." },
      { level: "medium", icon: "📰", q: "다음 글에 나오지 않은 것을 고르세요.\n\n최근 저출산 현상, 평균 수명의 연장 등으로 인해 노인 인구가 점점 증가하고 한국 사회는 고령화 사회로 변화하고 있다. 고령화 사회는 전체 인구 가운데 65세 이상의 노인의 비율이 높은 사회를 말한다. 이러한 고령화 사회 현상은 노동력 부족 문제와 함께 노인 복지비의 증가 등 여러 사회 문제를 가져온다. 즉, 일을 할 수 있는 젊은 인구의 감소로 인해 사회적, 국가적 성장 속도는 느려질 수밖에 없다. 아울러 노인들을 위한 건강 지원으로 인해 의료비가 증가되는 등 국가적인 비용도 커진다. 그렇기 때문에 우리는 앞으로 다가올 고령화 사회의 문제점을 인식하고 고령화 사회에 대비하여 적절한 대책을 마련해야 할 것이다.", opts: ["고령화 사회의 개념", "고령화 사회의 원인", "고령화 사회의 장점"], a: 2, explain: "글에는 고령화 사회의 개념(65세 이상 비율이 높은 사회)과 원인(저출산, 평균 수명 연장)은 나오지만, 장점에 대한 내용은 없어요." },
      { level: "medium", icon: "📰", q: "최근 저출산 현상, 평균 수명의 연장 등으로 인해 노인 인구가 점점 증가하고 한국 사회는 고령화 사회로 변화하고 있다. 고령화 사회는 전체 인구 가운데 65세 이상의 노인의 비율이 높은 사회를 말한다. 이러한 고령화 사회 현상은 노동력 부족 문제와 함께 노인 복지비의 증가 등 여러 사회 문제를 가져온다. 즉, 일을 할 수 있는 젊은 인구의 감소로 인해 사회적, 국가적 성장 속도는 느려질 수밖에 없다. 아울러 노인들을 위한 건강 지원으로 인해 의료비가 증가되는 등 국가적인 비용도 커진다. 그렇기 때문에 우리는 앞으로 다가올 고령화 사회의 문제점을 인식하고 고령화 사회에 대비하여 적절한 대책을 마련해야 할 것이다.\n\n위 고령화 사회 관련 글의 내용과 같은 것을 고르세요.", opts: ["저출산 문제로 인해 의료비가 증가하고 있다.", "고령화 사회는 국가의 빠른 성장을 가져온다.", "고령화 사회가 진행될수록 일할 사람이 줄어든다."], a: 2, explain: "글에서 '일을 할 수 있는 젊은 인구의 감소'라고 했으므로, 고령화가 진행될수록 일할 사람이 줄어든다는 내용이 맞아요." },

      { level: "hard", icon: "🍫", q: "다음은 탄수화물 중독에 대한 글입니다. 글을 읽고 나오지 않은 것을 고르세요.\n\n탄수화물 중독은 하루에 필요한 양의 탄수화물을 섭취하고도 과자나 케이크와 같은 단 음식을 찾게 되는 증상을 말한다. 우리가 즐겨 먹는 밥, 라면, 국수, 과자, 빵, 사탕, 초콜릿 등은 모두 탄수화물을 대표하는 식품이다. 탄수화물은 우리 몸에 꼭 필요한 영양소이지만 지나치게 섭취할 경우 중독 증상이 나타날 수 있기 때문에 주의해야 한다. 탄수화물에 중독되면 점점 더 많은 양을 섭취하게 된다. 필요 이상으로 섭취한 탄수화물은 우리 몸에 쌓여 비만을 일으키고 당뇨병이나 고혈압 등의 성인병이 생기게 할 수 있다. 탄수화물 중독을 예방하기 위해서는 평소에 균형 잡힌 식사를 하고 잘못된 식습관은 고치는 것이 좋다. 예를 들어 과자나 케이크 대신 과일을 먹고 흰밥 대신 잡곡밥을 먹는 등의 노력을 계속하다 보면 탄수화물 중독 위험에서 벗어날 수 있을 것이다.", opts: ["탄수화물 중독의 뜻", "탄수화물 중독의 영향", "탄수화물 중독의 검사 방법"], a: 2, explain: "글에는 탄수화물 중독의 뜻과 영향(비만, 성인병)은 나오지만, 검사 방법에 대한 내용은 없어요." },

      { level: "hard", icon: "📱", q: "다음은 스마트폰 이용에 대한 신문 기사입니다. 글을 읽고 나오지 않은 것을 고르세요.\n\n한국IT연구소에 따르면 65세 이상 성인 중 스마트폰을 가지고 있는 사람이 3.5%에서 36%로 5년 만에 10배 이상 증가한 것으로 나타났다. 같은 기간 동안 스마트폰을 가지고 있는 청소년 수가 9%에서 36.2%로 4배 이상 증가한 것에 비하면, 노인 스마트폰 이용자가 급증했다고 볼 수 있다. 노인들은 스마트폰으로 주로 채팅이나 문자 메시지를 주고받는 것(36.5%)으로 나타났다. 이어서 동영상 시청(20.2%), 기사 검색(16.1%), 음악 듣기(9.2%), TV 시청(5%), 게임(5%) 등 미디어 이용이 많았다. 특히 최근에는 동영상 시청과 기사 검색이 많이 증가했다. 이처럼 노인들이 스마트폰으로 정보를 찾는 일은 많아졌다. 이러한 변화를 고려해 요즘 마을 복지 센터에서는 노인들을 위해 스마트폰 활용 교육을 실시하고 있다. 앞으로 이러한 교육은 노인뿐만 아니라 스마트폰을 이용하는 모든 사람들에게 중요해질 것이다.", opts: ["스마트폰 보유율", "스마트폰 이용 목적", "스마트폰 시장의 미래"], a: 2, explain: "글에는 노인의 스마트폰 보유율과 이용 목적은 나오지만, 스마트폰 시장의 미래에 대한 내용은 없어요." },

      { level: "hard", icon: "🚨", q: "다음은 보이스 피싱 피해에 대한 글입니다. 글을 읽고 나오지 않은 것을 고르세요.\n\n최근 보이스 피싱으로 인해 고통받는 피해자가 증가하고 있어 주의가 필요하다. 예전에는 금융 기관이나 경찰·검찰, 인터넷 메신저상의 친구라고 속여 피해자에게 돈을 입금하게 하는 것이 일반적이었다. 그런데 최근에는 스마트폰에 앱을 설치하게 하여 피해자의 개인 정보를 알아낸 뒤에 돈을 가져가는 등 사기 방법도 다양해지고 있다. 이렇게 보이스 피싱이 의심되는 전화나 메일, 문자를 받았을 때는 인터넷진흥원에서 운영하는 홈페이지 '보호나라'에 접속하여 신고하면 된다. 또한 모르는 사람이 보내온 문자 메시지나 메일에 포함된 링크는 함부로 클릭하지 않는 것이 좋다. 그 밖에 경찰청과 금감원에서 운영하는 홈페이지 '보이스 피싱 지킴이'에 방문하면 실제 사기범의 목소리와 피해에 대처하는 방법 등을 확인할 수 있다.", opts: ["보이스 피싱 피해의 유형", "보이스 피싱 피해의 발생 비율", "보이스 피싱 피해에 대처하는 방법"], a: 1, explain: "글에는 보이스 피싱의 여러 유형과 대처 방법은 나오지만, 발생 비율에 대한 내용은 없어요." },

      { level: "medium", icon: "💬", q: "다음은 맞춤법에 대한 온라인 게시판 답변입니다. 답변의 내용을 바탕으로, 아래 문장의 맞춤법이 맞으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[질문: '되요'와 '돼요' 중 어느 것이 맞나요?\n답변: '돼요'가 맞습니다. '되다'에 '-어요'가 붙은 '되어요'는 줄여서 '돼요'가 됩니다. 그리고 '되었습니다'는 '됐습니다', '되어서'는 '돼서'와 같이 써야 합니다.]\n\n벌써 퇴근 시간이 됐습니다.", opts: ["O", "X"], a: 0, explain: "'됐습니다'는 '되었습니다'의 준말이므로 맞는 표현이에요." },

      { level: "hard", icon: "📰", q: "다음은 한글 맞춤법에 대한 신문 기사입니다. 글을 읽고 나오지 않은 것을 고르세요.\n\n한글 맞춤법은 한국어로 글을 쓸 때 지켜야 할 규칙이다. 맞춤법에 맞게 글을 쓰면 의사소통을 효율적으로 할 수 있다. 예를 들어 '재글일거써요'와 같이 소리 나는 대로 쓰면 이 문장이 무슨 뜻인지 알기 힘들지만 '책을 읽었어요'와 같이 맞춤법과 띄어쓰기를 지켜서 쓴다면 뜻을 쉽게 이해할 수 있을 것이다. 이렇게 한글 맞춤법은 말을 할 때 불필요한 오해와 혼란을 줄이고 언어생활을 효율적으로 하도록 돕는다. 그런데 최근 젊은 사람들이 'ㅇㅇ'이나 '소주'와 같이 맞춤법을 일부러 어긴 표현을 쓰는 경우가 늘고 있다. 이런 표현은 빠르게 생각을 전하거나 강한 느낌을 전달할 수 있지만 지나친 사용은 의사소통 실패로 이어질 수도 있으므로 사용에 유의해야 할 것이다.", opts: ["한글 맞춤법의 뜻", "한글 맞춤법의 역할", "한글 맞춤법의 학습 방법"], a: 2, explain: "글에는 한글 맞춤법의 뜻과 역할은 나오지만, 학습 방법에 대한 내용은 없어요." },
      { level: "medium", icon: "📰", q: "한글 맞춤법은 한국어로 글을 쓸 때 지켜야 할 규칙이다. 맞춤법에 맞게 글을 쓰면 의사소통을 효율적으로 할 수 있다. 예를 들어 '재글일거써요'와 같이 소리 나는 대로 쓰면 이 문장이 무슨 뜻인지 알기 힘들지만 '책을 읽었어요'와 같이 맞춤법과 띄어쓰기를 지켜서 쓴다면 뜻을 쉽게 이해할 수 있을 것이다. 이렇게 한글 맞춤법은 말을 할 때 불필요한 오해와 혼란을 줄이고 언어생활을 효율적으로 하도록 돕는다. 그런데 최근 젊은 사람들이 'ㅇㅇ'이나 '소주'와 같이 맞춤법을 일부러 어긴 표현을 쓰는 경우가 늘고 있다. 이런 표현은 빠르게 생각을 전하거나 강한 느낌을 전달할 수 있지만 지나친 사용은 의사소통 실패로 이어질 수도 있으므로 사용에 유의해야 할 것이다.\n\n위 한글 맞춤법에 대한 글의 내용과 같은 것을 고르세요.", opts: ["사람들은 글을 쓸 때 한글 맞춤법을 지켜야 한다.", "최근 한글로 글을 쓸 때는 소리 나는 대로 적는다.", "맞춤법을 지키면 다른 사람에게 약한 느낌을 준다."], a: 0, explain: "글에서 맞춤법을 지켜야 오해와 혼란을 줄이고 효율적으로 소통할 수 있다고 했어요." },

      { level: "medium", icon: "📊", q: "다음은 수능 시험 현황 통계표입니다. 표의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[수능 시험 현황(단위: 명): 올해 - 응시 총원 646,190 / 재학생 495,027 / 재수생 131,538 / 검정고시 등 14,054. 지난해 - 응시 총원 657,470 / 재학생 509,081 / 재수생 127,634 / 검정고시 등 14,032]\n\n수능 시험에서 재수생은 작년보다 올해 더 많아졌다.", opts: ["O", "X"], a: 0, explain: "재수생 수가 지난해 127,634명에서 올해 131,538명으로 늘었어요." },

      { level: "hard", icon: "🎓", q: "다음은 고입 검정고시 합격에 대한 기사입니다. 글을 읽고 물음에 답하세요.\n\n올해 고등학교 입학 검정고시에서 중도 입국 자녀 4명이 합격해서 눈길을 끌고 있다. 이들은 자국에서 태어나 살다가 아버지 또는 어머니가 한국 사람과 결혼하면서 부모와 함께 한국에 온 지 1년에서 1년 6개월밖에 안 된 학생들이다.\n네 명의 중도 입국 자녀들은 처음 한국에 왔을 때는 한국어를 전혀 하지 못했다. 하지만 다문화 청소년 학교에 다니면서 한국어뿐만 아니라 영어, 예체능 수업을 받을 수 있었다. 또한 한국 학생들로부터 일대일로 학습 도움을 받으면서 짧은 시간 동안 한국어, 한국 문화, 검정고시 준비에 빠른 속도로 적응할 수 있었다.\n내년에 일반 고등학교에 입학할 예정인 학생들은 \"학교 선생님들과 자원봉사자들, 근처 학교의 또래 학생들 덕분입니다.\"라고 하면서 \"이분들이 없었다면 ( ㉠ )\"라고 감사의 인사를 전했다.\n\n윗글의 내용과 같은 것을 고르세요.", opts: ["중도 입국 학생들은 올해 부모님과 함께 한국에 들어왔다.", "중도 입국 학생들은 고등학교에 다니면서 한국어를 배웠다.", "중도 입국 학생들은 한국 학생들 덕분에 한국 문화에 적응하였다."], a: 2, explain: "글에서 '한국 학생들로부터 일대일로 학습 도움을 받으면서' 빠르게 적응할 수 있었다고 했어요." },
      { level: "medium", icon: "🎓", q: "올해 고등학교 입학 검정고시에서 중도 입국 자녀 4명이 합격해서 눈길을 끌고 있다. 이들은 자국에서 태어나 살다가 아버지 또는 어머니가 한국 사람과 결혼하면서 부모와 함께 한국에 온 지 1년에서 1년 6개월밖에 안 된 학생들이다.\n네 명의 중도 입국 자녀들은 처음 한국에 왔을 때는 한국어를 전혀 하지 못했다. 하지만 다문화 청소년 학교에 다니면서 한국어뿐만 아니라 영어, 예체능 수업을 받을 수 있었다. 또한 한국 학생들로부터 일대일로 학습 도움을 받으면서 짧은 시간 동안 한국어, 한국 문화, 검정고시 준비에 빠른 속도로 적응할 수 있었다.\n내년에 일반 고등학교에 입학할 예정인 학생들은 \"학교 선생님들과 자원봉사자들, 근처 학교의 또래 학생들 덕분입니다.\"라고 하면서 \"이분들이 없었다면 ( ㉠ )\"라고 감사의 인사를 전했다.\n\n위 고입 검정고시 합격 기사의 ㉠에 들어갈 알맞은 말을 고르세요.", opts: ["중학교 졸업을 생각도 못 했을 것이다", "검정고시에 응시조차 못했을 것이다", "대학에 입학하지 못했을 것이다"], a: 1, explain: "고입 검정고시를 준비하는 데 주변의 도움이 컸다는 문맥이므로, 도움이 없었다면 '검정고시에 응시조차 못했을 것'이라는 내용이 알맞아요." },

      { level: "medium", icon: "🗳️", q: "다음은 선거 안내 포스터입니다. 포스터의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[다가오는 21대 국회 의원 선거. 후보자 정책 공약 꼼꼼하게 확인하고 소중한 한 표 행사하세요! 사전 투표일 2020. 4. 10.(금)~4. 11.(토) 오전 6:00~오후 6:00. 선거일 2020. 4. 15.(수) 오전 6:00~오후 6:00. 중앙선거관리위원회]\n\n윗글은 국회 의원 선거 공약을 안내하는 포스터이다.", opts: ["O", "X"], a: 1, explain: "이 포스터는 공약 내용이 아니라 투표 날짜와 시간을 안내하는 포스터예요." },
      { level: "medium", icon: "🗳️", q: "[다가오는 21대 국회 의원 선거. 후보자 정책 공약 꼼꼼하게 확인하고 소중한 한 표 행사하세요! 사전 투표일 2020. 4. 10.(금)~4. 11.(토) 오전 6:00~오후 6:00. 선거일 2020. 4. 15.(수) 오전 6:00~오후 6:00. 중앙선거관리위원회]\n\n국회 의원을 뽑는 투표는 4월 15일에만 할 수 있다. 위 포스터의 내용과 같습니까?", opts: ["O", "X"], a: 1, explain: "선거일(4월 15일) 외에도 사전 투표일(4월 10일~11일)이 있어요." },
      { level: "hard", icon: "📋", q: "다음은 선호하는 공약에 대한 설문 조사 결과입니다. 글을 읽고 물음에 답하세요.\n\n국회 의원 선거를 앞두고 만 18세 이상 유권자 1,000명을 대상으로 연령대별 선호하는 공약에 대한 설문 조사를 실시하였다. 그 결과 만 18~29세는 청년 실업 해결 및 내 집 마련을 중요하게 생각하는 것으로 나타났다. 30대는 높은 집값 해결로, 40대와 50대는 국민 생활의 향상이 중요하다고 응답했다. 60대 이상은 고령화 사회 문제에 대한 대책 마련이 가장 필요하다고 보았다.\n이번 조사를 통해 유권자의 관심이 생활 문제 해결에 있음을 알 수 있었다. 국민들은 정치인이 머릿속으로만 생각하는 공약이 아닌, 유권자에게 필요한 공약을 제시해야 한다고 강조했다. 생활 안정이야말로 모든 국민이 원하는 공약인 만큼 국회 의원 후보자들은 공약에 대해 다시 한번 생각해 보아야 할 것이다.\n\n윗글의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n이 조사를 통하여 국회 의원들이 제시한 선거 공약을 알 수 있다.", opts: ["O", "X"], a: 1, explain: "이 조사는 국회 의원이 제시한 공약이 아니라, 유권자들이 '선호하는' 공약에 대한 설문 조사예요." },

      { level: "hard", icon: "🏢", q: "다음 글을 읽고 나오지 않은 것을 고르세요.\n\n여러 기업에서 다양한 방법으로 환경 보호에 힘쓰고 있어 사람들의 눈길을 끌고 있다. 최근 주목받는 기업의 환경 보호 사례를 살펴보면, 한 자동차 기업은 분리수거함에 점수판을 설치해서 쓰레기를 제대로 버릴 때마다 높은 분리수거 점수가 나타나도록 했다. 그러자 분리수거함에 분리수거를 정확하게 하는 사람들이 늘어났고 많은 사람들의 참여를 높이고 있다. 또 일회용 플라스틱 컵 사용이 많은 커피 회사들은 개인 컵을 사용하는 손님들에게 할인 및 쿠폰 제공 혜택을 주어 일회용 컵의 사용을 줄이도록 한다. 이외에도 상품 포장 회사들은 포장에 필요한 상자들을 친환경 종이로 바꾸고 있고, 한 의류 회사에서는 버려지는 옷들을 재활용해 새로운 디자인의 옷으로 만들고 있다. 이처럼 적극적인 회사의 노력들은 지속 가능한 환경을 만드는 데에 기여할 것으로 기대된다.", opts: ["환경 보호 방법", "쓰레기 처리의 어려움", "환경 보호로 받는 혜택"], a: 1, explain: "글에는 기업들의 환경 보호 방법과 그로 인한 혜택은 나오지만, 쓰레기 처리의 어려움에 대한 내용은 없어요." },

      { level: "hard", icon: "💵", q: "다음은 환율에 대한 글입니다. 글을 읽고 나오지 않은 것을 고르세요.\n\n환율은 한 나라의 돈과 다른 나라 돈의 교환 비율이다. 원 달러 환율의 경우 달러를 찾는 사람이 많아지면 환율이 상승하고 한국 돈의 가치가 높아지면 환율이 하락한다. 이러한 환율 변화는 사람들의 생활에 큰 영향을 준다. 환율이 오르면 수입을 하는 물건의 가격이 오르기 때문이다. 환율이 1,000원일 때 1달러짜리 물건을 사려면 1,000원이 필요하다. 하지만 환율이 2,000원으로 오르면 1달러짜리 물건을 살 때 2,000원이 필요하다. 그렇다고 환율이 낮을수록 좋은 것은 아니다. 환율이 내려가면 수출을 어렵게 한다. 환율이 1,000원일 때 1달러짜리 물건 한 개를 판매한 회사가 환율이 2,000원이 될 때에는 1달러짜리 물건 2개를 팔아야 하는 것이다. 이러한 이유로 각국 정부에서는 환율을 적정하게 유지하여 국가 경제를 건전하게 관리하고자 노력하고 있다.", opts: ["환율의 영향", "환율과 경제의 관계", "향후 원 달러 환율 전망"], a: 2, explain: "글에는 환율의 영향과 경제와의 관계는 나오지만, 앞으로의 환율 전망에 대한 내용은 없어요." },

      { level: "medium", icon: "🐕", q: "다음은 개 물림 사고 예방 포스터입니다. 포스터의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[개에게 물리는 사고를 예방하려면 어떻게 해야 할까요? 어린이의 경우, 반려견과 단둘이 있게 하지 마세요! 외출 시에는 반려견에게 목줄을 매어 주세요! 주인의 허락 없이 반려견을 만지거나 다가가지 마세요!]\n\n위 포스터는 개에게 물리는 사고를 예방하기 위한 것이다.", opts: ["O", "X"], a: 0, explain: "포스터 제목이 '개에게 물리는 사고를 예방하려면'이므로 사고 예방이 목적이 맞아요." },

      { level: "hard", icon: "🐾", q: "다음은 반려견 관련 법에 대한 글입니다. 글을 읽고 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n반려견을 키우는 인구가 매년 늘고 있다. 최근 1인 가구가 증가하면서 그들이 키우는 반려견의 수도 함께 늘고 있기 때문이다. 그러나 반려견 안전 관리에 대한 생각은 예전과 달라진 게 없다. 그러다 보니 개에게 물리는 사고가 계속 일어나고 있다. 이런 사고가 반복되는 이유는 반려견 관련 법이 여전히 약하기 때문이다. 동물 보호법이 새롭게 바뀌어 반려견과 외출 시 반려견의 목줄 착용을 의무화했지만 여전히 이를 지키지 않는 경우가 많다. 목줄을 매지 않은 개에게 물리는 사고가 계속 일어나는 편이다. 최근 통계에 의하면 개에게 물려 병원을 찾는 사람이 해마다 증가해 연평균 2천여 명이 된다고 한다. 게다가 이런 법규를 단속하는 전담 인력이 부족하여 현장에서의 단속도 쉽지 않다. 그래서 반려견 안전 관리를 더욱 철저히 강화해야 한다는 목소리가 높다. 정부의 정책 마련이 시급해 보인다.\n\n반려견 관련 법이 약하기 때문에 개에게 물리는 사고가 계속 일어난다.", opts: ["O", "X"], a: 0, explain: "글에서 '이런 사고가 반복되는 이유는 반려견 관련 법이 여전히 약하기 때문'이라고 했어요." },

      { level: "medium", icon: "👪", q: "다음은 설문 조사 결과입니다. 자료의 내용과 같으면 O, 다르면 X 중 알맞은 것을 고르세요.\n\n[결혼 이민자가 선호하는 다문화 정책: 다문화 정책에 대한 설문 조사에서 전국의 결혼 이민자 600명은 진학 지도, 교육비 지원 등의 자녀 지원을 가장 중요하게 생각하는 것으로 나타났다. (자녀 지원 38%, 교육 지원 30%, 취업 지원 27%, 기타 5%)]\n\n이 설문 조사는 전국의 결혼 이민자들을 대상으로 한다.", opts: ["O", "X"], a: 0, explain: "자료에서 '전국의 결혼 이민자 600명'을 대상으로 조사했다고 했어요." },
      { level: "medium", icon: "👪", q: "[결혼 이민자가 선호하는 다문화 정책: 다문화 정책에 대한 설문 조사에서 전국의 결혼 이민자 600명은 진학 지도, 교육비 지원 등의 자녀 지원을 가장 중요하게 생각하는 것으로 나타났다. (자녀 지원 38%, 교육 지원 30%, 취업 지원 27%, 기타 5%)]\n\n결혼 이민자들이 가장 원하는 정책은 자신에 대한 교육 지원이다. 위 자료의 내용과 같습니까?", opts: ["O", "X"], a: 1, explain: "가장 높은 비율(38%)을 차지한 것은 '자녀 지원'이며, 자신에 대한 '교육 지원'은 30%로 두 번째예요." },
      { level: "hard", icon: "🤝", q: "다음은 사회통합 이민자 멘토단에 대한 기사입니다. 글을 읽고 ㉠에 들어갈 알맞은 말을 고르세요.\n\n외국인의 한국 정착과 한국인과의 소통을 돕기 위한 '사회통합 이민자 멘토단'이 새롭게 탄생했다. 아시아와 미주, 유럽 등 22개국 출신의 이민자로 구성된 멘토단은 법무부의 공개 모집 절차를 거쳐 선발되었다. 이들은 국내에 거주하고 있는 외국인을 대상으로 한국 사회 적응 경험과 노하우를 알리고, 한국인을 대상으로 멘토 출신국의 사회·문화 및 이민자 정책을 소개하는 등 문화 전도사로서의 역할도 수행하게 된다. ( ㉠ ) 다양한 사회 활동과 멘토 교육 등을 통해 얻은 현장의 목소리를 이민자 정책에 반영할 수 있도록 정책 결정 도우미 활동도 하게 된다. 이러한 멘토단의 활동은 한국 사회의 외국인들에게 큰 희망이 될 수 있을 것이며, 각국 대사관 관계자들도 사회통합 이민자 멘토단의 활동으로 우리 사회에 아름다운 소통 문화가 정착하기를 기대해 본다.", opts: ["또한", "그래서", "하지만"], a: 0, explain: "앞 내용에 새로운 활동 내용을 추가로 설명하는 것이므로 '또한'이 알맞아요." },

      { level: "medium", icon: "👪", q: "다음 ( )에 들어갈 알맞은 말은?\n\n가: 어제 뉴스를 봤는데 요즘 한국에서는 ( )이 점점 많아지고 있대요.\n나: 맞아요. 우리 옆집에 미라 씨도 이혼을 하고 혼자 아이를 키우고 있어요.\n가: 혼자 아이를 키우는 일이 쉽지 않을 텐데, 미라 씨가 힘들 것 같아요.\n나: 꼭 그렇지도 않아요. 미라 씨는 아이와 함께 행복하게 잘 살고 있거든요.", opts: ["대가족", "핵가족", "다문화 가족", "한부모 가족"], a: 3, explain: "이혼 후 혼자 아이를 키우는 가족은 '한부모 가족'이에요." },
      { level: "hard", icon: "👑", q: "다음 글의 ㉠, ㉡에 각각 들어갈 내용으로 적절한 것은?\n\n( ㉠ )은/는 세종대왕의 능으로 조선의 왕릉 중 최초로 왕과 왕비가 함께 묻혀 있는 곳이다. 조선 시대에 왕은 절대적인 존재였기 때문에 왕릉을 만들 때 왕릉의 위치, 모양, 방향 등이 매우 중요했다. 이러한 이유로 조선 왕릉이 2009년 유네스코 세계문화유산으로 ( ㉡ ).", opts: ["영릉 - 알려졌다", "종묘 - 알려졌다", "영릉 - 지정되었다", "종묘 - 지정되었다"], a: 2, explain: "세종대왕의 능은 '영릉'이며, 조선 왕릉은 2009년 유네스코 세계문화유산으로 '지정되었다'예요." },
      { level: "hard", icon: "🧘", q: "다음을 읽고 질문에 답하시오.\n\n우리는 살면서 기분이 우울해질 때가 있는데, 이런 우울한 기분이 2주 이상 지속되면 병원이나 지역 정신 보건 기관에 방문해서 상담을 받아야 한다. 왜냐하면 우울증은 빨리 발견해서 치료하는 것이 중요하기 때문이다. 세계보건기구(WHO)에서는 우울하다고 느낄 때 스스로 극복할 수 있는 방법을 다음과 같이 제시하고 있다. 첫째, 술과 담배를 피해야 한다. 둘째, 산책이나 걷기 등의 간단한 운동을 규칙적으로 해야 한다. 셋째, 친한 친구에게 자신의 감정이나 생각을 솔직하게 말해야 한다. 마지막으로 가족이나 친구와 계속 연락하는 것이 중요하다.\n\n우울증을 스스로 극복할 수 있는 방법으로 알맞은 것은?", opts: ["2주 동안 병원에 간다.", "규칙적으로 운동을 한다.", "세계보건기구에 연락한다.", "친구보다는 가족을 만난다."], a: 1, explain: "세계보건기구는 산책이나 걷기 등의 간단한 운동을 규칙적으로 할 것을 제시하고 있어요." },
      { level: "medium", icon: "🏥", q: "우리는 살면서 기분이 우울해질 때가 있는데, 이런 우울한 기분이 2주 이상 지속되면 병원이나 지역 정신 보건 기관에 방문해서 상담을 받아야 한다. 왜냐하면 우울증은 빨리 발견해서 치료하는 것이 중요하기 때문이다. 세계보건기구(WHO)에서는 우울하다고 느낄 때 스스로 극복할 수 있는 방법을 다음과 같이 제시하고 있다. 첫째, 술과 담배를 피해야 한다. 둘째, 산책이나 걷기 등의 간단한 운동을 규칙적으로 해야 한다. 셋째, 친한 친구에게 자신의 감정이나 생각을 솔직하게 말해야 한다. 마지막으로 가족이나 친구와 계속 연락하는 것이 중요하다.\n\n우울증이 2주 이상 지속되면 상담을 받아야 하는 이유는?", opts: ["우리는 살면서 우울해질 때가 있기 때문에", "세계보건기구에서 우울증에 관심이 있기 때문에", "친구에게 자신의 감정이나 생각을 말해야 하기 때문에", "우울증은 빨리 발견해서 치료하는 것이 중요하기 때문에"], a: 3, explain: "글에서 우울증은 빨리 발견해서 치료하는 것이 중요하다고 했어요." },

      { level: "medium", icon: "🚽", q: "다음 ( )에 들어갈 알맞은 말은?\n\n저희 집은 화장실의 변기를 많이 사용하지 않는데 너무 자주 ( ). 사용할 때마다 조심하지만 물이 잘 내려가지 않습니다. 보통 일주일에 세 번 정도 그러는 것 같습니다. 그럴 때마다 펌프질을 하고 변기를 뚫는 세제를 사용해 보지만 그때뿐입니다. 어떻게 하면 좋을까요?", opts: ["샙니다", "막힙니다", "잠깁니다", "깨집니다"], a: 1, explain: "물이 잘 내려가지 않고 펌프질로 뚫어야 하는 상황이므로 변기가 '막히다'가 알맞아요." },

      { level: "hard", icon: "🗳️", q: "다음을 읽고 질문에 답하시오.\n\n지방 선거가 한 달 앞으로 다가온 가운데 인주사회연구소에서 인주 시민 1,000명을 대상으로 차기 시장에 대한 여론을 살펴보기 위해 설문 조사를 진행하였다. 조사 결과에 따르면 차기 시장이 갖춰야 할 자질에 대하여 38.3%가 행정 경험과 전문성이 가장 중요하다고 응답한 것으로 나타났다. 다음으로는 소통 능력(26.2%), 도덕성(14.4%), 판단력과 추진력(11.7%) 순이었으며, 참신성(6.1%)과 정치 감각(3.3%)이라는 응답도 뒤를 이었다. 인주사회연구소 이상희 소장은 이번 조사 결과 시민들이 행정 경험이 풍부한 소통형 시장을 원하는 것으로 나타났다고 말했다.\n\n위 글에서 실시한 설문 조사의 결과로 알맞은 것은?", opts: ["인주 시민들은 차기 시장에 대해 관심이 있다.", "인주 시민들은 행정 경험이 풍부한 시장을 원한다.", "이상희 소장이 설문 조사 결과를 시민들에게 알려 주었다.", "인주사회연구소에서 인주 시민 1,000명을 만나고 싶어 한다."], a: 1, explain: "이상희 소장은 조사 결과 시민들이 행정 경험이 풍부한 소통형 시장을 원한다고 말했어요." },

      { level: "medium", icon: "🇰🇷", q: "다음 ( )에 들어갈 알맞은 말은?\n\n가: 엘레나 씨는 한국에 어떻게 오게 됐어요?\n나: 저는 통역사가 되기 위해서 한국에 유학을 왔어요. 그리고 한국어를 공부하다가 남편을 만나서 결혼했어요. 지금 행복하지만 통역사가 되지 못해서 조금 아쉽기도 해요.\n가: 아직 늦지 않았어요. ( ) 말고 지금부터 다시 시작해 보세요.", opts: ["노력하지", "성공하지", "실패하지", "포기하지"], a: 3, explain: "다시 시작해 보라고 격려하는 상황이므로 '포기하지 말고'가 알맞아요." },
      { level: "hard", icon: "🆕", q: "다음 글의 ㉠, ㉡에 각각 들어갈 내용으로 적절한 것은?\n\n사회가 급변하면서 우리가 사용하는 언어는 새롭게 만들어지기도 하고 없어지기도 한다. 특히 과거에 없었던 것들을 표현하기 위해 ( ㉠ )가 자연스럽게 등장하는데, 많은 직장인은 이것 때문에 세대 차이를 느끼거나 의사소통에 어려움을 느낀 적이 있다고 한다. 전문가들은 이것의 출현은 자연스러운 것이지만 무분별하게 사용하면 의사소통에 문제가 생길 수 있다고 ( ㉡ ).", opts: ["사투리 - 지적한다", "신조어 - 지적한다", "사투리 - 반영한다", "신조어 - 반영한다"], a: 1, explain: "새로 생긴 말은 '신조어'이며, 전문가들은 무분별한 사용에 대해 문제가 생길 수 있다고 '지적한다'예요." },
      { level: "hard", icon: "🌐", q: "다음을 읽고 질문에 답하시오.\n\n인터넷이 보편화되면서 우리 생활에 많은 변화가 일어났습니다. 인터넷을 이용해 정보도 쉽게 검색할 수 있고 집 안에서 쇼핑을 하거나 은행일도 볼 수 있으며, 외국에 있는 친구들과 채팅으로 소식을 주고받을 수도 있습니다. 인터넷은 이처럼 우리의 삶을 편리하게 만들었습니다.\n반면에 무분별한 인터넷 사용으로 유해한 정보나 폭력적인 게임에 노출되기도 하며, 개인 정보가 유출되기도 합니다. 사생활 침해가 발생하여 누군가에게 큰 상처가 되기도 하고 범죄에 이용되기도 합니다. 잘 사용하면 편리한 인터넷, 우리에게 독이 되지 않도록 바르게 사용하는 지혜가 필요합니다.\n\n인터넷의 보편화로 인한 장점이 아닌 것은?", opts: ["유해한 정보를 쉽게 검색할 수 있다.", "집에서 인터넷을 통해 송금을 할 수 있다.", "멀리 고향에 있는 친구에게 소식을 전할 수 있다.", "가게에 가지 않아도 물건을 주문해서 배달받을 수 있다."], a: 0, explain: "유해한 정보에 노출되는 것은 인터넷의 장점이 아니라 단점으로 언급되었어요." },

      { level: "hard", icon: "🎓", q: "다음 ( )에 들어갈 알맞은 말은?\n\n가: 어제 뉴스를 봤는데 고등학교 3학년 학생들이 학업 스트레스로 머리가 빠지기도 하고 밥도 못 먹는 경우가 있대요.\n나: 스트레스를 받으면 병이 나는 게 당연하죠. 한국에서는 대학 입시 경쟁이 ( ) 어쩔 수 없어요.\n가: 요즘 학생들은 학교와 학원 공부 때문에 10대를 힘들게 보내는 것 같아 안타까워요.", opts: ["치열하니까", "중시하니까", "다양하니까", "차지하니까"], a: 0, explain: "경쟁이 심함을 나타낼 때 '치열하다'를 써요." },
      { level: "hard", icon: "🇻🇳", q: "다음 글의 ㉠, ㉡에 각각 들어갈 내용으로 적절한 것은?\n\n나는 베트남 사람인데 한국에 온 지 1년이 되었다. 그동안 내가 근무한 회사에는 베트남 사람이 많았는데 얼마 전에 다른 회사로 ( ㉠ )을 했다. 새 직장에는 한국 사람이 많고 거의 다 나보다 연세가 많으신 분들이다. 그분들과 매일 함께 일하고 식사도 하면서 시간을 많이 보내게 되었다. 그런데 대화를 나누면 \"윗사람에게 그렇게 말하면 안 돼.\"라고 말씀하실 때가 많다. 그럴 때면 선배들의 기분이 나빠진 것 같아서 마음이 불편해진다. 이런 일이 자주 생기다 보니 요즘은 선배들과 있는 자리를 ( ㉡ ).", opts: ["출장 - 즐기게 된다", "이직 - 즐기게 된다", "출장 - 피하게 된다", "이직 - 피하게 된다"], a: 3, explain: "다른 회사로 옮긴 것이므로 '이직'이고, 불편한 마음 때문에 선배들과의 자리를 '피하게 된다'가 알맞아요." },
      { level: "hard", icon: "🏠", q: "다음을 읽고 질문에 답하시오.\n\n인구 조사에 따르면 1인 가구가 전체 가구 수의 약 30%를 차지하고 있다고 한다. 1인 가구의 증가 원인으로는 이혼율의 증가, 고령화, 결혼에 대한 가치관의 변화 등을 꼽을 수 있다. 이러한 1인 가구의 증가로 이들을 대상으로 한 상품과 서비스도 많이 출시되고 있다. 예를 들면 소형 주택이 점점 인기를 얻고 있으며 1인 가구를 위한 생활 물품 대여, 세탁, 청소, 장보기 등의 서비스도 증가하고 있다. 앞으로도 1인 가구가 증가할 것으로 전망하고 있는데 이렇게 1인 가구가 증가하면 우리 사회에 크고 작은 변화들이 생길 수밖에 없다. 그렇기 때문에 정부는 이러한 변화에 맞춰 기존의 전통적인 가구를 대상으로 한 정책을 개선하고 1인 가구를 위한 주거 정책이나 독거노인을 위한 돌봄 서비스 등 현실적이고 실용적인 정책을 마련하는 것이 시급하다.\n\n1인 가구가 늘어나는 원인으로 옳은 것은?", opts: ["고령화", "이혼율의 감소", "주거 정책의 개선", "생활 물품 대여 증가"], a: 0, explain: "1인 가구 증가 원인으로 이혼율의 증가, 고령화, 결혼 가치관의 변화 등이 언급되었어요." },

      { level: "hard", icon: "💼", q: "다음을 읽고 질문에 답하시오.\n\n잡코리아가 직장인 1,000명을 대상으로 직장 생활을 하면서 가장 힘든 일이 무엇인지에 대한 설문 조사를 실시했다. 그 결과 대인 관계가 힘들어서 스트레스를 받는다는 응답이 40%로 가장 높게 나타났는데 직장 상사를 어떻게 대해야 할지 모르겠다는 응답과 직장 선배와의 관계가 어렵다는 응답이 특히 많았다. 뒤이어 야근을 하거나 주말에 일을 하는 것이 힘들다는 응답도 30%를 차지했다. 대부분 야근 수당이나 주말 수당을 받기는 하지만 제대로 쉬지 못해 피로가 쌓여서 힘들다는 응답과 가족이나 친구들과 시간을 보낼 수 없어서 힘들다는 응답이 대다수를 차지했다.\n\n위 글의 제목으로 알맞은 것은?", opts: ["좋은 대인 관계", "스트레스 푸는 방법", "직장 생활의 어려움", "직장 상사와 선배와의 관계"], a: 2, explain: "글 전체가 직장 생활의 다양한 어려움을 다루고 있으므로 '직장 생활의 어려움'이 제목으로 알맞아요." },
