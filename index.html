      { level: "medium", icon: "🍚", q: "다음 글의 ㉠, ㉡, ㉢에 들어갈 말로 알맞은 것은?\n\n한국에서는 특별한 날에 먹는 음식들이 있습니다. 설날에는 ( ㉠ ), 추석에는 ( ㉡ ), 동지에는 ( ㉢ )을 먹습니다. 그리고 정월대보름에는 오곡밥과 부럼을 먹습니다. 아기가 태어난 지 100일이 되면 백설기를 먹고, 생일에는 미역국을 먹습니다.", opts: ["송편 - 떡국 - 팥죽", "떡국 - 송편 - 팥죽", "송편 - 팥죽 - 떡국", "떡국 - 팥죽 - 송편"], a: 1, explain: "설날에는 떡국, 추석에는 송편, 동지에는 팥죽을 먹어요." },
      { level: "medium", icon: "🤧", q: "다음 ( )에 들어갈 말로 알맞은 것은?\n\n한국에서는 몸이 아플 때 병원에 가지 않고 병을 고치는 민간요법이 있다. 아이가 소화가 되지 않아서 배가 아플 때는 어머니가 아이의 배를 만져 주었다. 기침을 심하게 할 때는 ( ), 술을 많이 마셨을 때는 콩나물국을 먹었다. 모든 민간요법에 과학적인 근거가 있는 것은 아니지만 오늘날까지도 많은 사람들이 민간요법을 믿고 있다.", opts: ["병원에 갔고", "약을 사서 먹었고", "배를 끓여서 마셨고", "시원한 물을 많이 마셨고"], a: 2, explain: "한국에서는 예로부터 기침을 심하게 할 때 배를 끓여서 마시는 민간요법이 널리 사용되어 왔어요." },
      { level: "medium", icon: "🌱", q: "다음 중 '입춘'에 대한 알맞은 설명을 모두 고른 것은?\n\nㄱ. 봄의 시작을 알리는 날이다.\nㄴ. 1년 중 밤의 길이가 가장 길다.\nㄷ. 대문에 '입춘대길'이라는 글을 써서 붙였다.\nㄹ. 이날이 지나면 낮의 길이가 점점 더 길어진다.", opts: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ"], a: 1, explain: "입춘은 봄의 시작을 알리는 날로, 대문에 '입춘대길'이라는 글을 써서 붙이고 복을 빌었어요. 1년 중 밤이 가장 긴 날은 동지예요." },

      { level: "medium", icon: "🚨", q: "다음 중 경범죄가 아닌 것은?", opts: ["길거리에 쓰레기를 버렸다.", "헬멧을 쓰고 오토바이를 탔다.", "술을 마시고 취해서 소란을 피웠다.", "다른 사람의 차에 광고물을 붙였다."], a: 1, explain: "헬멧을 쓰고 오토바이를 타는 것은 안전 수칙을 지키는 행동으로 경범죄가 아니에요." },
      { level: "medium", icon: "📱", q: "다음 ( )에 들어갈 말로 알맞은 것은?\n\n가: 휴대 전화가 고장 났는데 무료로 고칠 수 있나요?\n나: 보증 기간 내에는 정상적인 상태에서 발생한 고장에 대해 ( )이/가 가능하지만 고객님의 실수로 발생한 고장에 대해서는 수리 비용을 지불하셔야 합니다.", opts: ["수수료", "무상 수리", "출장 서비스", "서비스 센터 방문"], a: 1, explain: "보증 기간 내에 정상적인 사용 중 발생한 고장은 돈을 받지 않고 고쳐 주는 '무상 수리'가 가능해요." },
      { level: "medium", icon: "☎️", q: "소비자 상담 센터에 대한 설명으로 틀린 것은?", opts: ["상담을 받으려면 1345로 전화를 하면 된다.", "소비자의 고충을 듣고 피해 구제를 도와준다.", "인터넷 홈페이지를 이용해 상담을 할 수도 있다.", "소비자의 편에서 상담을 해 주고 해결 방법을 찾아 준다."], a: 0, explain: "소비자 상담 센터의 전화번호는 '1372'이며, '1345'는 외국인종합안내센터 번호예요." },
      { level: "medium", icon: "🍚", q: "다음 중 한국의 식사 예절에 대한 설명으로 옳은 것은?", opts: ["숟가락이 아닌 젓가락으로 음식을 먹는다.", "식사할 때 한 손으로 그릇을 들고 먹는다.", "어른과 술을 마실 때 고개를 돌리고 마신다.", "아이가 어른보다 먼저 수저를 들고 식사를 시작한다."], a: 2, explain: "한국에서는 어른과 술을 마실 때 고개를 돌리고 마시는 것이 예절이에요." },
      { level: "medium", icon: "🏠", q: "다음 ( ) 안에 공통으로 들어갈 말은?\n\n( )은/는 2인 이상의 사람들과 집을 함께 사용하는 임대 주택으로 최근에 젊은 세대에서 급속히 퍼져 나가고 있다. ( )에서는 거실이나 주방은 같이 사용하지만 각자 독립된 공간도 가질 수 있다. 한 사람이 부담해야 하는 월세가 주변 집세보다 저렴하면서 계약 기간도 최소 1개월이기 때문에 사회 초년생들에게 인기를 끌고 있다.", opts: ["원룸", "아파트", "오피스텔", "공유 주택"], a: 3, explain: "여러 사람이 거실·주방을 함께 쓰면서 독립된 공간도 가지는 임대 주택은 '공유 주택'이에요." },

      { level: "medium", icon: "🏠", q: "한국 사람이 생각하는 명당으로 옳지 않은 것은?", opts: ["교통이 편리한 집", "대문이 북쪽으로 난 집", "근처에 좋은 학교가 있는 집", "뒤에 산이 있고 앞에 강이 있는 집"], a: 1, explain: "전통적으로 집의 방향과 대문은 남쪽으로 만드는 것을 선호했으므로, 대문이 북쪽으로 난 집은 명당이 아니에요." },
      { level: "medium", icon: "🏢", q: "한국 회사의 직위 체계 중 부장보다 높지 않은 직위는?", opts: ["이사", "상무", "전무", "차장"], a: 3, explain: "한국 회사의 직위는 보통 '사원-대리-과장-차장-부장-이사-상무-전무-부사장-사장' 순이므로 '차장'은 부장보다 낮아요." },
      { level: "medium", icon: "🌏", q: "다음 ( )에 들어갈 알맞은 것은?\n\n가: 5월 20일에 한국에 사는 외국인들을 위한 축제가 열린다고 해요.\n나: 아, 그날이 ( )이죠? 기념식, 축하 공연, 전시회, 비빔밥 만들기 같은 체험 프로그램이 있다는데 같이 갈래요?", opts: ["어린이날", "어버이날", "성년의 날", "세계인의 날"], a: 3, explain: "외국인과 함께하는 5월 20일 축제는 '세계인의 날'이에요." },
      { level: "medium", icon: "🎓", q: "한국의 교육 제도에 대한 설명으로 옳은 것은?", opts: ["한국의 교육 제도는 9-3-3-4 제도를 도입하고 있다.", "초등학교는 의무교육이지만 중학교는 의무교육이 아니다.", "직업과 관련된 전문 기술을 배울 수 있는 곳은 전문대학이다.", "지나친 교육열 때문에 부작용이 있어서 대학에 많이 진학하지 않는다."], a: 2, explain: "직업과 관련된 전문 기술을 배울 수 있는 곳은 '전문대학'이에요. 한국의 학제는 6-3-3-4이며, 초등학교와 중학교 모두 의무교육이에요." },
      { level: "medium", icon: "☎️", q: "이민자 대상 상담 센터에서 상담하는 분야가 아닌 것은?", opts: ["취미에 관련된 문제", "취업에 관련된 문제", "가족에 관련된 문제", "생활과 관련된 문제"], a: 0, explain: "이민자 상담 센터에서는 취업, 가족, 생활 등에 대한 상담을 하며, 취미는 상담 분야가 아니에요." },

      { level: "medium", icon: "🇰🇷", q: "다음 ( )에 알맞은 말은?\n\n원래 '( )'은/는 말하는 사람과 듣는 사람을 함께 부르는 말이다. 하지만 한국 사람들은 '나'를 말할 때도 이 말을 사용한다. '나'보다 '내가 속한 공동체'를 중요하게 생각하기 때문이다.", opts: ["가족", "동료", "우리", "친구"], a: 2, explain: "말하는 사람과 듣는 사람을 함께 가리키면서도 '나'를 대신해 쓰는 말은 '우리'예요." },

      { level: "medium", icon: "🎉", q: "다음 ( )에 공통으로 들어갈 알맞은 말은?\n\n한국에서 ( )은 매년 5월 셋째 주 월요일로 만 19세가 되는 젊은이들이 어른이 되었음을 축하하는 날이다. 요즘에는 ( )이 되면 친구들끼리 선물을 주고받으며 축하하는 경우가 많다.", opts: ["어린이날", "어버이날", "성년의 날", "문화가 있는 날"], a: 2, explain: "만 19세가 되는 것을 축하하는 날은 '성년의 날'이에요." },

      { level: "medium", icon: "🗳️", q: "다음 ( )에 공통으로 들어갈 알맞은 말은?\n\n( )은/는 민주주의를 유지하며 발전시키는 가장 중요한 요소이다. 민주주의에서 중앙 정부와 지방 정부의 모든 권력은 국민으로부터 나온다. ( )은/는 국민들이 자신의 의사를 대신할 사람을 뽑는 행위이다. 한국에서는 대통령, 국회 의원, 지방 자치 단체장과 지방 의회 의원을 뽑는다.", opts: ["공약", "선거", "투표소", "후보자"], a: 1, explain: "국민이 자신의 의사를 대신할 사람을 뽑는 행위는 '선거'예요." },

function sampleN(arr, n) {
  return shuffle([...arr]).slice(0, Math.min(n, arr.length));
}

/* 문제 풀 전체를 하나의 배열로 펼침 (유형·배점 정보 포함) — 랜덤 1문제씩 출제용
   실제 KIIP 필기시험 배점: 어휘·문법 3.5점, 쓰기·읽기·문화 4점 */
function flattenPool(levelKey) {
  const pool = QUIZ_POOL[levelKey];
  if (!pool) return [];
  const withMeta = (arr, type, points) => arr.map((x, idx) => ({ ...x, type, points, qkey: `${type}_${idx}` }));
  return [
    ...withMeta(pool.vocab, "vocab", 3.5),
    ...withMeta(pool.grammar, "grammar", 3.5),
    ...withMeta(pool.writing, "writing", 4),
    ...withMeta(pool.reading, "reading", 4),
    ...withMeta(pool.culture, "culture", 4)
  ];
}

/* 4단계(중급2) 중간평가는 실제로 중급2 70% : 중급1 30% 비율로 출제된다.
   그래서 중급2 퀴즈를 풀 때는 두 단계의 문제 풀을 함께 사용하되,
   매 문제마다 70% 확률로 중급2 풀에서, 30% 확률로 중급1 풀에서 뽑는다.
   (다른 단계는 지금처럼 자기 단계 풀에서만 100% 출제) */
const LEVEL_MIX = {
  intermediate2: [
    { level: "intermediate2", weight: 0.7 },
    { level: "intermediate1", weight: 0.3 }
  ]
};

/* 오답노트에서 저장된 qkey 하나만 가지고 원래 문제(item)를 다시 찾아온다.
   pickRandomQuestion과 동일한 접두사 규칙(중급2 혼합 시 "intermediate1__"/"intermediate2__")을 따라야
   같은 qkey로 정확히 같은 문제를 되찾을 수 있다. 풀에서 문제가 삭제/변경된 경우 null을 반환한다. */
function findQuizItemByQkey(levelKey, qkey) {
  const mixSources = LEVEL_MIX[levelKey] || [{ level: levelKey, weight: 1 }];
  for (const src of mixSources) {
    const prefix = mixSources.length > 1 ? `${src.level}__` : "";
    if (!qkey.startsWith(prefix)) continue;
    const plainKey = qkey.slice(prefix.length);
    const found = flattenPool(src.level).find(it => it.qkey === plainKey);
    if (found) {
      return { ...found, qkey, sourceLevel: src.level, points: levelKey === "intermediate2" ? 2.5 : found.points };
    }
  }
  return null;
}

/* seen: 이미 보여준 문제의 qkey 목록. 안 본 문제 중에서만 뽑고,
   전부 다 봤으면(한 바퀴 완료) 목록을 비우고 새로 시작(cycleReset=true)한다.
   avoidKey: 사이클이 막 끝난 시점에 바로 직전 문제가 다시 뽑히는 것만 한 번 더 방지
   중급2처럼 여러 단계를 섞는 경우, qkey 앞에 출처 단계를 붙여(예: intermediate1__vocab_3)
   같은 이름의 문제가 서로 다른 단계 풀에 있어도 seen 기록이 겹치지 않게 한다. */
function pickRandomQuestion(levelKey, seen, avoidKey) {
  seen = seen || [];
  const mixSources = LEVEL_MIX[levelKey] || [{ level: levelKey, weight: 1 }];
  const pools = mixSources.map(src => {
    const prefix = mixSources.length > 1 ? `${src.level}__` : "";
    /* 중급2(intermediate2) 시험에서는 중급1 풀에서 섞여 나온 문제라도
       실제 배점(2.5점)을 따르도록 points를 덮어쓴다. */
    const items = flattenPool(src.level).map(item => ({
      ...item,
      qkey: `${prefix}${item.qkey}`,
      sourceLevel: src.level,
      points: levelKey === "intermediate2" ? 2.5 : item.points
    }));
    return { weight: src.weight, items };
  });
  const totalItems = pools.reduce((n, p) => n + p.items.length, 0);
  if (totalItems === 0) return null;

  const unseenIn = pool => pool.items.filter(item => !seen.includes(item.qkey));

  // 1) 가중치(70:30 등)에 따라 이번 문제를 뽑을 풀을 결정
  const r = Math.random();
  let acc = 0, chosenIdx = pools.length - 1;
  for (let i = 0; i < pools.length; i++) {
    acc += pools[i].weight;
    if (r <= acc) { chosenIdx = i; break; }
  }
  let remaining = unseenIn(pools[chosenIdx]);
  let cycleReset = false;

  // 2) 선택된 풀에 안 본 문제가 없으면, 다른 풀에서라도 안 본 문제를 계속 이어서 출제
  if (remaining.length === 0) {
    for (let i = 0; i < pools.length; i++) {
      if (i === chosenIdx) continue;
      const alt = unseenIn(pools[i]);
      if (alt.length > 0) { remaining = alt; chosenIdx = i; break; }
    }
  }
  // 3) 모든 풀을 다 봤으면 사이클 리셋 — 처음에 뽑았던 가중치 풀부터 다시 시작
  if (remaining.length === 0) {
    remaining = pools[chosenIdx].items;
    cycleReset = true;
  }
  if (avoidKey && remaining.length > 1) {
    const filtered = remaining.filter(item => item.qkey !== avoidKey);
    if (filtered.length > 0) remaining = filtered;
  }
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  return { item: shuffleQuestionOptions(pick), cycleReset };
}

/* "이미 본 문제" 기록은 기기가 아니라 서버(DB)에 학생별로 저장해서,
   어떤 기기·브라우저로 접속해도 이어지게 한다 (휴대폰 위주 사용 고려). */
async function loadSeenQuestions(studentId, levelKey) {
  try {
    const rows = await sb(`seen_questions?student_id=eq.${studentId}&level_key=eq.${levelKey}&select=qkey`);
    return (rows || []).map(r => r.qkey);
  } catch (e) { return []; /* 서버 조회 실패해도 퀴즈는 계속 진행 */ }
}
async function recordSeenQuestion(studentId, levelKey, qkey) {
  try {
    await sb("seen_questions", {
      method: "POST",
      headers: { "Prefer": "resolution=ignore-duplicates,return=minimal" },
      body: { student_id: studentId, level_key: levelKey, qkey }
    });
  } catch (e) { /* 저장 실패해도 화면은 그대로 진행 */ }
}
async function resetSeenQuestions(studentId, levelKey) {
  try {
    await sb(`seen_questions?student_id=eq.${studentId}&level_key=eq.${levelKey}`, { method: "DELETE" });
  } catch (e) { /* 실패해도 클라이언트 쪽에서는 이미 새 사이클로 진행 중 */ }
}

/* ============================================================
   오답노트 (wrong_questions 테이블)
   틀린 문제의 qkey를 학생·단계별로 저장해 두고, 오답노트에서 다시 풀어서
   맞히면 그 기록을 삭제한다. ============================================================ */
async function loadWrongQuestions(studentId, levelKey) {
  try {
    const rows = await sb(`wrong_questions?student_id=eq.${studentId}&level_key=eq.${levelKey}&select=qkey`);
    return (rows || []).map(r => r.qkey);
  } catch (e) { return []; }
}
async function recordWrongQuestion(studentId, levelKey, qkey) {
  try {
    await sb(`wrong_questions?on_conflict=student_id,level_key,qkey`, {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: { student_id: studentId, level_key: levelKey, qkey, last_wrong_at: new Date().toISOString() }
    });
  } catch (e) { /* 저장 실패해도 화면은 그대로 진행 */ }
}
async function removeWrongQuestion(studentId, levelKey, qkey) {
  try {
    await sb(`wrong_questions?student_id=eq.${studentId}&level_key=eq.${levelKey}&qkey=eq.${encodeURIComponent(qkey)}`, { method: "DELETE" });
  } catch (e) { /* 실패해도 다음 학습에 다시 시도됨 */ }
}

/* 선택지 순서를 매번 무작위로 섞어서 정답 위치가 항상 랜덤이 되도록 함 */
function shuffleQuestionOptions(item) {
  const idxs = shuffle(item.opts.map((_, i) => i));
  const opts = idxs.map(i => item.opts[i]);
  const a = idxs.indexOf(item.a);
  return { ...item, opts, a };
}

/* ============================================================
   Supabase REST 헬퍼
   ============================================================ */
async function sb(path, opts = {}) {
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    ...(opts.headers || {})
  };
  if ((opts.method === "POST" || opts.method === "PATCH" || opts.method === "DELETE") && !headers["Prefer"]) {
    headers["Prefer"] = "return=representation";
  }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: opts.method || "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error(`Supabase 오류 (${res.status}): ${errText.slice(0, 200)}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function hashPassword(pw) {
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* Persist a lightweight session for THIS TAB ONLY (sessionStorage) —
   페이지/탭을 닫으면 자동으로 사라져서 재접속 시 로그아웃 상태가 되도록 함 */
function saveSession(studentId) { try { sessionStorage.setItem("kiip_student_id", studentId); } catch (e) {} }
function clearSession() { try { sessionStorage.removeItem("kiip_student_id"); } catch (e) {} }
function getSavedSession() { try { return sessionStorage.getItem("kiip_student_id"); } catch (e) { return null; } }

/* ============================================================
   초기화
   ============================================================ */
async function init() {
  try {
    const savedVersion = localStorage.getItem(APP_VERSION_KEY);
    if (savedVersion !== APP_VERSION) {
      // 새 파일이 배포됨 — 이전 세션은 무조건 로그아웃시키고 새로 시작
      clearSession();
      localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
    }
  } catch (e) { /* localStorage 사용 불가 시 무시 */ }

  try {
    state.teachers = await sb("teachers?select=id,name&order=name.asc");
  } catch (e) { /* 조용히 무시 - 목록만 못 채움 */ }

  try {
    const adminRows = await sb("teachers?select=id&is_admin=eq.true&limit=1");
    if (adminRows && adminRows[0]) state.firstTeacherId = adminRows[0].id;
  } catch (e) { /* is_admin 컬럼이 없으면 아무도 관리자 화면을 못 봄 (안전한 기본값) */ }

  try {
    const rows = await sb(`app_settings?key=eq.${SETTINGS_KEY}&select=value`);
    if (rows && rows[0] && rows[0].value) state.teacherSetupCode = rows[0].value;
  } catch (e) { /* app_settings 테이블이 없으면 기본값 사용 */ }

  const savedId = getSavedSession();
  if (savedId) {
    try {
      const rows = await sb(`students?id=eq.${savedId}&select=*`);
      if (rows && rows[0]) {
        state.student = rows[0];
        state.view = rows[0].status === "approved" ? "s_home" : "s_pending";
      }
    } catch (e) { /* 세션 무효 */ }
  }
  render();
}

async function loadMyScore() {
  const s = state.student;
  if (!s) return;
  try {
    const attempts = await sb(`attempts?student_id=eq.${s.id}&game_type=eq.quiz&select=score,total`);
    const count = attempts.length;
    const totalScore = Math.round(attempts.reduce((sum, a) => sum + a.score, 0) * 10) / 10;
    const totalPossible = Math.round(attempts.reduce((sum, a) => sum + a.total, 0) * 10) / 10;
    const pct = totalPossible > 0 ? Math.round((totalScore / totalPossible) * 100) : 0;
    const body = document.getElementById("my-score-body");
    if (!body) return;
    body.innerHTML = `
      <div class="score-big">${totalScore}<span style="font-size:22px;color:var(--text-faint);">점</span></div>
      <div class="score-label">누적 획득 점수 · ${count}문제 풀이 · 정답률 ${pct}%</div>
    `;
  } catch (e) {
    const body = document.getElementById("my-score-body");
    if (body) body.innerHTML = `<div class="msg msg-error">점수를 불러오지 못했어요.</div>`;
  }
}

function viewReading() {
  const r = state.reading;
  const words = r.passage.text.split(/(\s+)/); // keep separators
  let wi = 0;
  const spans = words.map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const idx = wi++;
    const cls = idx < r.playedUpTo ? "played" : (idx === r.playingIdx ? "playing" : "");
    return `<span class="rword ${cls}" data-widx="${idx}">${escapeHtml(tok)}</span>`;
  }).join("");

  return `
  <div class="card">
    <h2>${escapeHtml(r.passage.topic)}</h2>
    <div class="passage-box" id="passage-box">${spans}</div>
    <button class="btn btn-outline" data-act="play-karaoke">🎧 노래방처럼 들어보기</button>

    <div class="divider"><span>이제 따라 읽어보세요</span></div>

    <button class="mic-btn ${r.recording ? "recording" : ""}" data-act="toggle-mic">${r.recording ? "⏹" : "🎤"}</button>
    <p style="text-align:center; font-size:12.5px; color:var(--text-faint);">${r.recording ? "듣고 있어요… 다 읽으면 버튼을 눌러 멈추세요" : "마이크 버튼을 누르고 지문을 읽어보세요"}</p>

    ${r.transcript ? `<div class="msg msg-info">인식된 내용: “${escapeHtml(r.transcript)}”</div>` : ""}
    ${r.micError ? `<div class="msg msg-error">${escapeHtml(r.micError)}</div>` : ""}
    ${r.score !== null && r.score !== undefined ? `
      <div class="score-big">${r.score}<span style="font-size:22px;color:var(--text-faint);">점</span></div>
      <div class="score-label">발음 정확도</div>
    ` : ""}

    <div style="margin-top:20px;"><button class="link-btn" data-act="go-reading-pick">← 다른 지문 고르기</button></div>
  </div>`;
}

async function loadLeaderboard() {
  const s = state.student;
  if (!s) return;
  try {
    const students = await sb(`students?class_name=eq.${encodeURIComponent(s.class_name)}&year=eq.${s.year}&semester=eq.${s.semester}&status=eq.approved&select=id,name`);
    const ids = students.map(st => st.id);
    if (ids.length === 0) { document.getElementById("lb-body").innerHTML = `<div class="empty">아직 데이터가 없어요.</div>`; return; }
    const attempts = await sb(`attempts?student_id=in.(${ids.join(",")})&select=student_id,game_type,score,total`);
    const totals = {};
    ids.forEach(id => totals[id] = { reading: 0, quiz: 0, oral: 0 });
    attempts.forEach(a => {
      if (state.leaderboard.tab !== "combined" && a.game_type !== state.leaderboard.tab) return;
      if (!totals[a.student_id][a.game_type] && totals[a.student_id][a.game_type] !== 0) totals[a.student_id][a.game_type] = 0;
      totals[a.student_id][a.game_type] = (totals[a.student_id][a.game_type] || 0) + a.score;
    });
    const rows = students.map(st => {
      const t = totals[st.id] || { reading: 0, quiz: 0, oral: 0 };
      const combined = t.reading + t.quiz + t.oral;
      const val = state.leaderboard.tab === "reading" ? t.reading : state.leaderboard.tab === "quiz" ? t.quiz : state.leaderboard.tab === "oral" ? t.oral : combined;
      return { name: st.name, val };
    }).sort((a, b) => b.val - a.val);

    const body = document.getElementById("lb-body");
    if (!body) return;
    body.innerHTML = `
    <table>
      <thead><tr><th>순위</th><th>이름</th><th>점수</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => `<tr><td class="${i === 0 ? "rank-1" : i === 1 ? "rank-2" : i === 2 ? "rank-3" : ""}">${i + 1}</td><td>${escapeHtml(r.name)}${r.name === s.name ? " (나)" : ""}</td><td>${r.val}</td></tr>`).join("")}
      </tbody>
    </table>`;
  } catch (e) {
    const body = document.getElementById("lb-body");
    if (body) body.innerHTML = `<div class="msg msg-error">순위표를 불러오지 못했어요: ${escapeHtml(e.message)}</div>`;
  }
}

/* ============================================================
   학생별 퀴즈 요약 (마지막 응시 시각 · 누적 점수)
   ============================================================ */
async function loadQuizSummary(ids) {
  if (!ids || !ids.length) return {};
  const attempts = await sb(`attempts?student_id=in.(${ids.join(",")})&game_type=eq.quiz&select=student_id,score,created_at`);
  const map = {};
  (attempts || []).forEach(a => {
    if (!map[a.student_id]) map[a.student_id] = { score: 0, lastAt: null, count: 0 };
    map[a.student_id].score += a.score;
    map[a.student_id].count += 1;
    if (!map[a.student_id].lastAt || new Date(a.created_at) > new Date(map[a.student_id].lastAt)) {
      map[a.student_id].lastAt = a.created_at;
    }
  });
  Object.keys(map).forEach(id => { map[id].score = Math.round(map[id].score * 10) / 10; });
  return map;
}

function formatLastActive(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "-";
  const now = new Date();
  const diffDays = Math.floor((now - d) / 86400000);
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  if (diffDays <= 0) return `오늘 ${hh}:${mi}`;
  if (diffDays === 1) return `어제 ${hh}:${mi}`;
  if (diffDays < 7) return `${diffDays}일 전`;
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${mm}/${dd}`;
}

          <td>${st.year}-${st.semester}</td>
          <td><span class="badge badge-${st.status}">${st.status === "approved" ? "승인" : st.status === "rejected" ? "거절" : "대기"}</span></td>
          <td>${qs ? formatLastActive(qs.lastAt) : "-"}</td>

            <div class="btn-row">

              ${st.status !== "rejected" ? `<button class="btn btn-sm btn-outline" data-act="sa-reject" data-id="${st.id}">거절</button>` : ""}
              <button class="btn btn-sm btn-outline" data-act="sa-reset-pw" data-id="${st.id}" data-name="${escapeHtml(st.name)}">PW 재설정</button>
              <button class="btn btn-sm btn-outline" data-act="sa-delete-student" data-id="${st.id}" data-name="${escapeHtml(st.name)}">삭제</button>
            </div>
          </td>
        </tr>`;
        }).join("")}
      </tbody>
    </table>
    </div>`;
  } else {
    const rows = state.superAdmin.teachers;
    if (!rows.length) { body.innerHTML = `<div class="empty">등록된 교사가 없어요.</div>`; return; }
    body.innerHTML = `
    <table>
      <thead><tr><th>이름</th><th>학생 수</th><th>구분</th><th>상태</th><th>관리</th></tr></thead>
      <tbody>
        ${rows.map(t => {
          const cnt = state.superAdmin.students.filter(s => s.teacher_id === t.id).length;
          const isMe = t.id === state.teacher.id;
          const status = t.status || "approved";
          const badge = `<span class="badge badge-${status}">${status === "approved" ? "승인" : status === "rejected" ? "거절" : "대기"}</span>`;
          return `
        <tr>
          <td>${escapeHtml(t.name)}</td>
          <td>${cnt}명</td>
          <td>${t.id === state.firstTeacherId ? "관리자" : ""}</td>
          <td>${t.id === state.firstTeacherId ? "" : badge}</td>
          <td>
            <div class="btn-row">
              ${(!isMe && t.id !== state.firstTeacherId && status !== "approved") ? `<button class="btn btn-sm" data-act="sa-approve-teacher" data-id="${t.id}">승인</button>` : ""}
              ${(!isMe && t.id !== state.firstTeacherId && status !== "rejected") ? `<button class="btn btn-sm btn-outline" data-act="sa-reject-teacher" data-id="${t.id}">거절</button>` : ""}
              ${isMe ? `<span style="color:var(--text-dim); font-size:12.5px;">나</span>` : (t.id !== state.firstTeacherId ? `<button class="btn btn-sm btn-outline" data-act="sa-delete-teacher" data-id="${t.id}" data-name="${escapeHtml(t.name)}">삭제</button>` : "")}
            </div>
          </td>
        </tr>`;
        }).join("")}
      </tbody>
    </table>`;
  }
}

function bindEvents() {
  const app = document.getElementById("app");

  const forms = {
    "s-login-form": onStudentLogin,
    "s-register-form": onStudentRegister,
    "t-login-form": onTeacherLogin,
    "t-signup-form": onTeacherSignup,
    "t-reset-form": onTeacherReset,
    "t-setupcode-form": onChangeSetupCode,
    "sa-add-teacher-form": saAddTeacher
  };
  Object.entries(forms).forEach(([id, fn]) => {
    const f = document.getElementById(id);
    if (f) f.addEventListener("submit", e => { e.preventDefault(); fn(); });
  });

  if (!app.dataset.delegationBound) {
    app.dataset.delegationBound = "1";
    app.addEventListener("click", e => {
      const el = e.target.closest("[data-act]");
      if (!el || !app.contains(el)) return;
      e.preventDefault();
      const act = el.dataset.act;
      switch (act) {
        case "go-landing": setState({ view: "landing", error: "" }); break;
        case "go-s-login": setState({ view: "s_login", error: "" }); break;
        case "go-s-register": setState({ view: "s_register", error: "" }); break;
        case "go-s-home": setState({ view: "s_home", error: "" }); break;
        case "go-t-login": setState({ view: "t_login", error: "" }); break;
        case "go-t-signup": setState({ view: "t_signup", error: "" }); break;
        case "go-t-reset": setState({ view: "t_reset", error: "", msgOk: "" }); break;
        case "go-reading-pick": setState({ view: "reading_pick" }); break;
        case "go-oral-pick": setState({ view: "oral_pick" }); break;
        case "go-leaderboard": setState({ view: "leaderboard" }); break;
        case "logout-student": clearSession(); setState({ student: null, view: "landing" }); break;
        case "logout-teacher": state.superAdmin.loaded = false; state.superAdmin.students = []; state.superAdmin.teachers = []; setState({ teacher: null, view: "landing" }); break;
        case "refresh-status": refreshStudentStatus(); break;
        case "pick-student-account": pickStudentAccount(Number(el.dataset.idx)); break;
        case "refresh-teacher-status": refreshTeacherStatus(); break;
        case "start-quiz": startQuiz(); break;
        case "pick-quiz-opt": pickQuizOpt(Number(el.dataset.idx)); break;
        case "check-quiz": checkQuiz(); break;
        case "quiz-next": quizNext(); break;
        case "start-wrong-note": startWrongNote(); break;
        case "pick-wrong-opt": pickWrongOpt(Number(el.dataset.idx)); break;
        case "check-wrong-quiz": checkWrongQuiz(); break;
        case "wrong-quiz-next": wrongQuizNext(); break;
        case "start-reading": startReading(el.dataset.pid); break;
        case "play-karaoke": playKaraoke(); break;
        case "toggle-mic": toggleMic(); break;
        case "start-oral": startOral(Number(el.dataset.level)); break;
        case "play-oral-question": speakOralQuestion(); break;
        case "toggle-oral-mic": toggleOralMic(); break;
        case "oral-next": oralNext(); break;
        case "lb-tab": setState({ leaderboard: { ...state.leaderboard, tab: el.dataset.tab } }); break;
        case "admin-approve": adminSetStatus(el.dataset.id, "approved"); break;
        case "admin-reject": adminSetStatus(el.dataset.id, "rejected"); break;
        case "admin-reset-pw": adminResetPassword(el.dataset.id, el.dataset.name); break;
        case "sa-tab": state.superAdmin.tab = el.dataset.tab; setState({}); renderSuperAdminBody(); break;
        case "sa-refresh": state.superAdmin.loaded = false; loadSuperAdmin(); break;
        case "sa-approve": saSetStatus(el.dataset.id, "approved"); break;
        case "sa-reject": saSetStatus(el.dataset.id, "rejected"); break;
        case "sa-reset-pw": saResetPassword(el.dataset.id, el.dataset.name); break;
        case "sa-delete-student": saDeleteStudent(el.dataset.id, el.dataset.name); break;
        case "sa-delete-teacher": saDeleteTeacher(el.dataset.id, el.dataset.name); break;
        case "sa-approve-teacher": saSetTeacherStatus(el.dataset.id, "approved"); break;
        case "sa-reject-teacher": saSetTeacherStatus(el.dataset.id, "rejected"); break;
      }
    });
  }
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* 문제 지문에서 ‹텍스트› 로 감싼 부분을 실제 밑줄(<u>)로 렌더링.
   (기존 빈칸 표시용 "___" 와 겹치지 않도록 홑화살괄호를 마커로 사용)
   escapeHtml로 먼저 이스케이프한 뒤 ‹..› 패턴만 안전하게 <u> 태그로 치환한다. */
function renderQuizText(str) {
  return escapeHtml(str).replace(/‹(.+?)›/g, "<u>$1</u>");
}

async function onStudentLogin() {
  const name = document.getElementById("li-name").value.trim();
  const pw = document.getElementById("li-pw").value;
  setState({ loading: true, error: "" });
  try {
    const hash = await hashPassword(pw);
    const rows = await sb(`students?name=eq.${encodeURIComponent(name)}&password_hash=eq.${hash}&select=*`);
    if (!rows || !rows[0]) { setState({ loading: false, error: "이름 또는 비밀번호가 올바르지 않아요." }); return; }
    if (rows.length > 1) {
      // 같은 이름 + 같은 비밀번호로 여러 반(예: 중급1, 중급2)에 각각 가입된 경우.
      // 예전에는 항상 첫 번째 계정만 로그인되어 다른 반 계정에는 로그인이 불가능했음 — 선택 화면을 보여줘서 해결.
      setState({ loading: false, error: "", loginCandidates: rows, view: "s_login_pick" });
      return;
    }
    const student = rows[0];
    saveSession(student.id);
    setState({ loading: false, student, view: student.status === "approved" ? "s_home" : "s_pending" });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

function pickStudentAccount(idx) {
  const student = state.loginCandidates[idx];
  if (!student) return;
  saveSession(student.id);
  setState({ student, loginCandidates: [], view: student.status === "approved" ? "s_home" : "s_pending" });
}

async function onStudentRegister() {
  const name = document.getElementById("r-name").value.trim();
  const phone = document.getElementById("r-phone").value.trim();
  const year = Number(document.getElementById("r-year").value);
  const semester = Number(document.getElementById("r-sem").value);
  const class_name = document.getElementById("r-class").value;
  const teacher_id = document.getElementById("r-teacher").value;
  const pw = document.getElementById("r-pw").value;
  if (!/^[가-힣0-9\s]+$/.test(name)) { setState({ error: "이름은 한글(숫자 포함 가능)로 입력해주세요." }); return; }
  if (!/^01[0-9]-?\d{3,4}-?\d{4}$/.test(phone)) { setState({ error: "전화번호를 정확히 입력해주세요. (예: 010-1234-5678)" }); return; }
  if (!teacher_id) { setState({ error: "담당 선생님을 선택해주세요." }); return; }

  // 동명이인 확인: 같은 이름으로 이미 등록된 학생이 있으면 한 번 경고하고,
  // 사용자가 내용을 확인한 뒤 다시 제출하면(dupConfirmedName === name) 그대로 진행한다.
  if (state.dupConfirmedName !== name) {
    setState({ loading: true, error: "" });
    try {
      const existing = await sb(`students?name=eq.${encodeURIComponent(name)}&select=id`);
      if (existing && existing.length) {
        setState({
          loading: false,
          dupConfirmedName: name,
          error: `이미 '${name}'(으)로 등록된 학생이 있어요. 다른 사람이 맞다면 전화번호로 구분되니 걱정하지 않아도 돼요. 계속 진행하려면 '가입 신청하기'를 한 번 더 눌러주세요.`
        });
        return;
      }
    } catch (e) { /* 중복 확인 실패해도 가입 자체는 막지 않음 */ }
  }

  setState({ loading: true, error: "" });
  try {
    const password_hash = await hashPassword(pw);
    const rows = await sb("students", {
      method: "POST",
      body: { name, phone, year, semester, class_name, teacher_id, password_hash, status: "pending", belt_level: 1 }
    });
    const student = rows[0];
    saveSession(student.id);
    setState({ loading: false, dupConfirmedName: null, student, view: "s_pending" });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

async function onChangeSetupCode() {

  const current = document.getElementById("sc-current").value.trim();
  const next = document.getElementById("sc-new").value.trim();
  if (current !== state.teacherSetupCode.trim()) { setState({ settingsError: "현재 설정 코드가 올바르지 않아요.", settingsMsgOk: "" }); return; }
  if (next.length < 4) { setState({ settingsError: "새 설정 코드는 4자 이상이어야 해요.", settingsMsgOk: "" }); return; }
  setState({ loading: true, settingsError: "", settingsMsgOk: "" });
  try {
    // 값이 이미 있으면 갱신, 없으면 새로 생성 (upsert)
    await sb(`app_settings?key=eq.${SETTINGS_KEY}`, {
      method: "PATCH",
      body: { value: next }
    }).then(async rows => {
      if (!rows || !rows.length) {
        await sb("app_settings", { method: "POST", body: { key: SETTINGS_KEY, value: next } });
      }
    });
    state.teacherSetupCode = next;
    setState({ loading: false, settingsMsgOk: "설정 코드가 변경됐어요. 동료 선생님들에게 새 코드를 알려주세요." });
  } catch (e) {
    setState({ loading: false, settingsError: "변경 중 오류: " + e.message });
  }
}

  const s = state.student;
  const levelKey = CLASS_LEVEL_KEY[s.class_name];
  const prevQuiz = state.quiz; // 이전 세션 통계를 이어가기 위해 보존
  const avoidKey = prevQuiz && prevQuiz.item ? prevQuiz.item.qkey : null;
  const sameClass = prevQuiz && prevQuiz.className === s.class_name;
  const seenBefore = sameClass && prevQuiz.seen ? prevQuiz.seen : await loadSeenQuestions(s.id, levelKey);
  const result = pickRandomQuestion(levelKey, seenBefore, avoidKey);
  if (!result) {
    alert(`${classLabel(s.class_name)} 문제가 아직 준비되지 않았어요. 선생님께 문의해주세요.`);
    return;
  }
  const item = result.item;
  if (result.cycleReset) {
    await resetSeenQuestions(s.id, levelKey); // 한 바퀴 다 돌았으니 서버 기록도 비우고 새 사이클 시작
  }
  const seen = result.cycleReset ? [item.qkey] : [...seenBefore, item.qkey];
  recordSeenQuestion(s.id, levelKey, item.qkey); // 응답 기다릴 필요 없이 백그라운드로 기록
  const carryOver = sameClass
    ? { answeredCount: prevQuiz.answeredCount, correctCount: prevQuiz.correctCount, sessionScore: prevQuiz.sessionScore }
    : { answeredCount: 0, correctCount: 0, sessionScore: 0 };
  setState({ view: "quiz", quiz: { className: s.class_name, item, pickedIdx: null, selectedIdx: null, correct: null, seen, ...carryOver } });
}

function pickQuizOpt(idx) {
  setState({ quiz: { ...state.quiz, pickedIdx: idx } });
}

async function checkQuiz() {
  const q = state.quiz;
  const s = state.student;
  const item = q.item;
  if (q.pickedIdx === null || q.pickedIdx === undefined) return;
  const selectedIdx = q.pickedIdx;
  const correct = selectedIdx === item.a;
  const updated = {
    ...q,
    selectedIdx,
    correct,
    answeredCount: q.answeredCount + 1,
    correctCount: q.correctCount + (correct ? 1 : 0),
    sessionScore: q.sessionScore + (correct ? item.points : 0)
  };
  setState({ view: "quiz_check", quiz: updated });
  // 문제 하나를 풀 때마다 즉시 저장 (계속 누적됨)
  try {
    await sb("attempts", {
      method: "POST",
      body: { student_id: s.id, game_type: "quiz", unit_key: `${item.type}`, score: correct ? item.points : 0, total: item.points }
    });
  } catch (e) { /* 저장 실패해도 화면은 그대로 진행 */ }
  // 오답노트 갱신: 틀리면 기록하고, (혹시 예전에 틀렸다가 이번에) 맞히면 기록을 지운다.
  const levelKey = CLASS_LEVEL_KEY[s.class_name];
  if (correct) removeWrongQuestion(s.id, levelKey, item.qkey);
  else recordWrongQuestion(s.id, levelKey, item.qkey);
}

function quizNext() {
  startQuiz();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ============================================================
   오답노트 퀴즈 로직
   ============================================================ */
async function startWrongNote() {
  const s = state.student;
  const levelKey = CLASS_LEVEL_KEY[s.class_name];
  const qkeys = await loadWrongQuestions(s.id, levelKey);
  if (qkeys.length === 0) { setState({ view: "wrong_note_empty" }); return; }
  state.wrongNote = { className: s.class_name, levelKey, queue: shuffle(qkeys) };
  pickNextWrongQuestion();
}

/* 큐의 맨 앞 qkey로 문제를 찾아 화면에 낸다. 풀에서 사라진 문제(qkey 불일치)는
   건너뛰고 DB 기록도 정리한다. 큐가 비면 '오답노트 비었음' 화면으로 전환한다. */
function pickNextWrongQuestion() {
  const wn = state.wrongNote;
  const s = state.student;
  if (!wn || wn.queue.length === 0) { setState({ view: "wrong_note_empty" }); return; }
  const qkey = wn.queue[0];
  const item = findQuizItemByQkey(wn.levelKey, qkey);
  if (!item) {
    wn.queue = wn.queue.slice(1);
    removeWrongQuestion(s.id, wn.levelKey, qkey);
    pickNextWrongQuestion();
    return;
  }
  setState({ view: "wrong_quiz", wrongNote: { ...wn, item: shuffleQuestionOptions(item), pickedIdx: null, selectedIdx: null, correct: null } });
}

function pickWrongOpt(idx) {
  setState({ wrongNote: { ...state.wrongNote, pickedIdx: idx } });
}

async function checkWrongQuiz() {
  const wn = state.wrongNote;
  const s = state.student;
  const item = wn.item;
  if (wn.pickedIdx === null || wn.pickedIdx === undefined) return;
  const selectedIdx = wn.pickedIdx;
  const correct = selectedIdx === item.a;
  const newQueue = correct
    ? wn.queue.filter(k => k !== item.qkey)          // 맞혔으면 큐에서 완전히 제거
    : [...wn.queue.slice(1), wn.queue[0]];           // 틀렸으면 뒤로 보내서 계속 순환
  setState({ view: "wrong_quiz_check", wrongNote: { ...wn, selectedIdx, correct, queue: newQueue } });
  if (correct) removeWrongQuestion(s.id, wn.levelKey, item.qkey);
  else recordWrongQuestion(s.id, wn.levelKey, item.qkey);
}

function wrongQuizNext() {
  pickNextWrongQuestion();
}

/* ============================================================
   읽기(노래방 + 발음채점) 로직
   ============================================================ */
let karaokeTimers = [];
let recognizer = null;

function startReading(pid) {
  let passage = null;
  for (const lvl of Object.keys(PASSAGE_DATA)) {
    const found = (PASSAGE_DATA[lvl] || []).find(p => p.id === pid);
    if (found) { passage = found; break; }
  }
  if (!passage) return;
  setState({
    view: "reading",
    reading: { passage, rate: 1, playingIdx: -1, playedUpTo: -1, recording: false, transcript: "", score: null }
  });
}

function clearKaraokeTimers() { karaokeTimers.forEach(t => clearTimeout(t)); karaokeTimers = []; karaokePlaying = false; }

let karaokePlaying = false;

function playKaraoke() {
  if (!("speechSynthesis" in window)) { alert("이 브라우저는 음성 재생을 지원하지 않아요."); return; }
  const r = state.reading;
  clearKaraokeTimers();
  speechSynthesis.cancel();
  karaokePlaying = true;
  const text = r.passage.text;
  const words = text.split(/\s+/).filter(Boolean);
  const voices = speechSynthesis.getVoices();
  const koVoice = voices.find(v => v.lang && v.lang.startsWith("ko"));

  // 문장을 끊지 않고 통째로 재생해서 자연스럽게 들리게 함.
  // 하이라이트는 브라우저의 word-boundary 이벤트를 우선 쓰고,
  // 지원 안 되는 브라우저를 위해 글자 수 기반 타이머로 대체함
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ko-KR";
  utter.rate = 1;
  if (koVoice) utter.voice = koVoice;

  let usedBoundary = false;
  utter.onboundary = (ev) => {
    if (ev.name !== "word") return;
    usedBoundary = true;
    const charIdx = ev.charIndex;
    const wordIdx = text.slice(0, charIdx).trim().split(/\s+/).filter(Boolean).length;
    updateKaraokeHighlight(wordIdx);
  };
  utter.onend = () => { updateKaraokeHighlight(words.length); karaokePlaying = false; };
  utter.onerror = () => { updateKaraokeHighlight(words.length); karaokePlaying = false; };

  // word-boundary 미지원 브라우저를 위한 타이머 기반 대체 하이라이트
  const estCharsPerSec = 6.5;
  let elapsed = 0;
  words.forEach((w, i) => {
    const dur = Math.max(0.28, w.length / estCharsPerSec);
    elapsed += dur;
    const t = setTimeout(() => { if (!usedBoundary && karaokePlaying) updateKaraokeHighlight(i); }, elapsed * 1000);
    karaokeTimers.push(t);
  });

  speechSynthesis.speak(utter);
}

function updateKaraokeHighlight(wordIdx) {
  const r = state.reading;
  if (!r) return;
  r.playingIdx = wordIdx;
  r.playedUpTo = wordIdx;
  const box = document.getElementById("passage-box");
  if (!box) return;
  box.querySelectorAll(".rword").forEach(el => {
    const idx = Number(el.dataset.widx);
    el.classList.remove("playing", "played");
    if (idx < wordIdx) el.classList.add("played");
    else if (idx === wordIdx) el.classList.add("playing");
  });
}

let micSafetyTimer = null;

function toggleMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { alert("이 브라우저는 음성 인식을 지원하지 않아요. 최신 Chrome을 사용해보세요."); return; }
  const r = state.reading;
  if (r.recording) {
    if (micSafetyTimer) { clearTimeout(micSafetyTimer); micSafetyTimer = null; }
    try {
      if (recognizer) recognizer.stop();
    } catch (e) {
      try { if (recognizer) recognizer.abort(); } catch (e2) {}
    }
    // 브라우저가 stop() 이후 응답이 없는 경우를 대비한 안전장치 (버튼이 영구히 멈추지 않도록)
    micSafetyTimer = setTimeout(() => {
      if (state.reading && state.reading.recording) setState({ reading: { ...state.reading, recording: false } });
    }, 2500);
    return;
  }
  recognizer = new SpeechRecognition();
  recognizer.lang = "ko-KR";
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;
  let gotResult = false;
  recognizer.onresult = (ev) => {
    gotResult = true;
    if (micSafetyTimer) { clearTimeout(micSafetyTimer); micSafetyTimer = null; }
    const transcript = ev.results[0][0].transcript;
    const score = scorePronunciation(transcript, r.passage.text);
    saveReadingAttempt(score);
    setState({ reading: { ...state.reading, recording: false, transcript, score, micError: "" } });
  };
  recognizer.onerror = (ev) => {
    gotResult = true; // onend가 중복 메시지를 덮어쓰지 않도록
    if (micSafetyTimer) { clearTimeout(micSafetyTimer); micSafetyTimer = null; }
    const messages = {
      "no-speech": "목소리가 감지되지 않았어요. 마이크에 더 가까이서 다시 시도해주세요.",
      "audio-capture": "마이크를 찾을 수 없어요. 마이크가 연결되어 있는지 확인해주세요.",
      "not-allowed": "마이크 사용 권한이 거부됐어요. 브라우저 설정에서 마이크 권한을 허용해주세요.",
      "aborted": ""
    };
    const msg = messages[ev.error] !== undefined ? messages[ev.error] : `음성 인식 오류: ${ev.error}`;
    console.error("SpeechRecognition error:", ev.error);
    setState({ reading: { ...state.reading, recording: false, micError: msg } });
  };
  recognizer.onend = () => {
    if (micSafetyTimer) { clearTimeout(micSafetyTimer); micSafetyTimer = null; }
    if (state.reading && state.reading.recording) {
      const micError = gotResult ? "" : "목소리를 인식하지 못했어요. 다시 시도해주세요.";
      setState({ reading: { ...state.reading, recording: false, micError } });
    }
  };
  recognizer.start();
  setState({ reading: { ...state.reading, recording: true, transcript: "", score: null, micError: "" } });
}

function normalizeKo(str) { return str.replace(/[\s.,!?~"'…]/g, ""); }

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}

function scorePronunciation(recognized, target) {
  const a = normalizeKo(recognized);
  const b = normalizeKo(target);
  if (!b.length) return 0;
  const dist = levenshtein(a, b);
  const pct = Math.max(0, Math.round((1 - dist / Math.max(a.length, b.length, 1)) * 100));
  return pct;
}

async function saveReadingAttempt(score) {
  const r = state.reading;
  const s = state.student;
  try {
    await sb("attempts", {
      method: "POST",
      body: { student_id: s.id, game_type: "reading", unit_key: r.passage.id, score, total: 100 }
    });
  } catch (e) { /* 조용히 무시 */ }
}

  };

      "audio-capture": "마이크를 찾을 수 없어요. 마이크가 연결되어 있는지 확인해주세요.",
      "not-allowed": "마이크 사용 권한이 거부됐어요. 브라우저 설정에서 마이크 권한을 허용해주세요.",

/* 인식된 답변에 모범답안 키워드가 포함되어 있는지로 채점 (포함 비율 × 100) */
function scoreOralAnswer(recognized, keywords) {
  if (!keywords || keywords.length === 0) return 0;
  const a = normalizeKo(recognized);
  const hit = keywords.some(k => a.includes(normalizeKo(k)));
  // 키워드 중 하나라도 포함되면 정답 처리(핵심어 방식), 여러 키워드가 다 들어가면 만점에 가깝게 가산
  const hitCount = keywords.filter(k => a.includes(normalizeKo(k))).length;
  if (hitCount === 0) return 0;
  const pct = Math.round((hitCount / keywords.length) * 100);
  return Math.max(pct, hit ? 60 : 0); // 핵심어 하나만 맞아도 최소 60점은 인정
}

function oralNext() {
  const o = state.oral;
  if (o.idx + 1 < o.set.questions.length) {

    setTimeout(() => speakOralQuestion(), 300);

    finishOral();

}

async function finishOral() {
  const o = state.oral;
  const s = state.student;
  const avg = Math.round(o.results.reduce((sum, r) => sum + r, 0) / o.results.length);
  try {

  setState({ view: "oral_result" });
}

/* ============================================================
   캡처/유출 방지 (저작권 보호)
   완전한 차단은 불가능하지만, 억제 효과가 있는 조치들을 조합함:
   1) 학생 이름+시각 워터마크 (유출 시 추적 가능)
   2) 우클릭/텍스트 선택/복사 차단
   3) 다른 화면 전환 시 블러 처리
   4) 저작권 안내 문구
   ============================================================ */
let __wmCache = "";
function renderWatermark() {
  const overlay = document.getElementById("watermark-overlay");
  if (!overlay) return;
  const name = (state.student && state.student.name) ? state.student.name
             : (state.teacher && state.teacher.name) ? state.teacher.name
             : "KIIP";
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const label = `${name} · ${ts}`;
  if (label === __wmCache) return;
  __wmCache = label;

  const canvas = document.createElement("canvas");
  canvas.width = 320; canvas.height = 220;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "13px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.textAlign = "center";
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(-Math.PI/8);
  ctx.fillText(label, 0, 0);
  ctx.rotate(Math.PI/8);
  ctx.translate(-canvas.width/2, -canvas.height/2);

  const dataUrl = canvas.toDataURL("image/png");
  overlay.style.backgroundImage = `url(${dataUrl})`;
}

function setupCaptureProtection() {
  // 우클릭 차단
  document.addEventListener("contextmenu", (e) => {
    if (e.target.closest("input, textarea")) return;
    e.preventDefault();
  });
  // 텍스트 드래그 선택 차단
  document.addEventListener("selectstart", (e) => {
    if (e.target.closest("input, textarea")) return;
    e.preventDefault();
  });
  // 복사 차단
  document.addEventListener("copy", (e) => {
    if (e.target.closest("input, textarea")) return;
    e.preventDefault();
  });
  // 다른 화면(탭 전환, 화면 녹화 도구 등)으로 이동 시 블러 처리
  const guard = document.getElementById("capture-blur-guard");
  function showGuard() { if (guard) guard.classList.add("show"); }
  function hideGuard() { if (guard) guard.classList.remove("show"); }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) showGuard(); else hideGuard();
  });
  window.addEventListener("blur", showGuard);
  window.addEventListener("focus", hideGuard);

  // 워터마크는 1분마다 시각 갱신
  renderWatermark();
  setInterval(renderWatermark, 60000);
}

/* ============================================================
   bfcache(뒤로가기/닫기 캐시) 대응
   카카오톡 인앱 브라우저 등 일부 모바일 브라우저는 페이지를 "닫아도"
   완전히 종료하지 않고 메모리에 상태를 그대로 보관했다가(bfcache)
   다시 열 때 복원한다. 이 경우 init()이 재실행되지 않아
   sessionStorage를 지워도 로그인 화면이 그대로 남아있는 것처럼 보인다.
   ============================================================ */
// (1) unload 리스너를 등록하면 대부분의 브라우저가 해당 페이지를
//     bfcache 대상에서 제외하고, 다시 열 때 완전히 새로 로드한다.
window.addEventListener("unload", function () {});

// (2) 그래도 bfcache로 복원되는 경우를 대비한 안전장치:
//     persisted(bfcache 복원)로 페이지가 다시 보이면 세션을 지우고
//     완전히 새로고침해서 처음부터 다시 시작하게 한다.
window.addEventListener("pageshow", function (event) {
  if (event.persisted) {
    try { sessionStorage.removeItem("kiip_student_id"); } catch (e) {}
    location.reload();
  }
});

/* ============================================================
   시작
   ============================================================ */
setupCaptureProtection();
init();
</script>
